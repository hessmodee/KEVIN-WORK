<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Kevin HQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#0d0f0d; --bg2:#111410; --fg:#f0eee8; --muted:#969a91; --card:#151914; --card2:#1a1f19;
      --line:rgba(240,238,232,.09); --line2:rgba(240,238,232,.18); --sage:#88a27a; --sage2:#b6c9aa;
      --warn:#d0aa68; --bad:#d06452; --blue:#7d9aac; --violet:#9a91ad; --ram:#88a27a; --cpu:#d0aa68; --gpu:#a9a0ba;
      --shadow:0 20px 60px rgba(0,0,0,.24);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Figtree,ui-sans-serif,system-ui,sans-serif}
    body{padding:18px 16px 56px;background:
      radial-gradient(900px 500px at 18% -10%,rgba(136,162,122,.10),transparent 62%),
      radial-gradient(700px 420px at 88% 4%,rgba(125,154,172,.08),transparent 66%),
      linear-gradient(180deg,#0d0f0d 0%,#10120f 45%,#0d0f0d 100%)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,black,transparent 78%)}
    .wrap{max-width:1240px;margin:0 auto;position:relative}
    header{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
    .owl-box{width:76px;height:76px;flex:0 0 76px;position:relative}.owl{width:76px;height:76px;display:block}
    .owl-box:after{content:"";position:absolute;inset:2px;border-radius:50%;border:1px solid rgba(136,162,122,.15);opacity:.0;transform:scale(.8)}
    .owl .ln{fill:none;stroke:var(--fg);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .owl .fl{fill:transparent;transition:fill .8s ease,opacity .8s ease}.l1 .eye{fill:var(--fg)}
    .l2 .body{fill:rgba(136,162,122,.28)}.l2 .beak{fill:var(--warn)}.l3 .body{fill:rgba(136,162,122,.48)}.l3 .face{fill:rgba(240,238,232,.12)}
    .l4 .body{fill:#748a69}.l4 .face{fill:#d3ccba}.l4 .beak{fill:#e5b86b}.l4 .eye{fill:#151713}.l5 .body{fill:#88a27a}.l5 .face{fill:#e2dbc9}.l5 .hi{fill:#fff;opacity:.9}
    .st-working .owl-box{animation:bob 2.1s ease-in-out infinite,glow 2.1s ease-in-out infinite}.st-working .owl-box:after{opacity:1;animation:ring 2.2s ease-out infinite}.st-working .lids{transform-origin:16px 15px;animation:blink 3.2s ease-in-out infinite}.st-idle .lids{transform-origin:16px 15px;animation:blink 6.2s ease-in-out infinite}
    .st-warning .owl-box{filter:saturate(.75) hue-rotate(-8deg)}.st-offline .owl-box{filter:grayscale(1) brightness(.55)}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
    @keyframes glow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 14px rgba(136,162,122,.48))}}
    @keyframes ring{0%{transform:scale(.75);opacity:.65}100%{transform:scale(1.35);opacity:0}}
    @keyframes flow{to{stroke-dashoffset:-36}}
    @keyframes nodePulse{0%,100%{box-shadow:0 0 0 0 rgba(136,162,122,.0)}50%{box-shadow:0 0 0 8px rgba(136,162,122,.055)}}
    h1{font-family:Newsreader,Georgia,serif;font-size:35px;font-weight:500;margin:0;letter-spacing:-.025em}.sub{color:var(--muted);font-size:13px;margin-top:3px}.wx{color:var(--muted);font-size:12px;margin:7px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:760px}
    .head-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.version{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:5px 8px;border-radius:999px}
    .pill{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}.pill.ok{color:var(--sage2);border-color:rgba(136,162,122,.42)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
    .service-rail{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.service-chip{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;background:rgba(21,25,20,.78);border:1px solid var(--line);font-size:11px;color:var(--muted)}.service-chip b{font-weight:600;color:var(--fg)}.led{width:7px;height:7px;border-radius:50%;background:#565b54}.led.ok{background:var(--sage);box-shadow:0 0 12px rgba(136,162,122,.45)}.led.warn{background:var(--warn)}.led.bad{background:var(--bad)}
    nav{display:flex;gap:6px;flex-wrap:wrap;margin:17px 0 14px;position:sticky;top:0;z-index:12;background:linear-gradient(var(--bg) 72%,transparent);padding:8px 0 12px;backdrop-filter:blur(10px)}
    nav button,.filterbar button,.mini-btn{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font:inherit;font-size:11px;letter-spacing:.055em;cursor:pointer;transition:.18s ease}nav button{text-transform:uppercase}.filterbar button:hover,nav button:hover,.mini-btn:hover{border-color:var(--line2);color:var(--fg);transform:translateY(-1px)}nav button.on,.filterbar button.on{color:var(--fg);background:var(--card2);border-color:var(--line2);box-shadow:0 7px 24px rgba(0,0,0,.16)}
    .grid{display:grid;gap:12px}.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}
    @media(min-width:860px){.g2{grid-template-columns:1.25fr .75fr}.g2eq{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
    .card{background:linear-gradient(180deg,rgba(24,29,23,.95),rgba(19,23,18,.98));border:1px solid var(--line);border-radius:17px;padding:16px 18px;min-width:0;box-shadow:0 12px 40px rgba(0,0,0,.10)}.card.tight{padding:13px 15px}.card.hero{background:radial-gradient(700px 240px at 0% 0%,rgba(136,162,122,.09),transparent 60%),linear-gradient(180deg,rgba(25,30,24,.98),rgba(18,22,17,.98))}
    .k{font-size:10px;letter-spacing:.145em;text-transform:uppercase;color:var(--muted)}.v{font-size:22px;margin-top:5px;letter-spacing:-.015em}.h{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.45}.mono{font-variant-numeric:tabular-nums}.em{color:var(--fg)}
    .bar{height:7px;background:#242922;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#718a67,var(--sage2));border-radius:inherit}
    .row{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px;margin-top:11px}.row>div:first-child{min-width:0}
    .cap{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.cap:last-child{border-bottom:0}.cap .name{flex:1;min-width:0}
    .st{font-size:9px;letter-spacing:.105em;text-transform:uppercase;padding:4px 7px;border-radius:99px;white-space:nowrap}.proven,.healthy,.ready{color:#d9e9d1;background:rgba(136,162,122,.19)}.working{color:#e5f2df;background:rgba(136,162,122,.26)}.testing,.paused{color:#efdcb8;background:rgba(208,170,104,.16)}.planned,.queued,.idle{color:var(--muted);background:#242822}.locked,.offline{color:#858980;background:#1c201b}.degraded,.failed,.fail{color:#f0b3a8;background:rgba(208,100,82,.16)}
    .ev{display:grid;grid-template-columns:116px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.ev:last-child{border-bottom:0}.ev time{color:var(--muted);font-size:11px;line-height:1.35}.pass{color:var(--sage2)}
    .queue{counter-reset:q}.qitem{counter-increment:q;display:grid;grid-template-columns:30px 1fr auto;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.qitem:last-child{border-bottom:0}.qnum{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#242922;color:var(--muted);font-size:11px;border:1px solid rgba(255,255,255,.03)}.qitem.next .qnum{background:rgba(136,162,122,.18);color:var(--sage2);box-shadow:0 0 0 4px rgba(136,162,122,.05)}.qitem .name{font-size:13px;font-weight:600}.qitem .detail{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
    .legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 4px;color:var(--muted);font-size:11px}.legend span{display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.ram{background:var(--ram)}.cpu{background:var(--cpu)}.gpu{background:var(--gpu)}
    .chart-wrap{position:relative;margin-top:8px;min-height:300px}.chart{width:100%;height:auto;display:block;overflow:visible}.chart .gridline{stroke:rgba(240,238,232,.075);stroke-width:1}.chart .axis{fill:var(--muted);font-size:11px;font-family:Figtree,system-ui,sans-serif}.chart .ramline{stroke:var(--ram)}.chart .cpuline{stroke:var(--cpu)}.chart .gpuline{stroke:var(--gpu)}.chart .series{fill:none;stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round}.chart .hoverline{stroke:rgba(240,238,232,.38);stroke-width:1;stroke-dasharray:4 4}.chart .hoverdot{stroke:var(--bg);stroke-width:2}.chart-overlay{fill:transparent;cursor:crosshair}
    .chart-tip{position:absolute;display:none;pointer-events:none;background:#0c0f0c;border:1px solid var(--line2);border-radius:11px;padding:9px 10px;font-size:11px;line-height:1.55;box-shadow:var(--shadow);min-width:176px;z-index:4}.chart-tip b{color:var(--fg);font-weight:600}.chart-tip .muted{color:var(--muted)}
    .section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:9px}.section-head .right{color:var(--muted);font-size:11px;white-space:nowrap}
    .empty{color:var(--muted);font-size:12px;padding:12px 0}.note{border-left:2px solid var(--line2);padding-left:10px;color:var(--muted);font-size:12px;line-height:1.45}
    .resource-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.resource{display:grid;grid-template-columns:60px 1fr;gap:10px;align-items:center}.meter{--p:0;--c:var(--sage);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#252a23 0);position:relative}.meter:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#151914;border:1px solid rgba(255,255,255,.03)}.meter b{z-index:1;font-size:13px;font-weight:600}.resource .rname{font-size:12px;font-weight:600}.resource .rmeta{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.35}
    .mission-copy{font-family:Newsreader,Georgia,serif;font-size:26px;line-height:1.1;letter-spacing:-.02em;margin:5px 0 8px;max-width:680px}.mission-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}.next-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 9px;border-radius:10px;background:rgba(136,162,122,.08);border:1px solid rgba(136,162,122,.18);font-size:11px;color:var(--sage2)}
    .ops-scroll{overflow-x:auto;padding-bottom:4px}.ops-map{height:530px;min-width:780px;position:relative;border-radius:15px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(136,162,122,.11),transparent 24%),radial-gradient(circle at 18% 22%,rgba(125,154,172,.08),transparent 28%),linear-gradient(180deg,#111510,#0e120e)}.ops-map:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(240,238,232,.13) 1px,transparent 1px);background-size:28px 28px;opacity:.18;mask-image:radial-gradient(circle at center,black 10%,transparent 76%)}
    .ops-links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.op-link{fill:none;stroke:rgba(150,156,146,.23);stroke-width:1.4}.op-link.active{stroke:rgba(136,162,122,.63);stroke-dasharray:7 8;animation:flow 1.8s linear infinite}.op-link.warn{stroke:rgba(208,170,104,.5);stroke-dasharray:5 10}.op-link.off{stroke:rgba(120,124,116,.13)}
    .agent-node{position:absolute;transform:translate(-50%,-50%);width:132px;min-height:72px;border:1px solid var(--line);border-radius:14px;background:rgba(21,25,20,.94);color:var(--fg);padding:10px 11px;text-align:left;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.19);transition:.2s ease;z-index:2}.agent-node:hover,.agent-node.selected{border-color:var(--line2);transform:translate(-50%,-50%) translateY(-2px);background:rgba(27,32,26,.98)}.agent-node.working{animation:nodePulse 2s ease-in-out infinite;border-color:rgba(136,162,122,.36)}.agent-node.paused{border-color:rgba(208,170,104,.23)}.agent-node.failed{border-color:rgba(208,100,82,.3)}
    .agent-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.agent-name{font-size:12px;font-weight:700}.agent-role{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agent-led{width:8px;height:8px;border-radius:50%;background:#565b54;flex:0 0 8px}.agent-node.healthy .agent-led,.agent-node.ready .agent-led,.agent-node.working .agent-led{background:var(--sage);box-shadow:0 0 12px rgba(136,162,122,.5)}.agent-node.paused .agent-led{background:var(--warn)}.agent-node.failed .agent-led,.agent-node.degraded .agent-led{background:var(--bad)}
    .kevin-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:164px;height:164px;border-radius:50%;display:grid;place-items:center;z-index:3;background:radial-gradient(circle,rgba(136,162,122,.16),rgba(17,21,16,.96) 62%);border:1px solid rgba(136,162,122,.28);box-shadow:0 0 0 10px rgba(136,162,122,.025),0 20px 50px rgba(0,0,0,.25)}.kevin-core:before,.kevin-core:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(136,162,122,.12);inset:-18px}.kevin-core:after{inset:-34px;border-color:rgba(136,162,122,.06)}.kevin-core.working:before{animation:ring 2.1s ease-out infinite}.core-owl{width:82px;height:82px}.core-label{position:absolute;bottom:19px;text-align:center}.core-label b{display:block;font-size:12px}.core-label span{display:block;color:var(--muted);font-size:9px;margin-top:2px;text-transform:uppercase;letter-spacing:.12em}
    .inspector{min-height:290px}.inspect-head{display:flex;align-items:center;gap:9px}.inspect-dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}.inspect-dot.ok{background:var(--sage)}.inspect-dot.warn{background:var(--warn)}.inspect-dot.bad{background:var(--bad)}.inspect-title{font-size:19px;font-weight:600}.fact-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.fact{background:#121611;border:1px solid var(--line);border-radius:11px;padding:9px}.fact .fk{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.fact .fv{font-size:12px;margin-top:4px}.inspect-event{margin-top:13px;padding:10px 11px;border-radius:11px;background:#121611;border:1px solid var(--line);font-size:12px;line-height:1.45}
    .filterbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 3px}.activity-count{color:var(--muted);font-size:11px}
    .road{position:relative;margin-top:5px}.road:before{content:"";position:absolute;left:15px;top:19px;bottom:19px;width:1px;background:linear-gradient(var(--sage),var(--line) 35%,var(--line))}.road-step{position:relative;display:grid;grid-template-columns:32px 1fr auto;gap:12px;padding:13px 0}.road-step+.road-step{border-top:1px solid var(--line)}.road-dot{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#1d231c;border:1px solid var(--line2);font-size:11px;z-index:1}.road-step.next .road-dot{background:rgba(136,162,122,.20);color:var(--sage2);border-color:rgba(136,162,122,.38);box-shadow:0 0 0 5px rgba(136,162,122,.05)}.road-title{font-size:13px;font-weight:600}.road-detail{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
    footer{margin-top:20px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    @media(max-width:720px){body{padding:13px 10px 42px}.owl-box{width:64px;height:64px;flex-basis:64px}.owl{width:64px;height:64px}h1{font-size:31px}.resource-grid{grid-template-columns:1fr}.ev{grid-template-columns:88px 1fr}.fact-grid{grid-template-columns:1fr}.head-right{width:100%;justify-content:flex-start}.chart-wrap{min-height:260px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="owl-box" id="owlBox">
        <svg class="owl" viewBox="0 0 32 32" aria-hidden="true">
          <ellipse class="fl body" cx="16" cy="17.2" rx="10.2" ry="10.6"/><circle class="fl face" cx="16" cy="15.6" r="8.4"/><path class="ln" d="M8 6.2 11.2 11M24 6.2 20.8 11"/><circle class="ln" cx="12.2" cy="15.1" r="2.7"/><circle class="ln" cx="19.8" cy="15.1" r="2.7"/>
          <g class="lids"><circle class="fl eye" cx="12.2" cy="15.1" r=".95"/><circle class="fl eye" cx="19.8" cy="15.1" r=".95"/><circle class="fl hi" cx="11.7" cy="14.6" r=".28"/><circle class="fl hi" cx="19.3" cy="14.6" r=".28"/></g>
          <path class="fl beak" d="M16 17.1 14.35 19.4h3.3L16 17.1Z"/><path class="ln" d="M11 22.6c1.4 1.5 3.2 2.2 5 2.2s3.6-.7 5-2.2"/><circle class="ln" cx="16" cy="15.8" r="9.4"/>
        </svg>
      </div>
      <div style="min-width:0"><h1>Kevin HQ</h1><div class="sub" id="owlLabel">Level 1 · Brain</div><div class="wx" id="wx"></div></div>
    </div>
    <div class="head-right"><span class="version">HQ v4 · Mission Control</span><span class="pill" id="statusPill">...</span></div>
  </header>
  <div class="service-rail" id="serviceRail"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
  <footer><span id="foot">Kevin HQ</span><span id="foot2"></span></footer>
</div>
<script>
const TABS=[
  {id:"overview",label:"Overview"},{id:"ops",label:"Ops Floor"},{id:"activity",label:"Activity"},
  {id:"system",label:"System"},{id:"build",label:"Roadmap"},{id:"capabilities",label:"Capabilities"},{id:"diagnostics",label:"Diagnostics"}
];
const OWL=["","Brain","Senses","Memory","Hands","Teammate"];
let S=null,tab=(location.hash||"#overview").slice(1),activityFilter="all",selectedCrew="kevin";
if(!TABS.some(t=>t.id===tab))tab="overview";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function parseAt(iso){if(!iso)return null;const d=new Date(iso);return isNaN(d)?null:d}
function fullWhen(iso){const d=parseAt(iso);if(!d)return"";return d.toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}
function shortWhen(iso){const d=parseAt(iso);if(!d)return"";return d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
function axisWhen(iso){const d=parseAt(iso);if(!d)return"";return d.toLocaleString([],{month:"short",day:"numeric",hour:"numeric"})}
function ageSec(){const d=parseAt(S?.sync?.last||S?.generated_at);return !d?99999:Math.max(0,(Date.now()-d.getTime())/1000)}
function freshness(){const s=ageSec();if(s<180)return{label:"LIVE",text:Math.round(s)+" sec ago",cls:"ok"};if(s<2700)return{label:"OK",text:Math.round(s/60)+" min ago",cls:"ok"};return{label:"STALE",text:Math.round(s/60)+" min ago",cls:"warn"}}
function pct(d,t){return!t?0:Math.round(100*Number(d||0)/Number(t||0))}
function bar(d,t){return`<div class="bar"><i style="width:${Math.max(0,Math.min(100,pct(d,t)))}%"></i></div>`}
function statusClass(st){const s=String(st||"").toLowerCase();if(["healthy","ready","working","proven","pass","green","idle"].includes(s))return s==="idle"?"idle":"healthy";if(["testing","paused","warning","planned","queued"].includes(s))return s==="testing"||s==="paused"?"paused":"idle";if(["failed","fail","degraded","unhealthy"].includes(s))return"failed";return"offline"}
function pillClass(st){const c=statusClass(st);return c==="healthy"?"ok":c==="failed"?"bad":"warn"}
function sortedActivity(){return[...(S?.activity||[])].sort((a,b)=>(parseAt(b.at)?.getTime()||0)-(parseAt(a.at)?.getTime()||0))}
function sortedBuild(){return[...(S?.build||[])].map((x,i)=>({...x,_i:i})).sort((a,b)=>Number(a.order??a._i+1)-Number(b.order??b._i+1))}

function chartMarkup(samples,id){if(samples.length<2)return`<div class="empty">Not enough samples yet.</div>`;const W=980,H=306,L=50,R=18,T=14,B=38,pw=W-L-R,ph=H-T-B,n=samples.length,x=i=>L+(n===1?0:(i/(n-1))*pw),y=v=>T+(1-Math.max(0,Math.min(100,Number(v??0)))/100)*ph,line=k=>samples.map((s,i)=>`${x(i).toFixed(1)},${y(s[k]).toFixed(1)}`).join(" "),yTicks=[0,25,50,75,100],labels=[0,Math.floor((n-1)*.25),Math.floor((n-1)*.5),Math.floor((n-1)*.75),n-1];return`<div class="chart-wrap" data-chart="${id}"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="RAM CPU GPU utilization over time">${yTicks.map(v=>`<line class="gridline" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/><text class="axis" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}%</text>`).join("")}${labels.map((i,j)=>`<text class="axis" x="${x(i)}" y="${H-10}" text-anchor="${j===0?"start":j===labels.length-1?"end":"middle"}">${esc(axisWhen(samples[i].at))}</text>`).join("")}<polyline class="series ramline" points="${line("ram")}"/><polyline class="series cpuline" points="${line("cpu")}"/><polyline class="series gpuline" points="${line("gpu")}"/><line class="hoverline" data-hoverline x1="0" y1="${T}" x2="0" y2="${H-B}" visibility="hidden"/><circle class="hoverdot" data-dot="ram" r="4" fill="var(--ram)" visibility="hidden"/><circle class="hoverdot" data-dot="cpu" r="4" fill="var(--cpu)" visibility="hidden"/><circle class="hoverdot" data-dot="gpu" r="4" fill="var(--gpu)" visibility="hidden"/><rect class="chart-overlay" data-overlay x="${L}" y="${T}" width="${pw}" height="${ph}"/></svg><div class="chart-tip" data-tip></div></div>`}
function wireChart(containerId){const host=$(containerId);if(!host)return;const samples=pulseSamples();host.innerHTML=chartMarkup(samples,containerId);if(samples.length<2)return;const wrap=host.querySelector(".chart-wrap"),svg=host.querySelector("svg"),overlay=host.querySelector("[data-overlay]"),tip=host.querySelector("[data-tip]"),hover=host.querySelector("[data-hoverline]"),dots={ram:host.querySelector('[data-dot="ram"]'),cpu:host.querySelector('[data-dot="cpu"]'),gpu:host.querySelector('[data-dot="gpu"]')};const W=980,H=306,L=50,R=18,T=14,B=38,pw=W-L-R,ph=H-T-B,n=samples.length,x=i=>L+(i/(n-1))*pw,y=v=>T+(1-Math.max(0,Math.min(100,Number(v??0)))/100)*ph;const move=e=>{const rect=svg.getBoundingClientRect(),sx=(e.clientX-rect.left)*(W/rect.width),idx=Math.max(0,Math.min(n-1,Math.round(((sx-L)/pw)*(n-1)))),s=samples[idx],xx=x(idx);hover.setAttribute("x1",xx);hover.setAttribute("x2",xx);hover.setAttribute("visibility","visible");["ram","cpu","gpu"].forEach(k=>{const d=dots[k];if(s[k]==null){d.setAttribute("visibility","hidden");return}d.setAttribute("cx",xx);d.setAttribute("cy",y(s[k]));d.setAttribute("visibility","visible")});tip.innerHTML=`<b>${esc(fullWhen(s.at))}</b>${s.estimated?` <span class="muted">· reconstructed</span>`:""}<br><span style="color:var(--ram)">RAM</span> ${esc(s.ram??"-")}% &nbsp; <span style="color:var(--cpu)">CPU</span> ${esc(s.cpu??"-")}%<br><span style="color:var(--gpu)">GPU</span> ${esc(s.gpu??"-")}%`;tip.style.display="block";const px=e.clientX-wrap.getBoundingClientRect().left,py=e.clientY-wrap.getBoundingClientRect().top;tip.style.left=Math.min(Math.max(8,px+12),Math.max(8,wrap.clientWidth-196))+"px";tip.style.top=Math.max(6,py-80)+"px"};overlay.addEventListener("pointermove",move);overlay.addEventListener("pointerdown",move);overlay.addEventListener("pointerleave",()=>{hover.setAttribute("visibility","hidden");Object.values(dots).forEach(d=>d.setAttribute("visibility","hidden"));tip.style.display="none"})}
function bindDynamic(){if(tab==="overview")wireChart("overviewChart");if(tab==="system")wireChart("systemChart");if(tab==="ops"){document.querySelectorAll("[data-crew]").forEach(b=>b.onclick=()=>{selectedCrew=b.dataset.crew;draw()});const sa=$("showActivity");if(sa)sa.onclick=()=>{const c=crewById(selectedCrew);activityFilter=["forge","tick","bridge","reader"].includes(c.id)?c.id:"all";tab="activity";location.hash=tab;renderNav();draw()}}if(tab==="activity"){const f=$("filterbar");if(f)f.onclick=e=>{const b=e.target.closest("button[data-filter]");if(!b)return;activityFilter=b.dataset.filter;draw()}}}
function draw(){if(!S){$("main").innerHTML=`<div class="card">Waiting for dashboard state.</div>`;return}applyChrome();$("main").innerHTML=({overview,ops,activity,system,build,capabilities,diagnostics}[tab])();bindDynamic()}
async function load(){for(const u of["https://raw.githubusercontent.com/hessmodee/KEVIN-WORK/main/reports/dashboard-state.json","../reports/dashboard-state.json"]){try{const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"});if(r.ok){S=await r.json();break}}catch(e){}}renderNav();draw()}
window.addEventListener("hashchange",()=>{const h=(location.hash||"#overview").slice(1);if(TABS.some(t=>t.id===h)){tab=h;renderNav();draw()}});
load();setInterval(load,30000);
</script>
