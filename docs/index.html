<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kevin HQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#111210; --fg:#eceae4; --muted:#9a9b93; --card:#181916; --line:rgba(236,234,228,.1); --sage:#7d9270; --warn:#c4a574; --bad:#c45c48; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font-family:Figtree,ui-sans-serif,system-ui,sans-serif; }
    body { padding:20px 18px 56px; }
    .wrap { max-width:1080px; margin:0 auto; }
    header { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
    .owl-box { width:84px; height:84px; flex:0 0 84px; }
    .owl { width:84px; height:84px; display:block; }
    .owl .ln { fill:none; stroke:var(--fg); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
    .owl .fl { fill:transparent; transition:fill .8s ease, opacity .8s ease; }
    .l1 .eye { fill:var(--fg); }
    .l2 .body { fill:rgba(125,146,112,.28); } .l2 .beak { fill:#c4a574; }
    .l3 .body { fill:rgba(125,146,112,.48); } .l3 .face { fill:rgba(236,234,228,.12); }
    .l4 .body { fill:#6f8464; } .l4 .face { fill:#cfc9b8; } .l4 .beak { fill:#e0b56a; } .l4 .eye { fill:#1a1b18; }
    .l5 .body { fill:#7d9270; } .l5 .face { fill:#ddd6c6; } .l5 .hi { fill:#fff; opacity:.9; }
    .st-working .owl-box { animation:bob 2.1s ease-in-out infinite, glow 2.1s ease-in-out infinite; }
    .st-working .lids { transform-origin:16px 15px; animation:blink 3.2s ease-in-out infinite; }
    .st-idle .lids { transform-origin:16px 15px; animation:blink 6.2s ease-in-out infinite; }
    .st-warning { filter:saturate(.75) hue-rotate(-8deg); }
    .st-offline { filter:grayscale(1) brightness(.55); }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    @keyframes blink { 0%,92%,100%{transform:scaleY(1)} 96%{transform:scaleY(.08)} }
    @keyframes glow { 0%,100%{filter:none} 50%{filter:drop-shadow(0 0 10px rgba(125,146,112,.45))} }
    h1 { font-family:Newsreader,Georgia,serif; font-size:34px; font-weight:500; margin:0; letter-spacing:-.02em; }
    .sub { color:var(--muted); font-size:13px; margin-top:4px; }
    .pill { font-size:11px; letter-spacing:.14em; text-transform:uppercase; padding:4px 10px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
    .pill.ok { color:var(--sage); border-color:rgba(125,146,112,.4); }
    .pill.warn { color:var(--warn); } .pill.bad { color:var(--bad); }
    nav { display:flex; gap:6px; flex-wrap:wrap; margin:20px 0 16px; }
    nav button { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:7px 12px; font:inherit; font-size:12px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
    nav button.on { color:var(--fg); background:var(--card); border-color:rgba(236,234,228,.22); }
    .grid { display:grid; gap:12px; }
    @media (min-width:860px){ .g2{grid-template-columns:1.2fr .8fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
    .k { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    .v { font-size:22px; margin-top:6px; }
    .h { color:var(--muted); font-size:13px; margin-top:4px; }
    .bar { height:8px; background:#22231f; border-radius:99px; overflow:hidden; margin-top:8px; }
    .bar i { display:block; height:100%; background:var(--sage); }
    .row { display:flex; justify-content:space-between; gap:12px; font-size:14px; margin-top:12px; }
    .cap { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
    .cap:last-child { border-bottom:0; } .cap .name { flex:1; }
    .st { font-size:10px; letter-spacing:.12em; text-transform:uppercase; padding:3px 8px; border-radius:99px; }
    .proven { color:#d7e4cf; background:rgba(125,146,112,.22); }
    .testing { color:#ead9b8; background:rgba(196,165,116,.18); }
    .planned,.queued { color:var(--muted); background:#22231f; }
    .locked { color:#8a8680; background:#1c1d1a; }
    .next { color:#d7e4cf; background:rgba(125,146,112,.18); }
    .ev { display:flex; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
    .ev:last-child { border-bottom:0; }
    .ev time { color:var(--muted); font-size:12px; width:72px; flex:0 0 72px; }
    .pass { color:var(--sage); } .fail { color:var(--bad); }
    .wx { color:var(--muted); margin:8px 0 0; }
    footer { margin-top:22px; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="owl-box" id="owlBox">
        <svg class="owl" viewBox="0 0 32 32" aria-hidden="true">
          <ellipse class="fl body" cx="16" cy="17.2" rx="10.2" ry="10.6"/>
          <circle class="fl face" cx="16" cy="15.6" r="8.4"/>
          <path class="ln" d="M8 6.2 11.2 11M24 6.2 20.8 11"/>
          <circle class="ln" cx="12.2" cy="15.1" r="2.7"/>
          <circle class="ln" cx="19.8" cy="15.1" r="2.7"/>
          <g class="lids">
            <circle class="fl eye" cx="12.2" cy="15.1" r=".95"/>
            <circle class="fl eye" cx="19.8" cy="15.1" r=".95"/>
            <circle class="fl hi" cx="11.7" cy="14.6" r=".28"/>
            <circle class="fl hi" cx="19.3" cy="14.6" r=".28"/>
          </g>
          <path class="fl beak" d="M16 17.1 14.35 19.4h3.3L16 17.1Z"/>
          <path class="ln" d="M11 22.6c1.4 1.5 3.2 2.2 5 2.2s3.6-.7 5-2.2"/>
          <circle class="ln" cx="16" cy="15.8" r="9.4"/>
        </svg>
      </div>
      <div style="flex:1;min-width:220px">
        <h1>Kevin HQ</h1>
        <div class="sub" id="owlLabel">Level 1 · Brain</div>
      </div>
      <span class="pill" id="statusPill">...</span>
    </header>
    <p class="wx" id="wx"></p>
    <nav id="nav"></nav>
    <main id="main"></main>
    <footer id="foot">Kevin HQ</footer>
  </div>
<script>
const TABS = ["overview","activity","capabilities","system","build","diagnostics"];
const OWL = ["","Brain","Senses","Memory","Hands","Teammate"];
let S = null, tab = "overview";
const $ = id => document.getElementById(id);
function pillClass(st){
  if (["idle","healthy","working","live"].includes(st)) return "ok";
  if (["degraded","warning","stale"].includes(st)) return "warn";
  return "bad";
}
function parseAt(iso){
  if (!iso) return null;
  const d = new Date(iso);
  return isNaN(d) ? new Date(iso + "-06:00") : d;
}
function when(iso){
  const d = parseAt(iso);
  if (!d || isNaN(d)) return "";
  return d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
}
function ageSec(){
  const d = parseAt(S && S.sync && S.sync.last || S && S.generated_at);
  if (!d || isNaN(d)) return 99999;
  return Math.max(0, (Date.now() - d.getTime()) / 1000);
}
function freshness(){
  const s = ageSec();
  if (s < 180) return { label: "LIVE", cls:"ok", text: Math.round(s) + " sec ago" };
  if (s < 2700) return { label: "OK", cls:"ok", text: Math.round(s/60) + " min ago" };
  return { label: "STALE", cls:"warn", text: Math.round(s/60) + " min ago" };
}
function pct(d,t){ return !t ? 0 : Math.round(100 * d / t); }
function bar(d,t){ return `<div class="bar"><i style="width:${pct(d,t)}%"></i></div>`; }
function spark(arr, color){
  const a = (arr||[]).filter(n => typeof n === "number");
  if (a.length < 2) return `<svg width="120" height="28"></svg>`;
  const min = Math.min(...a), max = Math.max(...a);
  const span = Math.max(1, max-min);
  const w=120, h=28;
  const pts = a.map((v,i) => {
    const x = (i/(a.length-1))*w;
    const y = h - 2 - ((v-min)/span)*(h-4);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${color}" stroke-width="1.6" points="${pts}"/></svg>`;
}
function renderNav(){
  $("nav").innerHTML = TABS.map(t => `<button data-t="${t}" class="${t===tab?"on":""}">${t}</button>`).join("");
  $("nav").onclick = e => { const b=e.target.closest("button"); if(!b) return; tab=b.dataset.t; renderNav(); draw(); };
}
function applyChrome(){
  const o = (S && S.owl) || {level:1, state:"idle"};
  const fr = freshness();
  const st = (ageSec() > 2700) ? "offline" : (o.state||"idle");
  document.body.className = "st-" + st;
  $("owlBox").className = "owl-box l" + (o.level||1);
  $("owlLabel").textContent = "Level " + (o.level||1) + " \u00b7 " + (OWL[o.level]||"Brain");
  $("statusPill").textContent = (S.status||"unknown") + " \u00b7 " + fr.label;
  $("statusPill").className = "pill " + pillClass(S.status);
  $("wx").textContent = (S.weather && S.weather.summary) || "";
  $("foot").textContent = "Kevin HQ \u00b7 synchronized from HESS-PC \u00b7 " + fr.text;
}
function card(k,v,h){ return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div>${h?`<div class="h">${h}</div>`:""}</div>`; }
function progRow(p){
  return `<div class="row"><div>${p.label}</div><div class="h">${p.done} / ${p.total} \u00b7 ${pct(p.done,p.total)}%</div></div>${bar(p.done,p.total)}`;
}
function evRow(e){
  return `<div class="ev"><time>${when(e.at)}</time><div><span class="${e.result||""}">${e.detail||e.event}</span>
    <div class="h">${e.component||""}${(e.result? " \u00b7 "+e.result.toUpperCase():"")}</div></div></div>`;
}
function overview(){
  const t = S.current_task;
  const fr = freshness();
  const taskH = t ? ((t.total) ? `${t.phase||"in progress"} ${t.completed}/${t.total}` : (t.phase||"in progress")) : "No active task";
  const rd = S.roadmap || {done:1,total:6};
  return `<div class="grid g4">
    ${card("Status", (S.status||"-").toUpperCase(), t ? t.title : "Idle")}
    ${card("Brain", S.brain.name, (S.brain.mode||"Chat") + " \u00b7 " + S.brain.context)}
    ${card("Health", (S.health.overall||"-").toUpperCase(), S.self_check.summary)}
    ${card("Sync", fr.label, fr.text)}
  </div>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><div class="k">Capability progress</div>
      ${(S.progress||[]).map(progRow).join("")}
      <div class="row"><div>Roadmap completion</div><div class="h">${rd.done} / ${rd.total} \u00b7 ${pct(rd.done,rd.total)}%</div></div>${bar(rd.done,rd.total)}
    </div>
    <div class="card"><div class="k">Current task</div>
      <div class="v">${t ? t.title : "None"}</div>
      <div class="h">${taskH}</div>
      ${t && t.total ? bar(t.completed||0, t.total) : ""}
      <div class="k" style="margin-top:16px">Recent</div>
      ${(S.activity||[]).slice(0,7).map(evRow).join("") || "<div class='h'>Waiting for the next cycle.</div>"}
    </div>
  </div>
  <div class="grid g3" style="margin-top:12px">
    <div class="card"><div class="k">RAM</div><div class="v">${S.system.memory_pct??"-"}%</div>${spark((S.pulse||{}).ram, "#7d9270")}</div>
    <div class="card"><div class="k">CPU</div><div class="v">${S.system.cpu_pct??"-"}%</div>${spark((S.pulse||{}).cpu, "#c4a574")}</div>
    <div class="card"><div class="k">GPU</div><div class="v">${S.system.gpu_pct??"-"}%</div><div class="h">${S.system.gpu||""}</div>${spark((S.pulse||{}).gpu, "#9a9b93")}</div>
  </div>`;
}
function activity(){ return `<div class="card"><div class="k">Activity</div>${(S.activity||[]).map(evRow).join("")||"<div class='h'>No events yet.</div>"}</div>`; }
function capabilities(){
  return `<div class="card"><div class="k">Capabilities</div>
    <p class="h">PROVEN \u00b7 available &nbsp; TESTING \u00b7 under validation &nbsp; PLANNED \u00b7 queued &nbsp; LOCKED \u00b7 intentionally unavailable</p>
    ${S.capabilities.map(c => {
      const show = c.qa_total ? bar(c.qa_pass||0, c.qa_total) : "";
      return `<div class="cap"><div class="name">${c.label}<div class="h">${[c.version, (c.qa_total? (c.qa_pass||0)+"/"+c.qa_total+" QA":"")].filter(Boolean).join(" \u00b7 ")}</div>${show}</div><span class="st ${c.state}">${c.state}</span></div>`;
    }).join("")}
  </div>`;
}
function system(){
  const s = S.system||{}, svc = S.services||{};
  return `<div class="grid g4">
    ${card("Memory", (s.memory_pct??"-")+"%")}
    ${card("CPU", (s.cpu_pct??"-")+"%")}
    ${card("GPU", s.gpu||"-", (s.gpu_pct!=null? s.gpu_pct+"%":""))}
    ${card("Health", (S.health.overall||"-").toUpperCase())}
  </div>
  <div class="grid g3" style="margin-top:12px">
    <div class="card"><div class="k">RAM 24h</div>${spark((S.pulse||{}).ram, "#7d9270")}</div>
    <div class="card"><div class="k">CPU 24h</div>${spark((S.pulse||{}).cpu, "#c4a574")}</div>
    <div class="card"><div class="k">GPU 24h</div>${spark((S.pulse||{}).gpu, "#9a9b93")}</div>
  </div>
  <div class="grid g4" style="margin-top:12px">
    ${card("Tick", (svc.tick||"-").toUpperCase())}
    ${card("Bridge", (svc.bridge||"-").toUpperCase())}
    ${card("Ollama", (svc.ollama||"-").toUpperCase())}
    ${card("Gateway", (svc.gateway||"-").toUpperCase())}
  </div>`;
}
function build(){
  return `<div class="card"><div class="k">Build</div>${(S.build||[]).map(b =>
    `<div class="cap"><div class="name">${b.label}<div class="h">${b.detail||""}</div></div><span class="st ${b.state}">${b.state}</span></div>`).join("")}
  ${(S.roadmap)? `<div class="row"><div>Roadmap completion</div><div class="h">${S.roadmap.done}/${S.roadmap.total}</div></div>${bar(S.roadmap.done,S.roadmap.total)}`:""}
  </div>`;
}
function diagnostics(){
  const d = S.diagnostics||{};
  return `<div class="card"><div class="k">Diagnostics</div>
    <div class="h">Agent ${d.agent||"-"} \u00b7 ${d.model||""} \u00b7 ${d.context||""}</div>
    <div class="h">Chat QA ${d.chat_qa||"-"} \u00b7 tools ${d.tools??0} \u00b7 NO_REPLY ${d.noreply??0}</div>
    <div class="h">Self-check: ${S.self_check.summary}</div>
    <div class="h">Last sync ${S.sync.last}</div>
    <div class="h">Owl level ${S.owl.level} ${S.owl.state} \u00b7 schema ${S.schema}</div>
  </div>`;
}
function draw(){
  if (!S) { $("main").innerHTML = `<div class="card">Waiting for dashboard state.</div>`; return; }
  applyChrome();
  $("main").innerHTML = ({overview,activity,capabilities,system,build,diagnostics}[tab])();
}
async function load(){
  for (const u of [
    "https://raw.githubusercontent.com/hessmodee/KEVIN-WORK/main/reports/dashboard-state.json",
    "../reports/dashboard-state.json"
  ]) {
    try {
      const r = await fetch(u+"?t="+Date.now(), {cache:"no-store"});
      if (r.ok) { S = await r.json(); break; }
    } catch(e){}
  }
  renderNav(); draw();
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
