<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Kevin HQ</title>
  <style>
    :root{
      --bg:#0b0e0b;--bg2:#111610;--card:#141a13;--card2:#192018;--fg:#f2efe7;--muted:#969d92;
      --line:rgba(242,239,231,.09);--line2:rgba(242,239,231,.18);--sage:#8faa82;--sage2:#c2d5b6;
      --gold:#d5ad68;--bad:#d36d5b;--blue:#83a7bb;--violet:#a79aba;--ram:#8faa82;--cpu:#d5ad68;--gpu:#a79aba;
      --shadow:0 22px 70px rgba(0,0,0,.28)
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
    body{padding:18px 16px 54px;background:
      radial-gradient(1000px 540px at 14% -10%,rgba(143,170,130,.13),transparent 62%),
      radial-gradient(800px 480px at 90% 4%,rgba(131,167,187,.10),transparent 65%),
      linear-gradient(180deg,#0b0e0b,#0f130e 42%,#0b0e0b)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background:
      linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
      background-size:32px 32px;mask-image:linear-gradient(to bottom,#000,transparent 82%)}
    .wrap{max-width:1260px;margin:auto;position:relative}
    header{display:flex;align-items:center;gap:15px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
    h1{font-family:Georgia,serif;font-size:35px;font-weight:500;letter-spacing:-.03em;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:2px}
    .wx{color:var(--muted);font-size:12px;margin-top:6px;max-width:760px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .head-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.version,.pill{font-size:10px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .pill.ok{color:var(--sage2);border-color:rgba(143,170,130,.38)}.pill.warn{color:var(--gold)}.pill.bad{color:#f0b2a8}
    nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 14px;position:sticky;top:0;z-index:20;padding:8px 0 11px;background:linear-gradient(var(--bg) 72%,transparent);backdrop-filter:blur(10px)}
    button{font:inherit}.navbtn,.filterbtn{cursor:pointer;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
    .navbtn:hover,.filterbtn:hover,.navbtn.on,.filterbtn.on{color:var(--fg);border-color:var(--line2);background:var(--card2)}
    .service-rail{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.service-chip{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;background:rgba(20,26,19,.82);border:1px solid var(--line);font-size:11px;color:var(--muted)}
    .service-chip b{color:var(--fg);font-weight:600}.led{width:7px;height:7px;border-radius:50%;background:#555d53}.led.ok{background:var(--sage);box-shadow:0 0 12px rgba(143,170,130,.46)}.led.warn{background:var(--gold)}.led.bad{background:var(--bad)}
    .grid{display:grid;gap:12px}.g2{grid-template-columns:1fr}.g2eq{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}
    @media(min-width:880px){.g2{grid-template-columns:1.25fr .75fr}.g2eq{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
    .card{background:linear-gradient(180deg,rgba(24,31,23,.96),rgba(18,23,17,.98));border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 12px 38px rgba(0,0,0,.11);min-width:0}
    .hero{background:radial-gradient(740px 260px at 0 0,rgba(143,170,130,.10),transparent 60%),linear-gradient(180deg,rgba(25,32,24,.98),rgba(18,23,17,.99))}
    .k{font-size:10px;letter-spacing:.145em;text-transform:uppercase;color:var(--muted)}.v{font-size:22px;margin-top:5px;letter-spacing:-.02em}.h{color:var(--muted);font-size:12px;line-height:1.45;margin-top:4px}.mono{font-variant-numeric:tabular-nums}
    .section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}.section-head .right{font-size:11px;color:var(--muted)}
    .mission-copy{font-family:Georgia,serif;font-size:25px;line-height:1.12;letter-spacing:-.025em;margin:6px 0 7px;max-width:760px}
    .next-chip{display:inline-flex;gap:7px;align-items:center;padding:7px 10px;border:1px solid rgba(143,170,130,.2);background:rgba(143,170,130,.08);border-radius:11px;color:var(--sage2);font-size:11px}
    .row{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;margin-top:11px}.bar{height:7px;background:#252c24;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#728b68,var(--sage2))}
    .st{font-size:9px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:4px 7px}.ready,.healthy,.pass,.working{color:#dcebd5;background:rgba(143,170,130,.18)}.paused,.testing{color:#efd9ae;background:rgba(213,173,104,.16)}.idle,.queued,.planned{color:var(--muted);background:#232922}.failed,.degraded,.fail{color:#f1b3a8;background:rgba(211,109,91,.16)}.locked,.offline{color:#81887f;background:#1b201a}
    .queue{counter-reset:q}.qitem{display:grid;grid-template-columns:30px 1fr auto;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.qitem:last-child{border-bottom:0}.qnum{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#242b23;color:var(--muted);font-size:11px}.qitem.next .qnum{background:rgba(143,170,130,.18);color:var(--sage2)}.qname{font-size:13px;font-weight:650}.qdetail{font-size:12px;color:var(--muted);line-height:1.4;margin-top:3px}
    .ev{display:grid;grid-template-columns:122px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.ev time{font-size:11px;color:var(--muted)}.ev:last-child{border-bottom:0}
    .filterbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .resource-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.resource{display:grid;grid-template-columns:60px 1fr;gap:10px;align-items:center}.meter{--p:0;--c:var(--sage);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#252b24 0);position:relative}.meter:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#151a14}.meter b{position:relative;z-index:1;font-size:13px}.rname{font-size:12px;font-weight:650}.rmeta{font-size:10px;color:var(--muted);line-height:1.4;margin-top:3px}
    .chart-wrap{position:relative;margin-top:8px}.chart{display:block;width:100%;height:auto;overflow:visible}.gridline{stroke:rgba(242,239,231,.075);stroke-width:1}.axis{fill:var(--muted);font-size:10px}.series{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.ramline{stroke:var(--ram)}.cpuline{stroke:var(--cpu)}.gpuline{stroke:var(--gpu)}.hoverline{stroke:rgba(242,239,231,.45);stroke-dasharray:4 4}.hoverdot{stroke:var(--bg);stroke-width:2}.chart-tip{position:absolute;display:none;z-index:10;pointer-events:none;background:#090c09;border:1px solid var(--line2);border-radius:11px;padding:9px 10px;font-size:11px;line-height:1.55;box-shadow:var(--shadow);min-width:175px}
    .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin:10px 0 4px}.legend span{display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%}.ram{background:var(--ram)}.cpu{background:var(--cpu)}.gpu{background:var(--gpu)}
    .cap{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.cap:last-child{border-bottom:0}.cap .name{flex:1}.empty{font-size:12px;color:var(--muted);padding:12px 0}
    footer{display:flex;justify-content:space-between;gap:12px;margin-top:18px;color:var(--muted);font-size:10px}
    .kevin-avatar{--size:98px;width:var(--size);height:var(--size);position:relative;display:grid;place-items:center;flex:0 0 var(--size)}
    .kevin-avatar.large{--size:142px}
    .kevin-avatar svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 12px 22px rgba(0,0,0,.24))}
    .kv-head,.kv-body{fill:#94705e;transition:fill .8s}
    .kv-wing{fill:#684332;transition:fill .8s}
    .kv-face{fill:#d9c5b3;transition:fill .8s}
    .kv-eye-white{fill:#f8f5ed;stroke:#49372f;stroke-width:1.2}
    .kv-eye{fill:#111411}
    .kv-hi{fill:#fff}
    .kv-beak,.kv-foot{fill:#ef9838}
    .kv-ring{fill:none;stroke:rgba(143,170,130,.28);stroke-width:1.2}
    .kv-feather,.kv-brow{fill:none;stroke:#6d4a3a;stroke-width:2;stroke-linecap:round}
    .kv-wingline{fill:none;stroke:#a77f69;stroke-width:1.7;stroke-linecap:round}
    .kv-detail2,.kv-detail3,.kv-detail4,.kv-detail5{opacity:0;transition:opacity .8s}
    .kevin-avatar[data-level="2"] .kv-detail2,
    .kevin-avatar[data-level="3"] .kv-detail2,
    .kevin-avatar[data-level="4"] .kv-detail2,
    .kevin-avatar[data-level="5"] .kv-detail2{opacity:1}
    .kevin-avatar[data-level="3"] .kv-detail3,
    .kevin-avatar[data-level="4"] .kv-detail3,
    .kevin-avatar[data-level="5"] .kv-detail3{opacity:1}
    .kevin-avatar[data-level="4"] .kv-detail4,
    .kevin-avatar[data-level="5"] .kv-detail4{opacity:1}
    .kevin-avatar[data-level="5"] .kv-detail5{opacity:1}
    .kevin-avatar[data-level="2"] .kv-body,
    .kevin-avatar[data-level="2"] .kv-head{fill:#9b7662}
    .kevin-avatar[data-level="3"] .kv-body,
    .kevin-avatar[data-level="3"] .kv-head{fill:#a17d68}
    .kevin-avatar[data-level="4"] .kv-body,
    .kevin-avatar[data-level="4"] .kv-head{fill:#a98570}
    .kevin-avatar[data-level="5"] .kv-body,
    .kevin-avatar[data-level="5"] .kv-head{fill:#b08d77}
    .kevin-avatar[data-level="4"] .kv-face,
    .kevin-avatar[data-level="5"] .kv-face{fill:#ead9c8}
    .kv-bandage,.kv-bruise{opacity:0}
    .kevin-avatar.mode-degraded .kv-bandage,
    .kevin-avatar.mode-degraded .kv-bruise{opacity:1}
    .kevin-avatar.mode-degraded{filter:saturate(.72)}
    .kv-work{opacity:0}
    .kevin-avatar.mode-working .kv-work{opacity:1}
    .kevin-avatar.mode-idle .kv-eyes{transform-origin:60px 48px;animation:kvBlink 6.4s ease-in-out infinite}
    .kevin-avatar.mode-working{animation:kvBob 2.1s ease-in-out infinite}
    .kevin-avatar.mode-working:after{content:"";position:absolute;inset:5%;border-radius:50%;border:1px solid rgba(143,170,130,.3);animation:kvRing 2s ease-out infinite}
    .kevin-avatar.mode-working .kv-work{animation:kvSpark 1.4s ease-in-out infinite}
    @keyframes kvBlink{0%,91%,94%,100%{transform:scaleY(1)}92.5%{transform:scaleY(.08)}}
    @keyframes kvBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes kvRing{0%{transform:scale(.78);opacity:.7}100%{transform:scale(1.28);opacity:0}}
    @keyframes kvSpark{0%,100%{opacity:.25}50%{opacity:1}}
    .ops-stack{display:grid;gap:12px}.ops-scroll{overflow:hidden}.ops-map{height:560px;width:100%;min-width:0;position:relative;border:1px solid var(--line);border-radius:17px;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(143,170,130,.12),transparent 24%),radial-gradient(circle at 18% 15%,rgba(131,167,187,.07),transparent 26%),#10150f}
    .ops-map:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:28px 28px;opacity:.35}
    .ops-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.ops-lines line{stroke:rgba(242,239,231,.12);stroke-width:1.2}.ops-lines line.live{stroke:rgba(143,170,130,.55);stroke-dasharray:8 7;animation:flow 2.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}
    .agent-node{position:absolute;transform:translate(-50%,-50%);min-width:126px;max-width:165px;padding:10px 11px;border-radius:13px;border:1px solid var(--line);background:rgba(19,25,18,.94);box-shadow:0 10px 26px rgba(0,0,0,.18);cursor:pointer;text-align:left;color:var(--fg)}
    .agent-node:hover{border-color:var(--line2);transform:translate(-50%,-50%) translateY(-2px)}.agent-node.working{border-color:rgba(143,170,130,.45);box-shadow:0 0 0 6px rgba(143,170,130,.045),0 10px 28px rgba(0,0,0,.2)}.agent-node .name{font-size:12px;font-weight:700}.agent-node .role{font-size:10px;color:var(--muted);margin-top:2px}.agent-node .tiny{font-size:9px;color:var(--muted);margin-top:6px}
    .kevin-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:7px;z-index:3}.core-label{font-family:Georgia,serif;font-size:18px}.core-sub{font-size:10px;color:var(--muted);max-width:190px;text-align:center}
    .inspect{min-height:0}.inspect-title{font-family:Georgia,serif;font-size:23px;margin:4px 0}.inspect-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.inspect-mini{border:1px solid var(--line);border-radius:11px;padding:10px;background:#121711}
    .evolution{display:flex;gap:6px;margin-top:10px}.evo{height:6px;flex:1;border-radius:99px;background:#262d25}.evo.on{background:linear-gradient(90deg,#708a67,var(--sage2))}
    @media(max-width:700px){body{padding:12px 10px 44px}.resource-grid{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.mission-copy{font-size:22px}.ev{grid-template-columns:92px 1fr}.ops-map{height:610px}.agent-node{min-width:104px;max-width:120px;padding:9px}.kevin-avatar.large{--size:128px}.inspect-grid{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div id="headerKevin"></div>
      <div>
        <h1>Kevin HQ</h1>
        <div class="sub" id="owlLabel">Living mission control</div>
        <div class="wx" id="wx"></div>
      </div>
    </div>
    <div class="head-right">
      <span class="version">HQ v6a · Clear Ops</span>
      <span class="pill" id="statusPill">...</span>
    </div>
  </header>
  <div class="service-rail" id="serviceRail"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
  <footer><span id="foot">Kevin HQ</span><span id="foot2"></span></footer>
</div>
<script>
const TABS=[["overview","Overview"],["ops","Ops Floor"],["activity","Activity"],["system","System"],["build","Roadmap"],["capabilities","Capabilities"],["diagnostics","Diagnostics"]];
let S=null,tab=(location.hash||"#overview").slice(1),selectedCrew="kevin",activityFilter="all";
if(!TABS.some(x=>x[0]===tab))tab="overview";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function parseAt(v){if(!v)return null;const d=new Date(v);return Number.isNaN(d.getTime())?null:d}
function when(v){const d=parseAt(v);return d?d.toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",second:"2-digit"}):""}
function shortWhen(v){const d=parseAt(v);return d?d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):""}
function pct(a,b){return b?Math.round(100*Number(a||0)/Number(b)):0}
function freshness(){const d=parseAt(S?.sync?.last||S?.generated_at);const s=d?Math.max(0,(Date.now()-d.getTime())/1000):999999;if(s<180)return{label:"LIVE",text:Math.round(s)+" sec ago",cls:"ok"};if(s<2700)return{label:"OK",text:Math.round(s/60)+" min ago",cls:"ok"};return{label:"STALE",text:Math.round(s/60)+" min ago",cls:"warn"}}
function statusClass(v){const s=String(v||"").toLowerCase();if(["healthy","green","pass","ready","proven","working"].includes(s))return s==="working"?"working":"ready";if(["paused","testing","warning"].includes(s))return"paused";if(["fail","failed","degraded","unhealthy"].includes(s))return"failed";return"idle"}
function ledClass(v){const s=statusClass(v);return s==="ready"||s==="working"?"ok":s==="failed"?"bad":s==="paused"?"warn":""}
function sortedActivity(){return[...(S?.activity||[])].sort((a,b)=>(parseAt(b.at)?.getTime()||0)-(parseAt(a.at)?.getTime()||0))}
function sortedBuild(){return[...(S?.build||[])].sort((a,b)=>Number(a.order||99)-Number(b.order||99))}
function pulseSamples(){const p=S?.pulse||{};if(Array.isArray(p.samples))return p.samples.map(x=>({...x,_d:parseAt(x.at)})).filter(x=>x._d).sort((a,b)=>a._d-b._d);return[]}
function avatarLevel(){return Math.max(1,Math.min(5,Number(S?.avatar?.level??S?.owl?.level??1)))}
function avatarMode(){if(S?.health?.overall!=="healthy")return"degraded";if(S?.status==="working")return"working";return"idle"}
function avatarSvg(level,mode,large=false){
  return `<div class="kevin-avatar ${large?"large":""} mode-${mode}" data-level="${level}" title="Kevin · evolution level ${level}">
  <svg viewBox="0 0 120 120" aria-label="Kevin owl avatar">

    <circle class="kv-ring kv-detail5" cx="60" cy="59" r="53"/>

    <!-- rounded body -->
    <ellipse class="kv-body" cx="60" cy="74" rx="38" ry="38"/>

    <!-- broad side wings -->
    <path class="kv-wing" d="M34 60 C27 64 24 74 25 86 C26 97 32 104 41 104 C40 94 39 82 40 72 C41 66 39 62 34 60 Z"/>
    <path class="kv-wing" d="M86 60 C93 64 96 74 95 86 C94 97 88 104 79 104 C80 94 81 82 80 72 C79 66 81 62 86 60 Z"/>

    <!-- rounded head with small owl ears -->
    <path class="kv-head"
      d="M26 48
         Q19 35 22 19
         Q31 25 40 25
         Q49 18 60 18
         Q71 18 80 25
         Q89 25 98 19
         Q101 35 94 48
         Q100 56 97 66
         Q94 78 84 86
         Q74 94 60 94
         Q46 94 36 86
         Q26 78 23 66
         Q20 56 26 48Z"/>

    <!-- soft figure-eight face mask -->
    <ellipse class="kv-face" cx="44" cy="49" rx="22" ry="24"/>
    <ellipse class="kv-face" cx="76" cy="49" rx="22" ry="24"/>
    <path class="kv-face" d="M37 61 Q60 55 83 61 Q82 80 72 88 Q60 94 48 88 Q38 80 37 61Z"/>

    <!-- large friendly eyes -->
    <g class="kv-eyes">
      <circle class="kv-eye-white" cx="43" cy="48" r="15"/>
      <circle class="kv-eye-white" cx="77" cy="48" r="15"/>
      <circle class="kv-eye" cx="43" cy="50" r="7"/>
      <circle class="kv-eye" cx="77" cy="50" r="7"/>
      <circle class="kv-hi" cx="40.5" cy="46.5" r="2.1"/>
      <circle class="kv-hi" cx="74.5" cy="46.5" r="2.1"/>
    </g>

    <!-- orange beak -->
    <path class="kv-beak" d="M54 60 Q60 56 66 60 L60 70 Z"/>

    <!-- simple expression -->
    <path class="kv-brow kv-detail2" d="M32 35 Q42 29 51 35 M69 35 Q78 29 88 35"/>

    <!-- chest scallops -->
    <g class="kv-feather kv-detail3">
      <path d="M43 76 Q49 83 55 76"/>
      <path d="M55 76 Q61 83 67 76"/>
      <path d="M67 76 Q73 83 79 76"/>
      <path d="M49 88 Q55 95 61 88"/>
      <path d="M61 88 Q67 95 73 88"/>
    </g>

    <!-- simple wing marks -->
    <g class="kv-wingline kv-detail4">
      <path d="M29 77 Q34 73 38 77"/>
      <path d="M29 90 Q34 86 39 90"/>
      <path d="M91 77 Q86 73 82 77"/>
      <path d="M91 90 Q86 86 81 90"/>
    </g>

    <!-- little orange feet -->
    <ellipse class="kv-foot" cx="47" cy="108" rx="9" ry="5"/>
    <ellipse class="kv-foot" cx="73" cy="108" rx="9" ry="5"/>
    <circle class="kv-foot" cx="41" cy="110" r="2.5"/>
    <circle class="kv-foot" cx="53" cy="110" r="2.5"/>
    <circle class="kv-foot" cx="67" cy="110" r="2.5"/>
    <circle class="kv-foot" cx="79" cy="110" r="2.5"/>

    <!-- silly degraded-state details -->
    <g class="kv-bandage">
      <rect x="27" y="29" width="22" height="9" rx="3"
        fill="#eee1c7" stroke="#cdbb98" stroke-width="1.2"
        transform="rotate(-13 38 34)"/>
      <path d="M32 29 L44 38 M44 29 L32 38"
        stroke="#c5ad83" stroke-width="1"/>
    </g>
    <ellipse class="kv-bruise" cx="88" cy="67" rx="7" ry="4"
      fill="rgba(118,80,136,.55)"/>

    <!-- tiny activity sparks -->
    <g class="kv-work">
      <circle cx="16" cy="54" r="2.3" fill="#c2d5b6"/>
      <circle cx="103" cy="46" r="2.3" fill="#d5ad68"/>
      <circle cx="105" cy="69" r="1.7" fill="#83a7bb"/>
    </g>

  </svg></div>`;
}
function serviceChip(name,state){return`<div class="service-chip"><i class="led ${ledClass(state)}"></i><b>${esc(name)}</b><span>${esc(String(state||"unknown").toUpperCase())}</span></div>`}
function forgeInfo(){return S?.diagnostics?.candidate_forge||{}}
function buildLabState(){const a=forgeInfo();if(S?.current_task?.id==="design-forge")return"working";if(String(a.result||"").toLowerCase()==="pass"&&a.scheduled===true)return"ready";if(["fail","failed","legacy_fail"].includes(String(a.result||"").toLowerCase()))return"paused";return a.scheduled?"ready":"paused"}
function lastEvent(component){return sortedActivity().find(e=>String(e.component||"").toLowerCase()===component)||null}
function forgeState(){if(S?.current_task?.id==="night-forge")return"working";const e=lastEvent("forge");if(!e)return"ready";const r=String(e.result||"").toLowerCase();return r==="fail"||r==="failed"?"failed":"ready"}
function crew(){
 const d=S?.diagnostics||{},svc=S?.services||{},a=forgeInfo(),task=S?.current_task;
 return [
  {id:"kevin",name:"Kevin",role:"Main coordinator",state:avatarMode()==="working"?"working":(S?.health?.overall==="healthy"?"ready":"failed"),detail:task?.title||"Autonomous loop armed",what:task?.title||"Autonomous build schedule armed"},
  {id:"chat",name:"Chat",role:"Reasoning lane",state:"ready",detail:`${S?.brain?.name||"Qwen"} · ${S?.brain?.context||"8K"} · tools off`,what:"Fast local conversation and reasoning"},
  {id:"reader",name:"Reader",role:"Read-only senses",state:d.reader_boundary==="green"?"ready":"paused",detail:d.reader_boundary==="green"?`Boundary GREEN · ${d.reader_visible_tools??1} visible tool`:"Reader proof incomplete",what:"Narrow typed sensing only"},
  {id:"forge",name:"Night Forge",role:"QA gate",state:forgeState(),detail:lastEvent("forge")?.detail||"Hourly safety and regression cycle",what:forgeState()==="working"?"Running gates before autonomous design":"Ready for next scheduled cycle"},
  {id:"lab",name:"Build Lab",role:"Design Forge v3",state:buildLabState(),detail:a.last_mission?`Last build: ${a.last_mission}`:"Isolated candidate engineering",what:buildLabState()==="working"?`Building ${task?.title||"a candidate"}`:(a.scheduled?"Autonomous candidate generation is armed":"Candidate generation is paused")},
  {id:"tick",name:"Tick",role:"Health + telemetry",state:statusClass(svc.tick),detail:lastEvent("tick")?.detail||"Deterministic refresh cycle",what:"Updates health, reports, telemetry, and HQ state"},
  {id:"bridge",name:"Bridge",role:"GitHub sync",state:statusClass(svc.bridge),detail:lastEvent("bridge")?.detail||"Pull + publish lane",what:"Publishes sanitized HQ state"},
  {id:"ollama",name:"Ollama",role:"Local inference",state:statusClass(svc.ollama),detail:S?.brain?.name||"Local model runtime",what:"Serves Kevin's local models"}
 ]
}
function crewById(id){return crew().find(x=>x.id===id)||crew()[0]}
function renderNav(){$("nav").innerHTML=TABS.map(([id,label])=>`<button class="navbtn ${tab===id?"on":""}" data-tab="${id}">${label}</button>`).join("");$("nav").onclick=e=>{const b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;location.hash=tab;renderNav();draw()}}
function applyChrome(){const f=freshness(),lvl=avatarLevel(),mode=avatarMode();$("headerKevin").innerHTML=avatarSvg(lvl,mode,false);$("owlLabel").textContent=`Evolution ${lvl}/5 · ${mode==="working"?"working":mode==="degraded"?"needs attention":"ready"}`;$("wx").textContent=S?.weather?.summary||"";$("statusPill").textContent=`${String(S?.status||"unknown").toUpperCase()} · ${f.label}`;$("statusPill").className=`pill ${S?.health?.overall==="healthy"?"ok":"bad"}`;const d=S?.diagnostics||{},svc=S?.services||{};$("serviceRail").innerHTML=[serviceChip("Reader",d.reader_boundary==="green"?"green":"testing"),serviceChip("Night Forge",forgeState()),serviceChip("Build Lab",buildLabState()),serviceChip("Ollama",svc.ollama),serviceChip("Bridge",svc.bridge)].join("");$("foot").textContent=`Kevin HQ · ${f.text}`;$("foot2").textContent=`State schema ${S?.schema||"-"}`}
function card(k,v,h=""){return`<div class="card"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>${h?`<div class="h">${esc(h)}</div>`:""}</div>`}
function bar(d,t){return`<div class="bar"><i style="width:${Math.max(0,Math.min(100,pct(d,t)))}%"></i></div>`}
function queueHtml(limit=99){return sortedBuild().slice(0,limit).map((b,i)=>`<div class="qitem ${esc(b.state||"")}"><div class="qnum">${esc(b.order??i+1)}</div><div><div class="qname">${esc(b.label)}</div><div class="qdetail">${esc(b.detail||"")}</div></div><span class="st ${esc(b.state||"queued")}">${esc(b.state||"queued")}</span></div>`).join("")}
function eventHtml(e){const r=String(e.result||"").toLowerCase();return`<div class="ev"><time class="mono">${esc(when(e.at))}</time><div><div class="${esc(r)}">${esc(e.detail||e.event||"Event")}</div><div class="h">${esc(e.component||"")}${r?" · "+esc(r.toUpperCase()):""}${e.duration_ms?" · "+Math.round(e.duration_ms/1000)+"s":""}</div></div></div>`}
function overview(){const t=S?.current_task,a=forgeInfo(),s=S?.system||{},rd=S?.roadmap||{done:0,total:0},next=sortedBuild()[0],ev=sortedActivity();const readyBuild=buildLabState()==="ready";const hero=t?`Kevin is working on ${t.title}.`:`Kevin is healthy and ${readyBuild?"his autonomous Build Lab is armed":"standing by"}.`;return`<div class="card hero"><div class="section-head"><div><div class="k">Living mission control</div><div class="mission-copy">${esc(hero)}${next?` Next major objective: ${esc(next.label)}.`:""}</div></div>${readyBuild?`<div class="next-chip">Build Lab · ARMED</div>`:""}</div></div><div class="grid g4" style="margin-top:12px">${card("Status",String(S?.status||"-").toUpperCase(),t?t.title:"No process running this instant")}${card("Health",String(S?.health?.overall||"-").toUpperCase(),`${S?.health?.failed_checks??0} failed checks`)}${card("Build Lab",buildLabState().toUpperCase(),a.last_mission?`last: ${a.last_mission} · iteration ${a.iteration??"-"}`:"waiting for first design")}${card("Promotion",String(a.promotion||"blocked").toUpperCase(),"Candidates cannot self-promote")}</div><div class="grid g2" style="margin-top:12px"><div class="card"><div class="section-head"><div><div class="k">Live crew</div><div class="h">Real workers and faculties</div></div><div class="right">Build Lab generates isolated candidates</div></div><div class="service-rail">${crew().filter(x=>["reader","forge","lab","tick","bridge"].includes(x.id)).map(x=>serviceChip(x.name,x.state)).join("")}</div><div class="k" style="margin-top:16px">Execution roadmap</div>${queueHtml(4)}</div><div class="card"><div class="k">Current operation</div><div class="v">${esc(t?.title||"Ready")}</div><div class="h">${esc(t?.phase||"Autonomous schedule remains armed.")}</div><div class="k" style="margin-top:16px">Latest activity</div>${ev.slice(0,5).map(eventHtml).join("")||`<div class="empty">Waiting for activity.</div>`}</div></div><div class="grid g2eq" style="margin-top:12px"><div class="card"><div class="section-head"><div><div class="k">System load</div><div class="h">Current · 24-hour average · peak</div></div></div><div class="resource-grid">${resource("RAM","ram",s.memory_pct,"var(--ram)")}${resource("CPU","cpu",s.cpu_pct,"var(--cpu)")}${resource("GPU","gpu",s.gpu_pct,"var(--gpu)")}</div></div><div class="card"><div class="k">Kevin evolution</div><div class="v">Level ${avatarLevel()} / 5</div><div class="h">Visual detail advances only with proven major capabilities.</div><div class="evolution">${[1,2,3,4,5].map(n=>`<i class="evo ${n<=avatarLevel()?"on":""}"></i>`).join("")}</div>${(S?.progress||[]).slice(0,4).map(p=>`<div class="row"><span>${esc(p.label)}</span><span class="h mono">${esc(p.done)}/${esc(p.total)} · ${pct(p.done,p.total)}%</span></div>${bar(p.done,p.total)}`).join("")}<div class="row"><span>Roadmap</span><span class="h mono">${rd.done}/${rd.total} · ${pct(rd.done,rd.total)}%</span></div>${bar(rd.done,rd.total)}</div></div><div class="card" style="margin-top:12px">${chartHtml()}</div>`}
function resource(name,key,current,color){const a=pulseSamples().map(x=>Number(x[key])).filter(Number.isFinite),avg=a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null,peak=a.length?Math.max(...a):null;return`<div class="resource"><div class="meter" style="--p:${Math.max(0,Math.min(100,Number(current||0)))};--c:${color}"><b>${esc(current??"-")}%</b></div><div><div class="rname">${esc(name)}</div><div class="rmeta">24h avg ${esc(avg??"-")}%<br>peak ${esc(peak??"-")}%</div></div></div>`}
function chartHtml(){return`<div class="section-head"><div><div class="k">24-hour telemetry</div><div class="h">RAM · CPU · GPU · hover for exact time and values</div></div><div class="right">${pulseSamples().length} samples</div></div><div class="legend"><span><i class="dot ram"></i>RAM</span><span><i class="dot cpu"></i>CPU</span><span><i class="dot gpu"></i>GPU</span></div><div class="chart-wrap" id="chartWrap"><svg id="chart" class="chart" viewBox="0 0 1000 330" preserveAspectRatio="none"></svg><div id="chartTip" class="chart-tip"></div></div>`}
function drawChart(){const svg=$("chart"),tip=$("chartTip");if(!svg)return;const arr=pulseSamples(),L=58,R=20,T=18,B=42,W=1000,H=330,pw=W-L-R,ph=H-T-B;if(!arr.length){svg.innerHTML=`<text x="50%" y="50%" text-anchor="middle" class="axis">No telemetry yet</text>`;return}const x=i=>L+(arr.length===1?pw/2:i*pw/(arr.length-1)),y=v=>T+(100-Math.max(0,Math.min(100,Number(v||0))))*ph/100;let h="";[0,25,50,75,100].forEach(v=>{h+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-9}" y="${y(v)+4}" text-anchor="end">${v}%</text>`});const ticks=[0,.25,.5,.75,1].map(f=>Math.round(f*(arr.length-1)));ticks.forEach(i=>{h+=`<text class="axis" x="${x(i)}" y="${H-15}" text-anchor="middle">${esc(shortWhen(arr[i].at))}</text>`});[["ram","ramline"],["cpu","cpuline"],["gpu","gpuline"]].forEach(([k,c])=>{const pts=arr.map((s,i)=>Number.isFinite(Number(s[k]))?`${x(i)},${y(s[k])}`:null).filter(Boolean).join(" ");h+=`<polyline class="series ${c}" points="${pts}"/>`});h+=`<line id="hoverLine" class="hoverline" x1="0" x2="0" y1="${T}" y2="${H-B}" style="display:none"/><circle id="hr" class="hoverdot" r="4" fill="var(--ram)" style="display:none"/><circle id="hc" class="hoverdot" r="4" fill="var(--cpu)" style="display:none"/><circle id="hg" class="hoverdot" r="4" fill="var(--gpu)" style="display:none"/><rect id="chartHit" x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent" style="cursor:crosshair"/>`;svg.innerHTML=h;const hit=$("chartHit"),line=$("hoverLine"),dots={ram:$("hr"),cpu:$("hc"),gpu:$("hg")};hit.onmousemove=e=>{const rect=svg.getBoundingClientRect(),px=(e.clientX-rect.left)*W/rect.width,idx=Math.max(0,Math.min(arr.length-1,Math.round((px-L)/pw*(arr.length-1)))),s=arr[idx],xx=x(idx);line.style.display="";line.setAttribute("x1",xx);line.setAttribute("x2",xx);Object.entries(dots).forEach(([k,d])=>{if(Number.isFinite(Number(s[k]))){d.style.display="";d.setAttribute("cx",xx);d.setAttribute("cy",y(s[k]))}else d.style.display="none"});tip.style.display="block";tip.innerHTML=`<b>${esc(when(s.at))}</b><br>RAM ${esc(s.ram??"-")}% · CPU ${esc(s.cpu??"-")}% · GPU ${esc(s.gpu??"-")}%${s.estimated?"<br><span style='color:var(--muted)'>historical timestamp reconstructed</span>":""}`;tip.style.left=Math.min(rect.width-190,Math.max(6,(e.clientX-rect.left)+12))+"px";tip.style.top=Math.max(6,(e.clientY-rect.top)-54)+"px"};hit.onmouseleave=()=>{line.style.display="none";Object.values(dots).forEach(d=>d.style.display="none");tip.style.display="none"}}
function ops(){
 const c=crew(),positions={chat:[14,18],reader:[14,50],forge:[18,80],lab:[82,80],tick:[86,50],bridge:[86,18],ollama:[50,13]};
 return`<div class="ops-stack"><div class="card"><div class="section-head"><div><div class="k">Operations floor</div><div class="h">Real topology · animated only when a lane is actually working</div></div><div class="right">Build Lab is isolated R&D</div></div><div class="ops-scroll"><div class="ops-map" id="opsMap"><svg class="ops-lines" viewBox="0 0 100 100" preserveAspectRatio="none">${c.filter(x=>x.id!=="kevin").map(x=>{const p=positions[x.id]||[50,50],live=x.state==="working";return`<line class="${live?"live":""}" x1="50" y1="50" x2="${p[0]}" y2="${p[1]}"/>`}).join("")}</svg><div class="kevin-core">${avatarSvg(avatarLevel(),avatarMode(),true)}<div class="core-label">Kevin</div><div class="core-sub">${esc(S?.current_task?.title||"Autonomous build armed")}</div></div>${c.filter(x=>x.id!=="kevin").map(x=>{const p=positions[x.id]||[50,50];return`<button class="agent-node ${x.state}" data-id="${x.id}" style="left:${p[0]}%;top:${p[1]}%"><div class="name">${esc(x.name)}</div><div class="role">${esc(x.role)}</div><div class="tiny">${esc(String(x.state).toUpperCase())}</div></button>`}).join("")}</div></div></div><div class="card inspect" id="inspect"></div></div>`
}
function renderInspect(){
 const x=crewById(selectedCrew),a=forgeInfo(),e=lastEvent(x.id),isLab=x.id==="lab";
 const evidenceAt=isLab?(a.updated_at?when(a.updated_at):"No recorded run"):(e?.at?when(e.at):(x.id==="kevin"?when(S?.current_task?.started_at||S?.generated_at):"No recorded event"));
 const evidenceText=isLab?(a.last_mission?`${a.last_mission} · ${String(a.result||"unknown").toUpperCase()}`:"No candidate evidence yet"):(e?(String(e.detail||e.event||"Event")+(e.result?` · ${String(e.result).toUpperCase()}`:"")):(x.id==="kevin"?(S?.current_task?.title||"HQ state snapshot"):"No event recorded"));
 $("inspect").innerHTML=`<div class="k">Selected worker</div><div class="inspect-title">${esc(x.name)}</div><span class="st ${esc(x.state)}">${esc(String(x.state).toUpperCase())}</span><div class="h" style="margin-top:10px">${esc(x.role)}</div><div class="k" style="margin-top:16px">Now</div><div class="v" style="font-size:16px">${esc(x.detail)}</div><div class="h">${esc(x.what)}</div><div class="inspect-grid"><div class="inspect-mini"><div class="k">Last activity</div><div class="v" style="font-size:13px">${esc(evidenceAt)}</div></div><div class="inspect-mini"><div class="k">Evidence</div><div class="v" style="font-size:13px">${esc(evidenceText)}</div></div></div>${x.id==="lab"?`<div class="k" style="margin-top:18px">Build Lab contract</div><div class="h">Scheduled: ${a.scheduled===true?"YES":"NO"} · promotion: ${esc(a.promotion||"blocked")} · mode: ${esc(a.mode||"-")}</div><div class="h">Last mission: ${esc(a.last_mission||"-")} · iteration ${esc(a.iteration??"-")}</div>`:""}`
}
function activity(){const ev=sortedActivity(),comps=["all",...new Set(ev.map(x=>String(x.component||"kevin").toLowerCase()))],shown=activityFilter==="all"?ev:ev.filter(x=>String(x.component||"kevin").toLowerCase()===activityFilter);return`<div class="card"><div class="section-head"><div><div class="k">Activity</div><div class="h">Newest first · evidence, duration, result</div></div><div class="right">${shown.length} events</div></div><div class="filterbar">${comps.map(c=>`<button class="filterbtn ${activityFilter===c?"on":""}" data-filter="${esc(c)}">${esc(c)}</button>`).join("")}</div>${shown.map(eventHtml).join("")||`<div class="empty">No matching activity.</div>`}</div>`}
function system(){const s=S?.system||{};return`<div class="grid g3">${card("RAM",`${s.memory_pct??"-"}%`,"current load")}${card("CPU",`${s.cpu_pct??"-"}%`,"current load")}${card("GPU",`${s.gpu_pct??"-"}%`,s.gpu||"")}</div><div class="card" style="margin-top:12px">${chartHtml()}</div>`}
function roadmap(){return`<div class="card"><div class="k">Ordered execution roadmap</div><div class="h">Major capability milestones drive Kevin's visual evolution.</div><div class="queue" style="margin-top:8px">${queueHtml()}</div></div>`}
function capabilities(){return`<div class="card"><div class="k">Capabilities</div>${(S?.capabilities||[]).map(c=>`<div class="cap"><div class="name"><div>${esc(c.label)}</div><div class="h">${esc(c.version||"")} ${c.last_verified?"· verified "+esc(c.last_verified):""}</div></div><div class="h mono">${esc(c.qa_pass??0)}/${esc(c.qa_total??0)}</div><span class="st ${esc(c.state||"planned")}">${esc(c.state||"planned")}</span></div>`).join("")}</div>`}
function diagnostics(){const d=S?.diagnostics||{},a=forgeInfo();return`<div class="grid g2eq"><div class="card"><div class="k">Runtime</div>${Object.entries({Agent:d.agent,Model:d.model,Context:d.context,"Chat QA":d.chat_qa,"Reader boundary":d.reader_boundary,"Visible Reader tools":d.reader_visible_tools}).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span class="h mono">${esc(v??"-")}</span></div>`).join("")}</div><div class="card"><div class="k">Autonomous build</div>${Object.entries({"Forge result":a.result,"Forge mode":a.mode,Scheduled:a.scheduled,"Last mission":a.last_mission,Iteration:a.iteration,Promotion:a.promotion,Updated:a.updated_at?when(a.updated_at):"-"}).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span class="h mono">${esc(v??"-")}</span></div>`).join("")}</div></div>`}
function draw(){if(!S)return;applyChrome();if(tab==="overview")$("main").innerHTML=overview();if(tab==="ops")$("main").innerHTML=ops();if(tab==="activity")$("main").innerHTML=activity();if(tab==="system")$("main").innerHTML=system();if(tab==="build")$("main").innerHTML=roadmap();if(tab==="capabilities")$("main").innerHTML=capabilities();if(tab==="diagnostics")$("main").innerHTML=diagnostics();if(tab==="overview"||tab==="system")drawChart();if(tab==="ops"){renderInspect();$("opsMap").onclick=e=>{const b=e.target.closest("[data-id]");if(!b)return;selectedCrew=b.dataset.id;renderInspect()}}if(tab==="activity")$("main").onclick=e=>{const b=e.target.closest("[data-filter]");if(!b)return;activityFilter=b.dataset.filter;draw()}}
async function fetchState(){
  const bust=Date.now();
  const rawUrl=`https://raw.githubusercontent.com/hessmodee/KEVIN-WORK/main/reports/dashboard-state.json?ts=${bust}`;
  try{
    const r=await fetch(rawUrl,{cache:"no-store"});
    if(r.ok)return await r.json();
  }catch(_e){}
  const apiUrl=`https://api.github.com/repos/hessmodee/KEVIN-WORK/contents/reports/dashboard-state.json?ref=main&ts=${bust}`;
  const r=await fetch(apiUrl,{cache:"no-store",headers:{Accept:"application/vnd.github+json"}});
  if(!r.ok)throw new Error("state "+r.status);
  const payload=await r.json();
  if(!payload.content)throw new Error("state content missing");
  const bin=atob(String(payload.content).replace(/\s/g,""));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return JSON.parse(new TextDecoder("utf-8").decode(bytes));
}
async function load(){try{S=await fetchState();renderNav();draw()}catch(e){$("main").innerHTML=`<div class="card"><div class="k">HQ state unavailable</div><div class="v">Waiting for Kevin</div><div class="h">${esc(e.message)}</div></div>`}}
load();setInterval(load,15000);
