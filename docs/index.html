<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<title>Kevin HQ</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e0b}#kevinCore{display:block;width:100%;height:100%;border:0;background:#0b0e0b}
.hqDock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:1000;display:flex;align-items:center;gap:7px;padding:6px;border-radius:999px;border:1px solid rgba(194,213,182,.22);background:rgba(8,12,8,.88);backdrop-filter:blur(14px);box-shadow:0 14px 42px rgba(0,0,0,.36)}
.hqLaunch{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:999px;border:1px solid rgba(194,213,182,.25);text-decoration:none;font:750 11px/1 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.025em;white-space:nowrap}.hqLaunch:hover{filter:brightness(1.08)}.hqLaunch:focus-visible{outline:2px solid #fff;outline-offset:3px}.hqLaunch small{font-size:8px;font-weight:700;opacity:.64;letter-spacing:.08em;text-transform:uppercase}
#kevinTalkLaunch{background:#c2d5b6;color:#10150f}#kevinHandoverLaunch{background:rgba(230,234,223,.07);color:#e6eadf}
@media(max-width:520px){.hqDock{bottom:8px;max-width:calc(100vw - 16px)}.hqLaunch{padding:11px 13px}.hqLaunch small{display:none}}
</style>
</head>
<body>
<!-- Claim exclusive V10 ownership before the core iframe boots so V7 never starts a competing 15s painter. -->
<script>window.__kevinOwnerConsoleV10={version:10,exclusive:true,pending:true};</script>
<iframe id="kevinCore" title="Kevin HQ" src="./hq-core-v7.html?v=22#overview"></iframe>
<div class="hqDock" aria-label="Kevin HQ quick actions">
<a id="kevinTalkLaunch" class="hqLaunch" href="http://127.0.0.1:18789/" target="_blank" rel="noopener noreferrer" aria-label="Open Kevin native private chat on this computer">Talk to Kevin <small>local</small></a>
<a id="kevinHandoverLaunch" class="hqLaunch" href="./handover.html" aria-label="Open the one canonical Kevin AI handover">Handover <small>canonical</small></a>
</div>
<!-- V10 owner shell: evidence precedence + integration/newswire + one consolidated owner console. -->
<script src="./hq-evidence-adapter-v1.js?v=2"></script>
<script src="./hq-overrides-v1.js?v=7"></script>
<script src="./hq-owner-console-v10.js?v=9"></script>
<script src="./hq-p1-ground-truth-v1.js?v=2"></script>
<script src="./hq-p0-floor-painter-v1.js?v=6"></script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.getRegistrations().then(regs=>Promise.all(regs.map(r=>r.update()))).finally(()=>{
      navigator.serviceWorker.register('./sw.js?v=16',{scope:'./'}).catch(()=>{});
    });
  });
}
</script>
</body>
</html>
