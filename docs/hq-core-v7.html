<html lang="en">

  <title>Kevin HQ</title>
  <style>

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}

    .wrap{max-width:1260px;margin:auto;position:relative}
    header{display:flex;align-items:center;gap:15px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:14px;min-width:0;flex:1}

    .service-chip b{color:var(--fg);font-weight:600}.led{width:7px;height:7px;border-radius:50%;background:#555d53}.led.ok{background:var(--sage);box-shadow:0 0 12px rgba(143,170,130,.46)}.led.warn{background:var(--gold)}.led.bad{background:var(--bad)}

    .hero{background:radial-gradient(740px 260px at 0 0,rgba(143,170,130,.10),transparent 60%),linear-gradient(180deg,rgba(25,32,24,.98),rgba(18,23,17,.99))}
    .k{font-size:10px;letter-spacing:.145em;text-transform:uppercase;color:var(--muted)}.v{font-size:22px;margin-top:5px;letter-spacing:-.02em}.h{color:var(--muted);font-size:12px;line-height:1.45;margin-top:4px}.mono{font-variant-numeric:tabular-nums}

    .kv-detail2,.kv-detail3,.kv-detail4,.kv-detail5{opacity:0;transition:opacity .8s}
    .kevin-avatar[data-level="2"] .kv-detail2,
    .kevin-avatar[data-level="3"] .kv-detail2,
    .kevin-avatar[data-level="4"] .kv-detail2,
    .kevin-avatar[data-level="5"] .kv-detail2{opacity:1}
    .kevin-avatar[data-level="3"] .kv-detail3,
    .kevin-avatar[data-level="4"] .kv-detail3,
    .kevin-avatar[data-level="5"] .kv-detail3{opacity:1}
    .kevin-avatar[data-level="4"] .kv-detail4,
    .kevin-avatar[data-level="5"] .kv-detail4{opacity:1}
    .kevin-avatar[data-level="5"] .kv-detail5{opacity:1}
    .kevin-avatar[data-level="2"] .kv-body,
    .kevin-avatar[data-level="2"] .kv-head{fill:#9b7662}
    .kevin-avatar[data-level="3"] .kv-body,
    .kevin-avatar[data-level="3"] .kv-head{fill:#a17d68}
    .kevin-avatar[data-level="4"] .kv-body,
    .kevin-avatar[data-level="4"] .kv-head{fill:#a98570}
    .kevin-avatar[data-level="5"] .kv-body,
    .kevin-avatar[data-level="5"] .kv-head{fill:#b08d77}
    .kevin-avatar[data-level="4"] .kv-face,
    .kevin-avatar[data-level="5"] .kv-face{fill:#ead9c8}
    .kv-bandage,.kv-bruise,.kv-xeyes,.kv-bonk{opacity:0}
    .kevin-avatar.mode-degraded .kv-bandage,
    .kevin-avatar.mode-degraded .kv-bruise{opacity:1}
    .kevin-avatar.mode-degraded{filter:saturate(.72)}
    .kevin-avatar.mode-disconnected .kv-eyes{opacity:0}
    .kevin-avatar.mode-disconnected .kv-xeyes,
    .kevin-avatar.mode-disconnected .kv-bonk{opacity:1}
    .kevin-avatar.mode-disconnected{filter:grayscale(.65) saturate(.4);animation:kvBonk 3.2s ease-in-out infinite}
    .kv-work{opacity:0}
    .kevin-avatar.mode-working .kv-work{opacity:1}
    .kevin-avatar.mode-idle .kv-eyes{transform-origin:60px 48px;animation:kvBlink 6.4s ease-in-out infinite}
    .kevin-avatar.mode-working{animation:kvBob 2.1s ease-in-out infinite}
    .kevin-avatar.mode-working:after{content:"";position:absolute;inset:5%;border-radius:50%;border:1px solid rgba(143,170,130,.3);animation:kvRing 2s ease-out infinite}
    .kevin-avatar.mode-working .kv-work{animation:kvSpark 1.4s ease-in-out infinite}
    @keyframes kvBlink{0%,91%,94%,100%{transform:scaleY(1)}92.5%{transform:scaleY(.08)}}
    @keyframes kvBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes kvRing{0%{transform:scale(.78);opacity:.7}100%{transform:scale(1.28);opacity:0}}
    @keyframes kvSpark{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes kvBonk{0%,100%{transform:rotate(0deg) translateY(0)}50%{transform:rotate(-3deg) translateY(2px)}}
    .ops-stack{display:grid;gap:12px}.ops-scroll{overflow:hidden}.ops-map{height:560px;width:100%;min-width:0;position:relative;border:1px solid var(--line);border-radius:17px;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(143,170,130,.12),transparent 24%),radial-gradient(circle at 18% 15%,rgba(131,167,187,.07),transparent 26%),#10150f}

    .ops-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.ops-lines line{stroke:rgba(242,239,231,.12);stroke-width:1.2}.ops-lines line.live{stroke:rgba(143,170,130,.55);stroke-dasharray:8 7;animation:flow 2.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}

    .agent-node:hover{border-color:var(--line2);transform:translate(-50%,-50%) translateY(-2px)}.agent-node.working{border-color:rgba(143,170,130,.45);box-shadow:0 0 0 6px rgba(143,170,130,.045),0 10px 28px rgba(0,0,0,.2)}.agent-node .name{font-size:12px;font-weight:700}.agent-node .role{font-size:10px;color:var(--muted);margin-top:2px}.agent-node .tiny{font-size:9px;color:var(--muted);margin-top:6px}
    .kevin-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:7px;z-index:3}.core-label{font-family:Georgia,serif;font-size:18px}.core-sub{font-size:10px;color:var(--muted);max-width:190px;text-align:center}
    .inspect{min-height:0}.inspect-title{font-family:Georgia,serif;font-size:23px;margin:4px 0}.inspect-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.inspect-mini{border:1px solid var(--line);border-radius:11px;padding:10px;background:#121711}
    .evolution{display:flex;gap:6px;margin-top:10px}.evo{height:6px;flex:1;border-radius:99px;background:#262d25}.evo.on{background:linear-gradient(90deg,#708a67,var(--sage2))}
    @media(max-width:700px){body{padding:12px 10px 44px}.resource-grid{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.mission-copy{font-size:22px}.ev{grid-template-columns:92px 1fr}.ops-map{height:610px}.agent-node{min-width:104px;max-width:120px;padding:9px}.kevin-avatar.large{--size:128px}.inspect-grid{grid-template-columns:1fr}}

<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div id="headerKevin"></div>
      <div>
        <h1>Kevin HQ</h1>
        <div class="sub" id="owlLabel">Living mission control</div>
        <div class="wx" id="wx"></div>
      </div>
    </div>
    <div class="head-right">
      <span class="version">HQ v7 - Live Work + Talk</span>
      <span class="pill" id="statusPill">...</span>
    </div>
  </header>
  <div id="attentionBanner" class="attention" hidden></div>
  <div id="newswire" class="newswire" hidden></div>
  <div class="service-rail" id="serviceRail"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
  <footer><span id="foot">Kevin HQ</span><span id="foot2"></span></footer>
</div>
<script>
// KEVIN HQ LIVE OPS v1
const TABS=[["overview","Command"],["ops","Ops Floor"],["activity","Work Log"],["capabilities","Skills"],["system","System"]]; /* P2 lean tabs: Talk/Roadmap/Diagnostics retired from nav — Talk stays dock-only */
let S=null,EXT_NEWS=null,HQ_SUPPORT=null,tab=(function(){let t=(location.hash||"#overview").slice(1).toLowerCase();if(["talk","build","diagnostics","roadmap"].includes(t)){location.hash="overview";return"overview"}return t||"overview"})(),selectedCrew="kevin",activityFilter="all";
if(!TABS.some(x=>x[0]===tab))tab="overview";

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function deriveAttention(){
  const completedForge=sortedActivity().filter(e=>{
    const task=String(e.task_id||'').toLowerCase();
    const detail=String(e.detail||'').toLowerCase();
    const event=String(e.event||'').toLowerCase();
    const result=String(e.result||'').toLowerCase().trim();
    return event==='task_finish' && (task==='design-forge'||detail.includes('design forge')) && !!result;
  });
  const latestForgePass=completedForge.length && completedForge[0].result && String(completedForge[0].result).toLowerCase()==='pass';
  if(S?.attention && typeof S.attention.level==='string'){
    let items=Array.isArray(S.attention.items)?S.attention.items:[];
    items=items.filter(i=>!(latestForgePass && String(i?.id||'')==='design_forge_streak'));
    const level=items.some(i=>String(i?.level||'').toLowerCase()==='fail')?'fail':(items.length?'caution':'none');
    if(items.length)return {level,items};
  }
  const items=[];
  const push=(id,label,level)=>items.push({id,label,level});
  const health=S?.health||{};
  const overall=String(health.overall||'').toLowerCase();
  const fails=Number(health.failed_checks||0);
  if((overall && overall!=='healthy') || fails>0){
    push('health', fails>0?`${fails} check(s) failed`:'System health is not healthy', fails>0?'fail':(overall==='degraded'?'caution':'fail'));
  }
  const svc=S?.services||{};
  const ollama=String(svc.ollama||'').toLowerCase();
  if(ollama && ollama!=='healthy')push('ollama','Ollama is not healthy',['unhealthy','fail','failed','down'].includes(ollama)?'fail':'caution');
  const gateway=String(svc.gateway||'').toLowerCase();
  if(gateway && gateway!=='healthy')push('gateway','Gateway is not healthy',['unhealthy','fail','failed','down'].includes(gateway)?'fail':'caution');
  if(completedForge.length>=3 && completedForge.slice(0,3).every(e=>['fail','failed'].includes(String(e.result||'').toLowerCase()))){
    push('design_forge_streak','Design Forge failed 3 completed runs in a row','fail');
  }
  const running=typeof S?.execution?.running==='boolean'?S.execution.running:isExecuting();
  const active=!!(S?.campaign?.active || S?.current_task);
  const phase=String(S?.execution?.phase || S?.current_task?.phase || '');
  if(!running && active && /fail|blocked/i.test(phase))push('campaign_blocked',/fail/i.test(phase)?'Active campaign failed':'Active campaign is blocked','fail');
  let level='none';
  if(items.some(i=>i.level==='fail'))level='fail';else if(items.length)level='caution';
  return {level,items:items.map(i=>({id:i.id,label:i.label,level:i.level}))};
}

let nwIndex=0, nwTimer=null, nwSig="";
function deriveNewswire(){
  const items=[];
  const wx=String(S?.weather?.summary||"").trim();
  if(wx) items.push({id:"weather",text:wx,severity:"normal"});
  const task=S?.current_task;
  const campaign=S?.campaign||{};
  const execution=S?.execution||{};
  if(campaign.active || task){
    const title=campaign.title || task?.title || "Current mission";
    const phase=execution.phase || task?.phase || "";
    const text=phase?`${title} · ${phase}`:String(title);
    let sev="normal";
    if(/fail/i.test(text)) sev="fail";
    else if(/block|degrad|caution/i.test(text)) sev="caution";
    items.push({id:"mission",text,severity:sev});
  }
  const builds=sortedBuild();
  const next=builds.find(b=>["next","queued","planned"].includes(String(b.state||"").toLowerCase())) || builds[0];
  if(next) items.push({id:"roadmap",text:"Next: "+(next.label||next.id||"Next build"),severity:"normal"});
  const health=S?.health||{};
  const overall=String(health.overall||"unknown").toLowerCase();
  const fails=Number(health.failed_checks||0);
  if(fails>0) items.push({id:"health",text:`System health: ${fails} check(s) failed`,severity:"fail"});
  else if(!overall || overall==="healthy") items.push({id:"health",text:"System health: all checks passed",severity:"normal"});
  else if(overall==="degraded") items.push({id:"health",text:"System health: degraded",severity:"caution"});
  else items.push({id:"health",text:`System health: ${overall}`,severity:"fail"});
  const verified=sortedActivity().find(e=>{
    const r=String(e.result||"").toLowerCase().trim();
    if(r!=="pass") return false;
    if(String(e.component||"").toLowerCase()==="tick" && String(e.event||"").toLowerCase()==="cycle") return false;
    return true;
  });
  if(verified) items.push({id:"verified",text:"Verified: "+(verified.detail||verified.event||"recent work"),severity:"success"});
  return items.slice(0,6);
}
function reportFresh(report,maxAgeMs){

  const age=Date.now()-at;
  return Number.isFinite(at)&&age>=-60000&&age<=maxAgeMs;

function supportBenchmark(){

function newswireStories(){

  const bench=supportBenchmark();
  if(bench){
    const r=bench.regression||{};
    const failed=(r.failed||[]).map(x=>x.id).join(', ');
    const pass=bench.status==='PASS'&&r.passed===30&&r.total===30&&r.critical_failures===0;
    out.push({id:'kevin-benchmark',text:`KEVIN · Benchmark ${r.passed??'?'}/${r.total??'?'}${failed?' · '+failed+' needs repair':''}`,severity:pass?'normal':'caution'});
  }else out.push({id:'kevin-status-unverified',text:'KEVIN · Platform evidence unavailable or stale',severity:'caution'});
  // Publisher build[] is a historical plan, not current Reader proof or demand.
  for(const item of deriveNewswire().filter(x=>['mission','verified'].includes(x.id)).slice(0,1)){
    out.push({...item,text:'KEVIN · '+item.text});
  }
  const ext=EXT_NEWS||{},fresh=reportFresh(ext,6*60*60*1000);
  const labels={local:'LOCAL',national:'NATIONAL',world:'INTERNATIONAL',top:'TOP'};
  if(fresh){
    // Interleave categories so every region gets a turn early in the rotation.
    const groups=Object.keys(labels).map(cat=>(ext.headlines||[]).filter(h=>h.category===cat));
    for(let i=0;i<4;i++)for(const group of groups){
      const h=group[i];if(!h?.title)continue;
      const source=String(h.source||'').trim();
      let url='';try{const u=new URL(h.url);if(u.protocol==='https:')url=u.href}catch(_e){}
      out.push({id:'news-'+h.category+'-'+h.title,text:`${labels[h.category]} · ${h.title}${source?' — '+source:''}`,severity:'normal',url});
    }
    if(!['local','national','world'].every(cat=>(ext.headlines||[]).some(h=>h.category===cat)))out.unshift({id:'news-incomplete',text:'NEWS · Some regional feeds are unavailable',severity:'caution'});
  }else out.push({id:'news-stale',text:'NEWS · Local, national and international feed is stale or unavailable',severity:'caution'});
  const seen=new Set();
  return out.filter(x=>{const k=x.text.toLowerCase().replace(/\W+/g,'');if(seen.has(k))return false;seen.add(k);return true}).slice(0,18);
}

  if(Array.isArray(S?.verified_results) && S.verified_results.length){
    return S.verified_results.map(x=>({

      result:String(x.result||"").toLowerCase()
    })).filter(x=>x.label && (x.kind==="faculty"||x.kind==="candidate"));
  }
  const out=[], seen=new Set();

  const qm=chatQa.match(/^(\d+)\s*\/\s*(\d+)$/);

    const label="Chat "+qm[1]+"/"+qm[2];

    seen.add("faculty:"+label.toLowerCase());

    if(seen.has(key)) continue;
    seen.add(key);
    out.push({at:c.last_verified||null,kind:"faculty",label,result:"pass"});
  }
  for(const e of sortedActivity()){
    const result=String(e.result||"").toLowerCase().trim();
    if(result!=="pass") continue;
    const task=String(e.task_id||"").toLowerCase();
    const detail=String(e.detail||"");
    const event=String(e.event||"").toLowerCase();
    const component=String(e.component||"").toLowerCase();
    const blob=(task+" "+detail+" "+event+" "+component).toLowerCase();
    if(component==="tick" && event==="cycle") continue;
    if(task==="night-forge" || blob.includes("night forge")) continue;
    if(/\barmed\b/.test(blob) && !blob.includes("design forge")) continue;
    if(/reader.{0,12}e2e|e2e.{0,12}reader/.test(blob) && task!=="design-forge" && !blob.includes("design forge")){
      const key="faculty:reader e2e";
      if(!seen.has(key)){

    }

      let mission="";

      if(seen.has(key)) continue;
      seen.add(key);
      out.push({at:e.at,kind:"candidate",label,result:"pass"});
    }
  }
  return out;
}

  return await r.json();
}

async function fetchSupport(){
  const r=await fetch(`https://raw.githubusercontent.com/hessmodee/KEVIN-WORK/main/reports/support-latest.json?ts=${Date.now()}`,{cache:'no-store'});
  if(!r.ok)throw new Error('support '+r.status);
  return r.json();
}

async function load(){
 try{
  const pair=await Promise.all([fetchState(),fetchExternalNewswire().catch(()=>null),fetchSupport().catch(()=>null)]);
  S=pair[0];if(pair[1])EXT_NEWS=pair[1];if(pair[2])HQ_SUPPORT=pair[2];
  renderNav();
  draw();
 }catch(e){
  if(S){
   renderNav();
   draw();
   $("statusPill").title=`State refresh failed: ${e.message}`;
  }else{
   $("main").innerHTML=`<div class="card"><div class="k">HQ state unavailable</div><div class="v">Waiting for Kevin</div><div class="h">${esc(e.message)}</div></div>`;
  }
 }
}
addEventListener("message",e=>{
 if(e.origin!==location.origin||e.data?.type!=="kevin-ops-height")return;
 const frame=$("opsV11Frame"),h=Number(e.data.height||0);
 if(frame&&Number.isFinite(h)&&h>400&&h<3000)frame.style.height=Math.ceil(h)+"px";
});
addEventListener("hashchange",()=>{
 const next=(location.hash||"#overview").slice(1);
 if(!TABS.some(x=>x[0]===next)||next===tab)return;
 tab=next;renderNav();draw();
});
load();setInterval(load,15000);
</script>
</body>
</html>
