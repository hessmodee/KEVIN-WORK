name: Publish Maintenance v1.3.9 Exact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/generate-maintenance-v139.py'
      - '.github/workflows/publish-maintenance-v139-exact.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate exact qualified candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python .\tools\generate-maintenance-v139.py
          if($LASTEXITCODE -ne 0){throw 'generator failed'}
          $p='.\control-plane\maintenance\generated\kevin-maintenance-runner-v1.3.9.ps1'
          $expected='0D3363D5DFDA8025F4B7BEF4A178A65615D5BD11537C7E577868536B4FC1E3C1'
          $actual=(Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToUpperInvariant()
          if($actual -ne $expected){throw "candidate identity drift expected=$expected actual=$actual"}
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){throw 'candidate parse failed'}
          $out=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p -SelfTest 2>&1|Out-String
          if($LASTEXITCODE -ne 0 -or $out -notmatch 'KEVIN MAINTENANCE v1\.3\.9 SELFTEST PASS'){throw 'candidate selftest failed'}
          Write-Host "EXACT_QUALIFIED_V139 sha256=$actual"

      - name: Publish exact bytes with bounded Git-object CAS
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $path='control-plane/maintenance/kevin-maintenance-runner-v1.3.9.ps1'
          $src='.\control-plane\maintenance\generated\kevin-maintenance-runner-v1.3.9.ps1'
          $expected='0D3363D5DFDA8025F4B7BEF4A178A65615D5BD11537C7E577868536B4FC1E3C1'
          function Get-BlobSha256([string]$BlobSha){$b=(& gh api "repos/$repo/git/blobs/$BlobSha"|ConvertFrom-Json);if($LASTEXITCODE -ne 0 -or -not$b.content){throw 'blob verification fetch failed'};$bytes=[Convert]::FromBase64String(([string]$b.content -replace '\s',''));$sha=[Security.Cryptography.SHA256]::Create();try{return([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-','').ToUpperInvariant()}finally{$sha.Dispose()}}
          $old=$ErrorActionPreference
          try{$ErrorActionPreference='Continue';$existing=(& gh api "repos/$repo/contents/$path?ref=main" 2>$null|Out-String).Trim();$code=[int]$LASTEXITCODE}finally{$ErrorActionPreference=$old}
          if($code -eq 0 -and $existing){$obj=$existing|ConvertFrom-Json;$h=Get-BlobSha256 ([string]$obj.sha);if($h -ne $expected){throw "refusing mismatched existing v1.3.9 expected=$expected actual=$h"};Write-Host "V139_ALREADY_PUBLISHED_EXACT sha256=$h";exit 0}
          $payload=[ordered]@{content=[Convert]::ToBase64String([IO.File]::ReadAllBytes($src));encoding='base64'}|ConvertTo-Json -Compress
          $blobFile=Join-Path $env:RUNNER_TEMP 'v139-blob.json';[IO.File]::WriteAllText($blobFile,$payload,(New-Object Text.UTF8Encoding($false)))
          $blobSha=(& gh api --method POST "repos/$repo/git/blobs" --input $blobFile --jq .sha).Trim();if(-not$blobSha){throw 'blob create failed'}
          $h=Get-BlobSha256 $blobSha;if($h -ne $expected){throw "immutable blob mismatch expected=$expected actual=$h"}
          for($attempt=1;$attempt -le 3;$attempt++){
            $head=(& gh api "repos/$repo/git/ref/heads/main" --jq .object.sha).Trim();$tree=(& gh api "repos/$repo/git/commits/$head" --jq .tree.sha).Trim()
            $tp=[ordered]@{base_tree=$tree;tree=@([ordered]@{path=$path;mode='100644';type='blob';sha=$blobSha})}|ConvertTo-Json -Depth 5 -Compress;$tf=Join-Path $env:RUNNER_TEMP "v139-tree-$attempt.json";[IO.File]::WriteAllText($tf,$tp,(New-Object Text.UTF8Encoding($false)));$nt=(& gh api --method POST "repos/$repo/git/trees" --input $tf --jq .sha).Trim()
            $cp=[ordered]@{message='Publish exact CI-qualified Maintenance v1.3.9';tree=$nt;parents=@($head)}|ConvertTo-Json -Depth 4 -Compress;$cf=Join-Path $env:RUNNER_TEMP "v139-commit-$attempt.json";[IO.File]::WriteAllText($cf,$cp,(New-Object Text.UTF8Encoding($false)));$nc=(& gh api --method POST "repos/$repo/git/commits" --input $cf --jq .sha).Trim()
            $rp=[ordered]@{sha=$nc;force=$false}|ConvertTo-Json -Compress;$rf=Join-Path $env:RUNNER_TEMP "v139-ref-$attempt.json";[IO.File]::WriteAllText($rf,$rp,(New-Object Text.UTF8Encoding($false)))
            $old=$ErrorActionPreference;try{$ErrorActionPreference='Continue';& gh api --method PATCH "repos/$repo/git/refs/heads/main" --input $rf --silent 2>$null;$rc=[int]$LASTEXITCODE}finally{$ErrorActionPreference=$old}
            if($rc -eq 0){$h=Get-BlobSha256 $blobSha;if($h -ne $expected){throw 'post-publish blob mismatch'};Write-Host "V139_PUBLISHED_EXACT sha256=$h attempt=$attempt";exit 0}
            Start-Sleep -Seconds 1
          }
          throw 'bounded v1.3.9 publication CAS attempts exhausted'
