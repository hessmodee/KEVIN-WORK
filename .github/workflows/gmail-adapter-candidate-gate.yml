name: Gmail Adapter Candidate Gate

on:
  push:
    paths:
      - 'candidates/communications/gmail/**'
      - '.github/workflows/gmail-adapter-candidate-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install candidate dependencies
        working-directory: candidates/communications/gmail
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Syntax
        working-directory: candidates/communications/gmail
        run: python -m py_compile kevin_gmail_adapter.py kevin_gmail_adapter_v0_2.py test_kevin_gmail_adapter.py
      - name: Existing v0.1 unit tests
        working-directory: candidates/communications/gmail
        run: pytest -q
      - name: Deterministic v0.1 selftest
        working-directory: candidates/communications/gmail
        run: python kevin_gmail_adapter.py selftest
      - name: Deterministic v0.2 threaded-reply selftest
        working-directory: candidates/communications/gmail
        run: python kevin_gmail_adapter_v0_2.py selftest
      - name: Secret, threading and authority static boundary
        shell: python
        run: |
          from pathlib import Path
          root=Path('candidates/communications/gmail')
          code=(root/'kevin_gmail_adapter_v0_2.py').read_text(encoding='utf-8')
          readme=(root/'README.md').read_text(encoding='utf-8')
          assert 'hessmodee@gmail.com' in code
          assert 'ALLOWED_TO' in code and 'recipient_not_allowlisted' in code
          assert 'gmail.send' in code and 'gmail.readonly' in code
          assert 'mail.google.com/' not in code
          assert 'gmail.modify' not in code
          assert 'gmail.settings' not in code
          assert 'keyring.set_password' in code and 'keyring.get_password' in code
          assert 'InstalledAppFlow.from_client_secrets_file' in code
          assert 'flow.run_local_server' in code
          assert 'In-Reply-To' in code and 'References' in code and 'threadId' in code
          assert 'reply-from-file' in code and 'gmail-outbox' in code
          assert 'reply_body_command_line' in code
          assert 'body_emitted_publicly' in code
          assert 'credential_material_emitted' in code
          assert 'Do **not** ask Matt to paste a password' in readme
          forbidden_files={'credentials.json','token.json','.env'}
          assert not any(p.name in forbidden_files for p in root.rglob('*') if p.is_file())
          print('GMAIL_V02_BOUNDARY_PASS recipient=owner_only scopes=send+readonly threaded_reply=true reply_body_cli=false secret_store=keyring')
