name: Bootstrap v1.3 Exact Hash Proof
on:
  pull_request:
    paths:
      - 'inbox/maintenance/packages/bootstrap-maintenance-v13-20260830.ps1'
      - 'inbox/maintenance/manifest.json'
      - 'control-plane/maintenance/kevin-maintenance-runner-v1.3.ps1'
      - '.github/workflows/bootstrap-v13-proof.yml'
permissions:
  contents: read
jobs:
  exact-hash:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Verify package manifest and candidate hashes
        shell: powershell
        run: |
          $pkg='inbox/maintenance/packages/bootstrap-maintenance-v13-20260830.ps1'
          $manifest='inbox/maintenance/manifest.json'
          $candidate='control-plane/maintenance/kevin-maintenance-runner-v1.3.ps1'
          if(-not(Test-Path $pkg)){throw 'bootstrap package missing'}
          if(-not(Test-Path $manifest)){throw 'manifest missing'}
          if(-not(Test-Path $candidate)){throw 'v1.3 candidate missing'}
          $m=Get-Content $manifest -Raw | ConvertFrom-Json
          $pkgHash=(Get-FileHash $pkg -Algorithm SHA256).Hash.ToUpperInvariant()
          $candidateHash=(Get-FileHash $candidate -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host ('package_sha256='+$pkgHash)
          Write-Host ('manifest_payload_sha256='+([string]$m.payload_sha256).ToUpperInvariant())
          Write-Host ('candidate_sha256='+$candidateHash)
          if($pkgHash -ne ([string]$m.payload_sha256).ToUpperInvariant()){throw 'bootstrap package hash does not match manifest'}
          if($candidateHash -ne '5C3B170FAF996FFE0890C028ABE1DD16D8A14258E5A1CAE2653E39F857AB324A'){throw 'candidate hash mismatch'}
          if(([string]$m.expected_current.'kevin-maintenance-runner.ps1').ToUpperInvariant() -ne '3B9D5B235E593C1CFF8CC9B7DED9E82FB958C2F7CD1F29FC813ECFA87E5C5483'){throw 'expected-current mismatch in manifest'}
          if(([string]$m.expected_after.'kevin-maintenance-runner.ps1').ToUpperInvariant() -ne $candidateHash){throw 'expected-after mismatch in manifest'}
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($pkg,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw 'bootstrap package parser failure'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $candidate -SelfTest
          if($LASTEXITCODE -ne 0){throw 'v1.3 self-test failed'}
          Write-Host 'PASS bootstrap v1.3 exact-hash contract'
