name: Maintenance v1.3.25 Autonomy Controller Install Proof

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate-maintenance-v1325-autonomy-controller-install.py'
      - 'control-plane/maintenance/kevin-maintenance-runner-v1.3.24.ps1'
      - 'control-plane/autonomy/kevin-supervisor-v1.8.2.ps1'
      - 'control-plane/autonomy/kevin-work-selector-v1.1.py'
      - 'tools/check-maintenance-operation-parity.py'
      - '.github/workflows/maintenance-v1325-autonomy-controller-install-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proof:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate exact v1.3.25 candidate
        run: python tools/generate-maintenance-v1325-autonomy-controller-install.py
      - name: Parse PowerShell and forbid arbitrary execution
        shell: pwsh
        run: |
          $p=(Resolve-Path 'control-plane/maintenance/kevin-maintenance-runner-v1.3.25.ps1')
          $tokens=$null;$errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw $errors[0].Message}
          $commands=@($ast.FindAll({param($n) $n -is [Management.Automation.Language.CommandAst]},$true))
          $names=@($commands|ForEach-Object{$_.GetCommandName()}|Where-Object{$_}|ForEach-Object{$_.ToLowerInvariant()})
          foreach($forbidden in @('invoke-expression','iex','cmd.exe')){if($names -contains $forbidden){throw "forbidden executable command in AST: $forbidden"}}
          Write-Host "MAINT_V1325_AST_PASS commands=$($commands.Count)"
      - name: Run full Maintenance self-test
        shell: pwsh
        run: |
          $env:KEVIN_MAINT_TEST_ROOT=Join-Path $env:RUNNER_TEMP 'kevin-maint-v1325-selftest'
          New-Item -ItemType Directory -Force -Path $env:KEVIN_MAINT_TEST_ROOT|Out-Null
          & .\control-plane\maintenance\kevin-maintenance-runner-v1.3.25.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){throw "Maintenance v1.3.25 selftest exit=$LASTEXITCODE"}
      - name: Prove operation parity
        run: python tools/check-maintenance-operation-parity.py control-plane/maintenance/kevin-maintenance-runner-v1.3.25.ps1
      - name: Assert fixed autonomy installer invariants
        shell: pwsh
        run: |
          $t=[IO.File]::ReadAllText('control-plane/maintenance/kevin-maintenance-runner-v1.3.25.ps1')
          foreach($m in @(
            "`$SupervisorV182Sha = '9EB3493A91B3B91AFCE05985D368849A98899C2F592C1B12D6EF94471190EE2C'",
            "`$SelectorV11Sha = '9DF1F770E8855232758AC275FA2D3A82C6D484099B5B2D2185A999ACDE185DE4'",
            'install_autonomy_controller_v182',
            'Global\KevinSupervisor',
            'selector target contains unexpected identity',
            'Benchmark baseline Supervisor anchor mismatch',
            'Benchmark baseline Forge anchor changed',
            'autonomy controller rollback completed',
            'caller-selected autonomy controller path accepted',
            'autonomy_controller_install=fixed'
          )){if(-not$t.Contains($m)){throw "missing invariant: $m"}}
          foreach($forbidden in @('kevin_shell','Start-Process cmd.exe')){if($t.Contains($forbidden)){throw "forbidden marker: $forbidden"}}
          Write-Host 'MAINT_V1325_AUTONOMY_INSTALL_INVARIANTS_PASS'
      - name: Verify qualified source identities
        shell: pwsh
        run: |
          $sup=(Get-FileHash 'control-plane/autonomy/kevin-supervisor-v1.8.2.ps1' -Algorithm SHA256).Hash.ToUpperInvariant()
          $sel=(Get-FileHash 'control-plane/autonomy/kevin-work-selector-v1.1.py' -Algorithm SHA256).Hash.ToUpperInvariant()
          if($sup -ne '9EB3493A91B3B91AFCE05985D368849A98899C2F592C1B12D6EF94471190EE2C'){throw "Supervisor source drift $sup"}
          if($sel -ne '9DF1F770E8855232758AC275FA2D3A82C6D484099B5B2D2185A999ACDE185DE4'){throw "selector source drift $sel"}
          Write-Host 'MAINT_V1325_QUALIFIED_SOURCES_PASS'
      - name: Emit exact qualified identity
        shell: pwsh
        run: |
          $p='control-plane/maintenance/kevin-maintenance-runner-v1.3.25.ps1'
          $sha=(Get-FileHash $p -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "MAINT_V1325_CI_PROVEN sha256=$sha"
          "MAINT_V1325_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish exact candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo='hessmodee/KEVIN-WORK';$path='control-plane/maintenance/kevin-maintenance-runner-v1.3.25.ps1'
          $bytes=[IO.File]::ReadAllBytes($path);$encoded=[Convert]::ToBase64String($bytes);$ok=$false
          for($attempt=1;$attempt -le 12;$attempt++){
            $body=[ordered]@{message='Publish CI-proven Maintenance v1.3.25';content=$encoded;branch='main'}
            $raw=gh api "repos/$repo/contents/$path?ref=main" 2>$null
            if($LASTEXITCODE -eq 0 -and $raw){$cur=$raw|ConvertFrom-Json;if($cur.sha){$body.sha=[string]$cur.sha}}
            $tmp=Join-Path $env:RUNNER_TEMP ('v1325-'+$attempt+'.json')
            [IO.File]::WriteAllText($tmp,($body|ConvertTo-Json -Compress),(New-Object Text.UTF8Encoding($false)))
            gh api --method PUT "repos/$repo/contents/$path" --input $tmp --silent 2>$null
            if($LASTEXITCODE -eq 0){$ok=$true;break}
            Start-Sleep -Seconds 2
          }
          if(-not$ok){throw 'v1.3.25 publication exhausted bounded retries'}
          Write-Host "MAINT_V1325_PUBLISH_ACCEPTED sha256=$env:MAINT_V1325_SHA"
