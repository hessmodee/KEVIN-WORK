name: Production Crossing v2 Candidate Proof

on:
  push:
    paths:
      - 'candidates/maintenance/production-crossing-v2/**'
      - '.github/workflows/production-crossing-v2-candidate-proof.yml'
  pull_request:
    paths:
      - 'candidates/maintenance/production-crossing-v2/**'
      - '.github/workflows/production-crossing-v2-candidate-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Reject executable implementation surfaces
        shell: pwsh
        run: |
          $p='candidates/maintenance/production-crossing-v2/contract.py'
          $code=Get-Content -LiteralPath $p -Raw
          foreach($pattern in @(
            '(?m)^\s*(?:from\s+subprocess\s+import|import\s+subprocess\b)',
            '(?m)^\s*(?:from\s+requests\s+import|import\s+requests\b)',
            '(?m)^\s*(?:from\s+urllib\.request\s+import|import\s+urllib\.request\b)',
            '(?m)^\s*(?:from\s+socket\s+import|import\s+socket\b)',
            '\bos\.system\s*\(',
            '\bPopen\s*\(',
            '\beval\s*\(',
            '\bexec\s*\('
          )){
            if($code -match $pattern){ throw "forbidden candidate implementation surface: $pattern" }
          }
          foreach($bad in @('powershell.exe','cmd.exe','Start-Process','Invoke-Expression','openclaw.json')){
            if($code.Contains($bad)){ throw "candidate unexpectedly targets production/runtime: $bad" }
          }
          Write-Host 'AUTHORITY_BOUNDARY_PASS production_effect=NONE authority_delta=NONE'
      - name: Deterministic positive and negative tests
        working-directory: candidates/maintenance/production-crossing-v2
        run: python -m unittest -v test_contract.py
      - name: Compile
        working-directory: candidates/maintenance/production-crossing-v2
        run: python -m py_compile contract.py test_contract.py
