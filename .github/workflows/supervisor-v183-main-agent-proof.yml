name: Supervisor v1.8.3 Fixed Main Agent Proof

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate-supervisor-v183-main-agent.py'
      - 'control-plane/autonomy/kevin-supervisor-v1.8.2.ps1'
      - '.github/workflows/supervisor-v183-main-agent-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proof:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate exact Supervisor v1.8.3
        run: python tools/generate-supervisor-v183-main-agent.py
      - name: Parse and self-test Supervisor v1.8.3
        shell: pwsh
        run: |
          $p=(Resolve-Path 'control-plane/autonomy/kevin-supervisor-v1.8.3.ps1')
          $tokens=$null;$errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw $errors[0].Message}
          $commands=@($ast.FindAll({param($n) $n -is [Management.Automation.Language.CommandAst]},$true))
          $names=@($commands|ForEach-Object{$_.GetCommandName()}|Where-Object{$_}|ForEach-Object{$_.ToLowerInvariant()})
          foreach($forbidden in @('invoke-expression','iex','kevin_shell','cmd.exe','start-process')){if($names -contains $forbidden){throw "forbidden executable command: $forbidden"}}
          & $p -SelfTest
          if($LASTEXITCODE -ne 0){throw "Supervisor v1.8.3 selftest exit=$LASTEXITCODE"}
      - name: Assert fixed-main routing and anti-spin invariants
        shell: pwsh
        run: |
          $t=[IO.File]::ReadAllText('control-plane/autonomy/kevin-supervisor-v1.8.3.ps1')
          foreach($m in @(
            '# Kevin Supervisor v1.8.3 Governed Autonomy Continuation Controller',
            "version = '1.8.3'",
            "Invoke-OpenClaw @('skills', 'check', '--agent', 'main', '--json')",
            "Invoke-OpenClaw @('agent', '--agent', 'main', '--json', '--message', `$message)",
            "Invoke-OpenClaw @('gateway', 'status', '--require-rpc', '--json')",
            'gateway RPC probe failed after bounded retries',
            'IDLE_NO_ELIGIBLE_DEMAND',
            'COOLDOWN_BUDGET_EXHAUSTED',
            'AGENT_TURN_COMPLETED_NOT_OUTCOME_PROOF',
            'A model response, heartbeat, publish commit, cycle, candidate, or hash alone is not an accomplishment.'
          )){if(-not$t.Contains($m)){throw "missing invariant: $m"}}
          if($t.Contains("Invoke-OpenClaw @('agent', '--json', '--message', `$message)")){throw 'selectorless Gateway agent turn remains'}
          if($t.Contains("Invoke-OpenClaw @('gateway', 'status', '--deep', '--require-rpc')")){throw 'deep probe remains in production turn'}
          Write-Host 'SUPERVISOR_V183_INVARIANTS_PASS fixed_main=true selectorless=false rpc_only=true retries=3'
      - name: Emit exact qualified identity
        shell: pwsh
        run: |
          $p='control-plane/autonomy/kevin-supervisor-v1.8.3.ps1'
          $sha=(Get-FileHash $p -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "SUPERVISOR_V183_CI_PROVEN sha256=$sha"
          "SUPERVISOR_V183_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish exact candidate without discarding telemetry commits
        shell: pwsh
        run: |
          $path='control-plane/autonomy/kevin-supervisor-v1.8.3.ps1'
          $saved=Join-Path $env:RUNNER_TEMP 'kevin-supervisor-v1.8.3.proven.ps1'
          Copy-Item -LiteralPath $path -Destination $saved -Force
          if((Get-FileHash $saved -Algorithm SHA256).Hash.ToUpperInvariant() -ne $env:SUPERVISOR_V183_SHA){throw 'saved proven candidate identity mismatch'}
          git config user.name 'Kevin CI'
          git config user.email 'kevin-ci@users.noreply.github.com'
          $ok=$false
          for($attempt=1;$attempt -le 60;$attempt++){
            git fetch origin main --quiet
            if($LASTEXITCODE -ne 0){Start-Sleep -Milliseconds 500;continue}
            git checkout -B publish-v183 origin/main --quiet
            if($LASTEXITCODE -ne 0){Start-Sleep -Milliseconds 500;continue}
            Copy-Item -LiteralPath $saved -Destination $path -Force
            if((Get-FileHash $path -Algorithm SHA256).Hash.ToUpperInvariant() -ne $env:SUPERVISOR_V183_SHA){throw 'working candidate identity mismatch'}
            git add -- $path
            git diff --cached --quiet
            if($LASTEXITCODE -eq 0){$ok=$true;break}
            git commit -m 'Publish CI-proven Supervisor v1.8.3' --quiet
            if($LASTEXITCODE -ne 0){Start-Sleep -Milliseconds 500;continue}
            git push origin HEAD:main --quiet
            if($LASTEXITCODE -eq 0){$ok=$true;break}
            Start-Sleep -Milliseconds 500
          }
          if(-not$ok){throw 'Supervisor v1.8.3 fast-forward publication exhausted bounded retries'}
          Write-Host "SUPERVISOR_V183_PUBLISH_ACCEPTED sha256=$env:SUPERVISOR_V183_SHA"
