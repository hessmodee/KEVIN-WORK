name: HQ Skill Lab Truth Repair Once

on:
  push:
    paths:
      - '.github/scripts/patch-hq-skill-lab-truth-once.py'
      - '.github/workflows/hq-skill-lab-truth-repair-once.yml'

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact fail-closed repair
        run: python .github/scripts/patch-hq-skill-lab-truth-once.py
      - name: JavaScript syntax
        run: node --check docs/hq-owner-refinement-v3.js
      - name: Existing HQ behavior tests
        run: |
          node .github/scripts/test-hq-owner-invariants.cjs
          node .github/scripts/test-hq-live-data.cjs
      - name: Commit repaired production source and regression test
        run: |
          if git diff --quiet -- docs/hq-owner-refinement-v3.js .github/scripts/test-hq-owner-invariants.cjs; then
            echo 'No repair diff produced.'
            exit 1
          fi
          git config user.name 'Kevin HQ Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/hq-owner-refinement-v3.js .github/scripts/test-hq-owner-invariants.cjs
          git commit -m 'Repair HQ global truth for Skill Lab execution'
          git push
