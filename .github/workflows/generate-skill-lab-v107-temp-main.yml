name: Generate Skill Lab v1.0.7 TEMP MAIN

on:
  push:
    branches: [bess/owner-work-autonomy-v107-main-20260906]
    paths:
      - 'tools/generate-skill-lab-v1.0.7.py'
      - '.github/workflows/generate-skill-lab-v107-temp-main.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bess/owner-work-autonomy-v107-main-20260906
      - name: Generate candidate
        run: python tools/generate-skill-lab-v1.0.7.py
      - name: Commit deterministic candidate
        run: |
          if git diff --quiet -- control-plane/skill-lab/kevin-skill-lab-v1.0.7.ps1 && git ls-files --error-unmatch control-plane/skill-lab/kevin-skill-lab-v1.0.7.ps1 >/dev/null 2>&1; then
            echo 'candidate already current'
            exit 0
          fi
          git config user.name 'Kevin CI'
          git config user.email 'actions@users.noreply.github.com'
          git add control-plane/skill-lab/kevin-skill-lab-v1.0.7.ps1
          git commit -m 'Generate Skill Lab v1.0.7 owner-work compiler'
          git push origin HEAD:bess/owner-work-autonomy-v107-main-20260906
