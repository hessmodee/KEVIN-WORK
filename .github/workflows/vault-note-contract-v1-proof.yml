name: Vault Note Contract v1 Proof

on:
  pull_request:
    paths:
      - 'tools/validate-vault-note-v1.py'
      - 'tools/test-vault-note-contract-v1.py'
      - '.github/workflows/vault-note-contract-v1-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/test-vault-note-contract-v1.py
