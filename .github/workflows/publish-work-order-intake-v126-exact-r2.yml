name: Publish Work Order Intake v1.2.6 Exact r2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/generate-work-order-intake-v126.py'
      - 'tools/generate-work-order-intake-v125.py'
      - '.github/workflows/publish-work-order-intake-v126-exact-r2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Regenerate and verify exact candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';python .\tools\generate-work-order-intake-v126.py
          $p='.\control-plane\intake\generated\kevin-work-order-intake-v1.2.6.ps1';$expected='2A87AC06A1DA1A2B6A2B10594DFE80FAE41B1385A969108BFFE5FC5F39DC45D1';$actual=(Get-FileHash $p -Algorithm SHA256).Hash.ToUpperInvariant();if($actual-ne$expected){throw "identity drift $actual"}
          $out=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p -Mode SelfTest 2>&1|Out-String;if($LASTEXITCODE-ne0-or$out-notmatch'KEVIN WORK ORDER INTAKE v1\.2\.6 SELFTEST PASS'){throw 'selftest failed'}
      - name: Publish exact immutable blob
        shell: powershell
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop';$repo=$env:GITHUB_REPOSITORY;$path='control-plane/intake/kevin-work-order-intake-v1.2.6.ps1';$src='.\control-plane\intake\generated\kevin-work-order-intake-v1.2.6.ps1';$expected='2A87AC06A1DA1A2B6A2B10594DFE80FAE41B1385A969108BFFE5FC5F39DC45D1'
          function Get-BlobSha256([string]$BlobSha){$b=(& gh api "repos/$repo/git/blobs/$BlobSha"|ConvertFrom-Json);if(-not$b.content){throw 'blob fetch failed'};$bytes=[Convert]::FromBase64String(([string]$b.content-replace'\s',''));$x=[Security.Cryptography.SHA256]::Create();try{return([BitConverter]::ToString($x.ComputeHash($bytes))).Replace('-','').ToUpperInvariant()}finally{$x.Dispose()}}
          $old=$ErrorActionPreference;try{$ErrorActionPreference='Continue';$existing=(& gh api "repos/$repo/contents/$path?ref=main" 2>$null|Out-String).Trim();$ec=[int]$LASTEXITCODE}finally{$ErrorActionPreference=$old};if($ec-eq0-and$existing){$o=$existing|ConvertFrom-Json;$h=Get-BlobSha256([string]$o.sha);if($h-ne$expected){throw "existing mismatch $h"};Write-Host "INTAKE_V126_ALREADY_PUBLISHED_EXACT sha256=$h";exit 0}
          $bp=[ordered]@{content=[Convert]::ToBase64String([IO.File]::ReadAllBytes($src));encoding='base64'}|ConvertTo-Json -Compress;$bf=Join-Path $env:RUNNER_TEMP 'blob.json';[IO.File]::WriteAllText($bf,$bp,(New-Object Text.UTF8Encoding($false)));$blob=(& gh api --method POST "repos/$repo/git/blobs" --input $bf --jq .sha).Trim();if((Get-BlobSha256 $blob)-ne$expected){throw 'blob mismatch'}
          for($a=1;$a-le3;$a++){$head=(& gh api "repos/$repo/git/ref/heads/main" --jq .object.sha).Trim();$tree=(& gh api "repos/$repo/git/commits/$head" --jq .tree.sha).Trim();$tp=[ordered]@{base_tree=$tree;tree=@([ordered]@{path=$path;mode='100644';type='blob';sha=$blob})}|ConvertTo-Json -Depth 5 -Compress;$tf=Join-Path $env:RUNNER_TEMP "tree$a.json";[IO.File]::WriteAllText($tf,$tp,(New-Object Text.UTF8Encoding($false)));$nt=(& gh api --method POST "repos/$repo/git/trees" --input $tf --jq .sha).Trim();$cp=[ordered]@{message='Publish exact CI-qualified Work Order Intake v1.2.6';tree=$nt;parents=@($head)}|ConvertTo-Json -Depth 4 -Compress;$cf=Join-Path $env:RUNNER_TEMP "commit$a.json";[IO.File]::WriteAllText($cf,$cp,(New-Object Text.UTF8Encoding($false)));$nc=(& gh api --method POST "repos/$repo/git/commits" --input $cf --jq .sha).Trim();$rp=[ordered]@{sha=$nc;force=$false}|ConvertTo-Json -Compress;$rf=Join-Path $env:RUNNER_TEMP "ref$a.json";[IO.File]::WriteAllText($rf,$rp,(New-Object Text.UTF8Encoding($false)));$old=$ErrorActionPreference;try{$ErrorActionPreference='Continue';& gh api --method PATCH "repos/$repo/git/refs/heads/main" --input $rf --silent 2>$null;$rc=[int]$LASTEXITCODE}finally{$ErrorActionPreference=$old};if($rc-eq0){Write-Host "INTAKE_V126_PUBLISHED_EXACT sha256=$expected attempt=$a";exit 0};Start-Sleep 1};throw 'publish CAS exhausted'
