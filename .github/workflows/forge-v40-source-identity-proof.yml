name: Forge v4 Source Identity Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control-plane/forge/kevin-design-forge-v4.0.ps1'
      - '.github/workflows/forge-v40-source-identity-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse exact PowerShell source
        shell: pwsh
        run: |
          $p='control-plane/forge/kevin-design-forge-v4.0.ps1'
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
          if($errors.Count){ throw $errors[0].Message }
          Write-Host 'FORGE_V40_PARSE_PASS'
      - name: Run isolated Forge self-test
        shell: pwsh
        run: |
          & .\control-plane\forge\kevin-design-forge-v4.0.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){ throw "Forge self-test exit=$LASTEXITCODE" }
      - name: Demand-gate regression invariants
        shell: pwsh
        run: |
          $t=[IO.File]::ReadAllText((Resolve-Path 'control-plane/forge/kevin-design-forge-v4.0.ps1'))
          foreach($m in @(
            'status=''IDLE_NO_ELIGIBLE_DEMAND''',
            'demand_driven=$true',
            'round_robin=$false',
            'if([int]$d.max_attempts-ne3)',
            'downstream consumer not allowlisted',
            'production downstream accepted',
            'unknown command field accepted'
          )){ if(-not $t.Contains($m)){ throw "missing Forge v4 invariant: $m" } }
          if($t -match 'MissionContractPath'){ throw 'legacy MissionContractPath interface present in Forge v4' }
          if($t -match '(?i)Invoke-Expression|kevin_shell|Start-Process\s+cmd\.exe'){ throw 'forbidden arbitrary execution marker' }
          Write-Host 'FORGE_V40_DEMAND_GATE_PASS'
      - name: Emit immutable qualified identity
        shell: pwsh
        run: |
          $p='control-plane/forge/kevin-design-forge-v4.0.ps1'
          $sha=(Get-FileHash $p -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "FORGE_V40_IDENTITY_PROVEN sha256=$sha"
          Write-Host 'FORGE_V40_PROOF parse=true selftest=true demand_driven=true round_robin=false max_attempts=3 legacy_mission_contract=false authority_delta=NONE production_promotion=false'
