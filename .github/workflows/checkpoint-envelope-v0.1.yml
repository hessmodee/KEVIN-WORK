name: Checkpoint Envelope v0.1 Gate

on:
  push:
    branches: [kevin-checkpoint-resume-v0.1]
  pull_request:
    branches: [kevin-control-plane-v1.3-review-contract]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: python -m py_compile tools/validate_checkpoint_envelope.py tools/test_checkpoint_envelope.py
      - name: Deterministic tests
        working-directory: tools
        run: python -m unittest -v test_checkpoint_envelope.py
      - name: Static authority boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tools/validate_checkpoint_envelope.py').read_text()
          banned=['subprocess','socket','requests','urllib','os.system','Popen','shell=True']
          found=[x for x in banned if x in s]
          assert not found, found
          contract=Path('control-plane/schemas/checkpoint-envelope-v1.json').read_text()
          for token in ['"grants_authority": false','"executes_actions": false','"arbitrary_shell": false','"external_sends": false']:
              assert token in contract, token
          print('CHECKPOINT_AUTHORITY_BOUNDARY_PASS')
          PY
