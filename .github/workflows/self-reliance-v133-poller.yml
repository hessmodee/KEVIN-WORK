name: Self-Reliance v1.3.3 Poller Transport

on:
  push:
    paths:
      - 'control-plane/maintenance/kevin-maintenance-runner-v1.3.3.ps1'
      - 'control-plane/maintenance/kevin-self-reliance-watchdog-v1.3.ps1'
      - '.github/workflows/self-reliance-v133-poller.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runtime:
    runs-on: windows-latest
    steps:
      - name: Pin LF checkout
        shell: powershell
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Parser hash and Windows token gates
        shell: powershell
        run: |
          $m='control-plane/maintenance/kevin-maintenance-runner-v1.3.3.ps1'
          $w='control-plane/maintenance/kevin-self-reliance-watchdog-v1.3.ps1'
          foreach($p in @($m,$w)){
            $txt=[IO.File]::ReadAllText($p)
            if($txt.Contains("`r`n")){throw "CRLF checkout detected $p"}
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "parser failed $p : $($errors[0].Message)"}
            if($txt -match '(?m)\breturn(?=\$|\[|@)'){throw "Windows return-token adjacency regression in $p"}
          }
          Write-Host ('MAINTENANCE_V133_SHA256='+(Get-FileHash $m -Algorithm SHA256).Hash.ToUpperInvariant())
          Write-Host ('WATCHDOG_V13_SHA256='+(Get-FileHash $w -Algorithm SHA256).Hash.ToUpperInvariant())
      - name: Windows PowerShell 5.1 runtime self-tests
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'control-plane/maintenance/kevin-maintenance-runner-v1.3.3.ps1' -SelfTest
          if($LASTEXITCODE -ne 0){throw 'maintenance v1.3.3 self-test failed'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'control-plane/maintenance/kevin-self-reliance-watchdog-v1.3.ps1' -SelfTest
          if($LASTEXITCODE -ne 0){throw 'watchdog v1.3 self-test failed'}
      - name: Fixed polling authority assertions
        shell: powershell
        run: |
          $m=[IO.File]::ReadAllText('control-plane/maintenance/kevin-maintenance-runner-v1.3.3.ps1')
          $w=[IO.File]::ReadAllText('control-plane/maintenance/kevin-self-reliance-watchdog-v1.3.ps1')
          foreach($required in @('self_reliance_watchdog','kevin-self-reliance-watchdog.ps1','KEVIN SELF-RELIANCE WATCHDOG v1.3 SELFTEST PASS','authority_expansion=false')){
            if(-not $m.Contains($required)){throw "missing maintenance watchdog invariant: $required"}
          }
          foreach($required in @('kevin-work-order-intake-v0.1.ps1',"'-Mode','Poll'",'WorkOrderIntervalMinutes = 2','work_order_poll=fixed','remote_payload=typed-only','caller_argv=false')){
            if(-not $w.Contains($required)){throw "missing watchdog polling invariant: $required"}
          }
          foreach($p in @($m,$w)){
            foreach($forbidden in @('Invoke-Expression','ScriptBlock]::Create','-EncodedCommand','DownloadString','WScript.Shell')){
              if($p -match [regex]::Escape($forbidden)){throw "forbidden execution primitive: $forbidden"}
            }
          }
          Write-Host 'SELF_RELIANCE_POLLER_PASS intake=fixed cadence=2m arbitrary_shell=false caller_argv=false typed_remote_only=true'
