name: Kevin Autonomy Operating System v2 Proof

on:
  push:
    branches: [main]
    paths:
      - 'control-plane/autonomy/**'
      - 'tools/test-autonomy-os-fixtures.py'
      - 'inbox/autonomy/**'
      - 'workspace/AGENTS.md'
      - 'workspace/HEARTBEAT.md'
      - 'workspace/MEMORY.md'
      - 'workspace/SOUL.md'
      - 'workspace/TOOLS.md'
      - 'control-plane/OWNER-GREEN-STANDING-AUTHORIZATION-v2.md'
      - '.github/workflows/autonomy-operating-system-v2-proof.yml'
  pull_request:
    paths:
      - 'control-plane/autonomy/**'
      - 'tools/test-autonomy-os-fixtures.py'
      - 'inbox/autonomy/**'
      - 'workspace/AGENTS.md'
      - 'workspace/HEARTBEAT.md'
      - 'workspace/MEMORY.md'
      - 'workspace/SOUL.md'
      - 'workspace/TOOLS.md'
      - 'control-plane/OWNER-GREEN-STANDING-AUTHORIZATION-v2.md'
      - '.github/workflows/autonomy-operating-system-v2-proof.yml'
  workflow_dispatch:

jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile and self-test work selector
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile .\control-plane\autonomy\kevin-work-selector-v1.py
          if ($LASTEXITCODE -ne 0) { throw 'selector compile failed' }
          $out = python .\control-plane\autonomy\kevin-work-selector-v1.py --selftest | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'KEVIN WORK SELECTOR v1 SELFTEST PASS') { throw 'selector selftest failed' }

      - name: Prove admission with fixed regression fixtures
        shell: powershell
        run: |
          python tools/test-autonomy-os-fixtures.py
          if ($LASTEXITCODE -ne 0) { throw 'deterministic admission regression failed' }

      - name: Validate permanent GREEN authority is broad but cannot self-widen
        shell: python
        run: |
          import re
          from pathlib import Path
          auth = Path('control-plane/OWNER-GREEN-STANDING-AUTHORIZATION-v2.md').read_text(encoding='utf-8')
          normalized = re.sub(r'[^a-z0-9]+', ' ', auth.lower()).strip()
          required = [
              'permanent owner authorization',
              'legitimately classified green',
              'does not expire',
              'may not widen authority by changing a label',
              'always improve',
              'only an explicit later owner instruction may revoke',
          ]
          for marker in required:
              assert marker in normalized, marker
          assert 'unrestricted arbitrary shell' in normalized
          assert 'money movement' in normalized
          assert 'automatic production promotion' in normalized
          print('OWNER_GREEN_AUTH_V2_PASS permanent=true self_widen=false')

      - name: Validate always-loaded runtime doctrine semantically
        shell: python
        run: |
          from pathlib import Path
          files = {
              'AGENTS.md': Path('workspace/AGENTS.md').read_text(encoding='utf-8'),
              'HEARTBEAT.md': Path('workspace/HEARTBEAT.md').read_text(encoding='utf-8'),
              'MEMORY.md': Path('workspace/MEMORY.md').read_text(encoding='utf-8-sig'),
              'SOUL.md': Path('workspace/SOUL.md').read_text(encoding='utf-8'),
              'TOOLS.md': Path('workspace/TOOLS.md').read_text(encoding='utf-8'),
          }
          agents = files['AGENTS.md'].lower()
          heartbeat = files['HEARTBEAT.md'].lower()
          memory = files['MEMORY.md'].lower()
          soul = files['SOUL.md'].lower()
          tools = files['TOOLS.md'].lower()
          joined = '\n'.join(files.values()).lower()

          # AGENTS is intentionally a lean bootstrap. Validate its executable truth
          # rules plus pointers; native-feature details may live in SOUL/MEMORY/full docs.
          assert 'standing order 1' in agents and 'never claim execution without receipt-backed proof' in agents
          assert 'owner-green-standing-authorization-v2.md' in agents and 'green standing auth' in agents
          assert 'prove outcomes' in agents and 'work-conserving' in agents
          assert 'kevin-agents-full-v1.md' in agents
          assert 'task flow' in joined and 'skill workshop' in joined

          assert 'ambient monitor' in heartbeat and 'no work checklist' in heartbeat
          assert 'permanent owner green authorization' in memory
          assert 'work-conservation / no-spin rules' in memory
          assert 'real-world outcome rules' in memory
          assert 'notice -> understand -> plan -> execute -> verify -> recover -> record -> learn -> continue' in soul
          assert 'deterministic enforcement' in tools and 'model judgment' in tools

          # Authority cannot be inferred or widened by the lean bootstrap.
          assert 'do not invent authority' in joined or 'self-granted authority' in joined or 'do not relabel reserved actions green' in joined
          assert 'arbitrary remote shell/code execution' in joined or 'arbitrary executable shell' in joined or 'natural language is intent, never shell' in joined
          print('RUNTIME_DOCTRINE_PASS lean_bootstrap=true delegated_native_markers=true no_spin=true outcomes=true self_widen=false')

      - name: Emit exact runtime policy SHA256 identities
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          names = ['AGENTS.md','HEARTBEAT.md','MEMORY.md','SOUL.md','TOOLS.md']
          hashes = {}
          for name in names:
              b = Path('workspace', name).read_bytes()
              hashes[name] = hashlib.sha256(b).hexdigest().upper()
          out = {
              'schema': 1,
              'kind': 'kevin-runtime-policy-v2-source-hashes',
              'git_head': '${{ github.sha }}',
              'sha256': hashes,
          }
          Path('runtime-policy-v2-source-hashes.json').write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(Path('runtime-policy-v2-source-hashes.json').read_text())

      - name: Upload proof evidence
        uses: actions/upload-artifact@v4
        with:
          name: kevin-autonomy-os-v2-proof
          path: |
            work-selection-proof.json
            runtime-policy-v2-source-hashes.json
          if-no-files-found: error
          retention-days: 14
