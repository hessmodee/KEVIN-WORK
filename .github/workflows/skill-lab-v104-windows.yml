name: Skill Lab v1.0.4 Windows Runtime Gate

on:
  push:
    branches: [kevin-skill-lab-v1.0.4-windows-runtime-fix]
    paths:
      - control-plane/skill-lab/**
      - .github/workflows/skill-lab-v104-windows.yml
  pull_request:
    paths:
      - control-plane/skill-lab/**
      - .github/workflows/skill-lab-v104-windows.yml

permissions:
  contents: read

jobs:
  delta-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact minimal delta from v1.0.3
        run: |
          python - <<'PY'
          from pathlib import Path
          old=Path('control-plane/skill-lab/kevin-skill-lab-v1.0.3.ps1').read_text(encoding='utf-8')
          new=Path('control-plane/skill-lab/kevin-skill-lab-v1.0.4.ps1').read_text(encoding='utf-8')
          expected=old.replace('v1.0.3','v1.0.4')
          expected=expected.replace('function R([string]$p)','function ReadJ([string]$p)')
          expected=expected.replace('order=R $p','order=ReadJ $p')
          expected=expected.replace('$x=R $reg','$x=ReadJ $reg')
          expected=expected.replace('$s=R $f.FullName','$s=ReadJ $f.FullName')
          expected=expected.replace("-Filter'*.json'|sort LastWriteTime,Name|select -First 1", "-Filter '*.json' | Sort-Object LastWriteTime,Name | Select-Object -First 1")
          expected=expected.replace("function Fail([string]$p,$s,[string]$why,$ev=$null){$s.status='FAILED';$s.completed_at=(Get-Date).ToString('o');$s.failure_reason=$why;", "function Fail([string]$p,$s,[string]$why,$ev=$null){Note $s 'completed_at' '';Note $s 'failure_reason' '';$s.status='FAILED';$s.completed_at=(Get-Date).ToString('o');$s.failure_reason=$why;")
          expected=expected.replace("function Complete([string]$p,$s){$s.status='PROVEN';$s.completed_at=(Get-Date).ToString('o');$s.proof_sha256=HO $s;", "function Complete([string]$p,$s){Note $s 'completed_at' '';Note $s 'proof_sha256' '';$s.status='PROVEN';$s.completed_at=(Get-Date).ToString('o');$s.proof_sha256=HO $s;")
          assert new == expected, 'v1.0.4 contains changes outside confirmed Windows runtime fixes'
          print('PASS exact minimal delta: Filter tokenization + R alias + PSCustomObject completion fields')
          PY
      - name: Static authority and Windows regression boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('control-plane/skill-lab/kevin-skill-lab-v1.0.4.ps1')
          s=p.read_text(encoding='utf-8')
          forbidden=[
            'Invoke-Expression','Start-Process','Invoke-WebRequest','Invoke-RestMethod',
            'System.Diagnostics.Process','Net.WebClient','cmd.exe','DownloadString',
            'DownloadFile','Add-Type','shell=True','arbitrary_remote'
          ]
          bad=[x for x in forbidden if x.lower() in s.lower()]
          assert not bad,bad
          assert "@('create_text','create_spreadsheet','ui_notepad_write')" in s
          assert '$maxRecover=3' in s
          assert '$staleMin=15' in s
          assert "-Filter'*.json'" not in s
          assert s.count("-Filter '*.json'") == 2
          assert 'function R(' not in s
          assert 'function ReadJ(' in s
          assert "Note $s 'completed_at' ''" in s
          assert "Note $s 'proof_sha256' ''" in s
          assert "Note $s 'failure_reason' ''" in s
          assert 'SKILL LAB v1.0.4 SELFTEST PASS' in s
          print('PASS fixed GREEN primitive envelope + Windows runtime regressions')
          PY
      - name: Exact candidate hash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          p=Path('control-plane/skill-lab/kevin-skill-lab-v1.0.4.ps1')
          print('candidate_sha256='+sha256(p.read_bytes()).hexdigest().upper())
          PY

  windows-powershell-51-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and self-test in Windows PowerShell 5.1
        shell: powershell
        run: |
          $p='control-plane\skill-lab\kevin-skill-lab-v1.0.4.ps1'
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw 'Windows PowerShell 5.1 parse failed'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Windows PowerShell 5.1 self-test failed'}
      - name: Real queue lifecycle in Windows PowerShell 5.1
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'control-plane\skill-lab\test_skill_lab_windows_runtime_v104.ps1'
          if($LASTEXITCODE -ne 0){throw 'Windows runtime queue lifecycle failed'}
