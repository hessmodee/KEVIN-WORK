name: Kevin HQ Newswire

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  pull_request:
    paths:
      - .github/scripts/build-hq-newswire.py
      - .github/scripts/publish-hq-newswire.py
      - .github/workflows/hq-newswire.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/build-hq-newswire.py
      - .github/scripts/publish-hq-newswire.py
      - .github/workflows/hq-newswire.yml

permissions:
  contents: write

concurrency:
  group: kevin-hq-newswire-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove obituary/death-notice exclusion
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('.github/scripts/build-hq-newswire.py')
          spec=importlib.util.spec_from_file_location('hq_news',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          blocked=[
            'Chung Tsu Lisa Lasswell Obituary, Age 85 - Preston, Idaho',
            'Jane Doe death notice',
            'Funeral service announced for John Doe',
            'Community memorial service for longtime resident',
            'In Memoriam: Jane Doe',
            'Celebration of Life for John Doe',
            'Jane Doe passed away peacefully',
          ]
          allowed=[
            'Police investigate fatal crash on US-91',
            'Utah lawmakers debate public safety bill after deadly incident',
            'Cache Valley business opens new service center',
          ]
          assert all(m.is_blocked_story(x) for x in blocked), blocked
          assert not any(m.is_blocked_story(x) for x in allowed), allowed
          print('NEWSWIRE_CONTENT_POLICY_PASS')
          PY
      - name: Build public newswire
        run: python .github/scripts/build-hq-newswire.py
      - name: Validate feed
        run: |
          python - <<'PY'
          import json, re
          p=json.load(open('reports/newswire-latest.json',encoding='utf-8'))
          assert p.get('schema')==1
          assert p.get('kind')=='kevin-hq-public-newswire'
          assert p.get('weather',{}).get('summary'), p.get('errors')
          assert len(p.get('headlines',[]))>=6, p.get('errors')
          cats={x.get('category') for x in p['headlines']}
          assert 'local' in cats, cats
          assert 'national' in cats, cats
          assert 'world' in cats, cats
          policy=p.get('content_policy',{})
          assert policy.get('obituaries')=='excluded', policy
          bad=re.compile(r'\b(obituar(?:y|ies)|death\s+notice|passed\s+away|in\s+memoriam|celebration\s+of\s+life)\b',re.I)
          assert not any(bad.search(x.get('title','')) for x in p['headlines']), p['headlines']
          print('NEWSWIRE_CONTRACT_PASS',len(p['headlines']),sorted(cats))
          PY
      - name: Publish if changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'Kevin Newswire'
          git config user.email 'actions@users.noreply.github.com'
          python .github/scripts/publish-hq-newswire.py
