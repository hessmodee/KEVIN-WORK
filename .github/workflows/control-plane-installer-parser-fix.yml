name: Fix Control Plane installer parser

on:
  push:
    branches: [kevin-control-plane-v1]
    paths:
      - '.github/scripts/fix-control-plane-installer-parser.ps1'
      - '.github/workflows/control-plane-installer-parser-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kevin-control-plane-v1
      - name: Correct and parse installer
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github/scripts/fix-control-plane-installer-parser.ps1
          if($LASTEXITCODE -ne 0){throw 'Installer parser correction failed'}
      - name: Commit corrected installer
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Kevin Control Plane CI'
          git config user.email 'kevin-control-plane-ci@users.noreply.github.com'
          git add -- control-plane/install/KEVIN-CONTROL-PLANE-v1.ps1
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){Write-Host 'No correction needed.';exit 0}
          git commit -m 'Fix Control Plane v1 installer PowerShell interpolation'
          git push origin HEAD:kevin-control-plane-v1
