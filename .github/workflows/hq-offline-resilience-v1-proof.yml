name: Kevin HQ Offline Resilience v1 Proof

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/sw.js'
      - 'docs/hq-evidence-adapter-v1.js'
      - 'docs/hq-overrides-v1.js'
      - 'docs/hq-truth-v2.js'
      - 'docs/hq-owner-refinement-v3.js'
      - 'docs/hq-growth-v1.js'
      - 'docs/hq-ground-truth-v8.js'
      - '.github/workflows/hq-offline-resilience-v1-proof.yml'
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/sw.js'
      - 'docs/hq-evidence-adapter-v1.js'
      - 'docs/hq-overrides-v1.js'
      - 'docs/hq-truth-v2.js'
      - 'docs/hq-owner-refinement-v3.js'
      - 'docs/hq-growth-v1.js'
      - 'docs/hq-ground-truth-v8.js'
      - '.github/workflows/hq-offline-resilience-v1-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse Service Worker
        run: node --check docs/sw.js
      - name: Prove registration and fixed scope
        shell: python
        run: |
          from pathlib import Path
          index=Path('docs/index.html').read_text(encoding='utf-8')
          sw=Path('docs/sw.js').read_text(encoding='utf-8')
          assert "navigator.serviceWorker.register('./sw.js',{scope:'./'})" in index
          assert "const BASE='/KEVIN-WORK/'" in sw
          assert "raw.githubusercontent.com" in sw
          assert "networkFirst(req,DATA_CACHE)" in sw
          assert "credentials:'omit'" in sw
          assert "cache:'no-store'" not in sw
          for bad in ('GH_TOKEN','GITHUB_TOKEN','Authorization:','localStorage','document.cookie','indexedDB'):
              assert bad not in sw, bad
          print('HQ_OFFLINE_RESILIENCE_INVARIANTS_PASS scope=fixed public_data_only=true network_first=true credential_send=omit')
      - name: Prove current shell assets exist and are cached
        shell: python
        run: |
          from pathlib import Path
          import re

          index=Path('docs/index.html').read_text(encoding='utf-8')
          sw=Path('docs/sw.js').read_text(encoding='utf-8')
          required=[
            'docs/index.html','docs/hq-core-v7.html','docs/hq-evidence-adapter-v1.js',
            'docs/hq-overrides-v1.js','docs/hq-truth-v2.js','docs/hq-owner-refinement-v3.js',
            'docs/hq-growth-v1.js','docs/hq-ground-truth-v8.js',
            'docs/ops/index.html','docs/ops/embed.html','docs/ops/app.js','docs/ops/style.css',
            'docs/ops/ops-v11.css','docs/ops/ops-v11.js','docs/ops/ops-fun-v2.js',
            'docs/ops/ops-owner-refinement-v1.css','docs/ops/ops-owner-refinement-v1.js',
            'docs/ops/ops-truth-patch-v1.js'
          ]
          missing=[p for p in required if not Path(p).is_file()]
          assert not missing, missing

          shell_entries=set(re.findall(r'`\$\{BASE\}([^`]+)`',sw))
          for p in required:
              if p=='docs/index.html':
                  assert 'index.html' in shell_entries
              elif p.startswith('docs/'):
                  rel=p[len('docs/'):]
                  assert rel in shell_entries, f'not cached: {rel}'

          # Every same-origin shell script loaded by index must exist and be cached.
          scripts=re.findall(r'<script\s+src="\.\/([^"?]+)(?:\?[^\"]*)?"',index)
          assert scripts, 'no shell scripts found in index'
          for rel in scripts:
              assert Path('docs',rel).is_file(), rel
              assert rel in shell_entries, f'index script not in service-worker shell: {rel}'

          for stale in ('hq-owner-refinement-v2.js','hq-fun-v2.js'):
              assert stale not in shell_entries, stale
          print(f'HQ_OFFLINE_SHELL_ASSETS_PASS count={len(required)} index_scripts={len(scripts)} current_v8=true')
