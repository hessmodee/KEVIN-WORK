name: Maintenance v1.3.35 Safe Report Publish Proof

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate-maintenance-v1335-safe-report-publish.py'
      - 'control-plane/maintenance/kevin-maintenance-runner-v1.3.34.ps1'
      - '.github/workflows/maintenance-v1335-safe-report-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proof:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate exact Maintenance v1.3.35
        run: python tools/generate-maintenance-v1335-safe-report-publish.py
      - name: Parse and forbid authority widening
        shell: pwsh
        run: |
          $p=(Resolve-Path 'control-plane/maintenance/kevin-maintenance-runner-v1.3.35.ps1')
          $tokens=$null;$errors=$null;$ast=[Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw $errors[0].Message}
          $names=@($ast.FindAll({param($n) $n -is [Management.Automation.Language.CommandAst]},$true)|ForEach-Object{$_.GetCommandName()}|Where-Object{$_}|ForEach-Object{$_.ToLowerInvariant()})
          foreach($bad in @('invoke-expression','iex','cmd.exe','kevin_shell')){if($names -contains $bad){throw "forbidden Maintenance command $bad"}}
      - name: Run full inherited self-test
        shell: pwsh
        run: |
          $env:KEVIN_MAINT_TEST_ROOT=Join-Path $env:RUNNER_TEMP 'kevin-maint-v1335-selftest'
          New-Item -ItemType Directory -Force -Path $env:KEVIN_MAINT_TEST_ROOT|Out-Null
          & .\control-plane\maintenance\kevin-maintenance-runner-v1.3.35.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){throw "Maintenance v1.3.35 selftest exit=$LASTEXITCODE"}
      - name: Prove operation parity
        run: python tools/check-maintenance-operation-parity.py control-plane/maintenance/kevin-maintenance-runner-v1.3.35.ps1
      - name: Assert publisher hardening and inherited compatibility
        shell: pwsh
        run: |
          $t=[IO.File]::ReadAllText('control-plane/maintenance/kevin-maintenance-runner-v1.3.35.ps1')
          foreach($m in @(
            "version='1.3.35'",
            'safe_report_publish=bounded3',
            'remote_hash_verify=true',
            'reconcile_maintenance_cron_backoff',
            "@('cron','add','--name',`$name,'--every','5m'",
            "@('cron','edit',`$id,'--enable')"
          )){if(-not$t.Contains($m)){throw "missing v1.3.35 invariant: $m"}}
          $s=$t.IndexOf('function Publish-SafeFixedReport')
          $e=$t.IndexOf('function Run-SelfRelianceWatchdogOnce',$s)
          if($s-lt0 -or $e-le$s){throw 'unable to isolate safe report publisher'}
          $b=$t.Substring($s,$e-$s)
          if($b -notmatch 'for\(\$attempt=1;\$attempt-le3;\$attempt\+\+\)'){throw 'bounded retry loop missing'}
          if(-not$b.Contains("--jq','.content")){throw 'remote content verification missing'}
          if(-not$b.Contains('remoteHash-eq$localHash')){throw 'remote hash equality check missing'}
          if($b -match '(?i)invoke-expression|kevin_shell|cmd\.exe'){throw 'publisher widened authority'}
          if($t.Contains("Invoke-OpenClawFixedConfig @('automations'")){throw 'runtime-incompatible automations CLI regressed'}
          Write-Host 'MAINT_V1335_INVARIANTS_PASS bounded_publish=3 remote_hash=true cron_alias=true backoff_reset=true'
      - name: Emit exact identity
        shell: pwsh
        run: |
          $sha=(Get-FileHash 'control-plane/maintenance/kevin-maintenance-runner-v1.3.35.ps1' -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "MAINT_V1335_CI_PROVEN sha256=$sha"
          "MAINT_V1335_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish exact proven candidate through Git database API
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo='hessmodee/KEVIN-WORK';$path='control-plane/maintenance/kevin-maintenance-runner-v1.3.35.ps1'
          $bytes=[IO.File]::ReadAllBytes($path)
          if((Get-FileHash $path -Algorithm SHA256).Hash.ToUpperInvariant() -ne $env:MAINT_V1335_SHA){throw 'candidate identity changed after proof'}
          $utf8=New-Object Text.UTF8Encoding($false)
          function Api([string]$method,[string]$endpoint,[object]$body=$null){
            if($null-eq$body){$out=gh api $endpoint 2>$null}else{$tmp=Join-Path $env:RUNNER_TEMP ('api-'+[guid]::NewGuid().ToString('N')+'.json');try{[IO.File]::WriteAllText($tmp,($body|ConvertTo-Json -Depth 20 -Compress),$utf8);$out=gh api --method $method $endpoint --input $tmp 2>$null}finally{Remove-Item $tmp -Force -ErrorAction SilentlyContinue}}
            if($LASTEXITCODE-ne0){return $null};return($out|ConvertFrom-Json)
          }
          $blob=Api 'POST' "repos/$repo/git/blobs" ([ordered]@{content=[Convert]::ToBase64String($bytes);encoding='base64'});if(-not$blob.sha){throw 'blob creation failed'}
          $ok=$false
          for($attempt=1;$attempt-le100;$attempt++){
            $ref=Api 'GET' "repos/$repo/git/ref/heads/main";if(-not$ref.object.sha){Start-Sleep -Milliseconds 250;continue}
            $parent=[string]$ref.object.sha;$pc=Api 'GET' "repos/$repo/git/commits/$parent";if(-not$pc.tree.sha){Start-Sleep -Milliseconds 250;continue}
            $tree=Api 'POST' "repos/$repo/git/trees" ([ordered]@{base_tree=[string]$pc.tree.sha;tree=@([ordered]@{path=$path;mode='100644';type='blob';sha=[string]$blob.sha})});if(-not$tree.sha){Start-Sleep -Milliseconds 250;continue}
            $commit=Api 'POST' "repos/$repo/git/commits" ([ordered]@{message='Publish CI-proven Maintenance v1.3.35';tree=[string]$tree.sha;parents=@($parent)});if(-not$commit.sha){Start-Sleep -Milliseconds 250;continue}
            $move=Api 'PATCH' "repos/$repo/git/refs/heads/main" ([ordered]@{sha=[string]$commit.sha;force=$false});if($move.object.sha-eq[string]$commit.sha){$ok=$true;break};Start-Sleep -Milliseconds 250
          }
          if(-not$ok){throw 'v1.3.35 publication exhausted bounded retries'}
          Write-Host "MAINT_V1335_PUBLISH_ACCEPTED sha256=$env:MAINT_V1335_SHA force=false"
