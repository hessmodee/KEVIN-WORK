name: Maintenance v1.3.47 Candidate

on:
  push:
    branches:
      - bess-maintenance-v1347-desired-sync-20260903
    paths:
      - '.github/scripts/generate-maintenance-v1347.py'
      - '.github/workflows/maintenance-v1347-candidate.yml'
  pull_request:
    paths:
      - '.github/scripts/generate-maintenance-v1347.py'
      - 'control-plane/maintenance/kevin-maintenance-runner-v1.3.47.ps1'
      - '.github/workflows/maintenance-v1347-candidate.yml'

permissions:
  contents: write

jobs:
  generate-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exact-source candidate
        shell: pwsh
        run: |
          python .github/scripts/generate-maintenance-v1347.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse and self-test in Windows PowerShell 5.1
        shell: powershell
        run: |
          $p='control-plane/maintenance/kevin-maintenance-runner-v1.3.47.ps1'
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){ throw $errors[0].Message }
          $out = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p -SelfTest 2>&1 | Out-String
          if($LASTEXITCODE -ne 0){ throw "v1.3.47 selftest exit=$LASTEXITCODE`n$out" }
          if($out -notmatch 'KEVIN MAINTENANCE v1\.3\.47 SELFTEST PASS'){ throw "v1.3.47 selftest marker missing`n$out" }
          if($out -notmatch 'arbitrary_shell=false' -or $out -notmatch 'authority_expansion=false'){ throw 'safety selftest markers missing' }
          Write-Host $out
      - name: Determinism and semantic anchors
        shell: pwsh
        run: |
          $p='control-plane/maintenance/kevin-maintenance-runner-v1.3.47.ps1'
          $h1=(Get-FileHash $p -Algorithm SHA256).Hash
          python .github/scripts/generate-maintenance-v1347.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $h2=(Get-FileHash $p -Algorithm SHA256).Hash
          if($h1 -ne $h2){ throw 'candidate generation is not deterministic' }
          $t=Get-Content $p -Raw
          foreach($m in @('Sync-LocalDesiredStateV19','remote desired-state Maintenance pin does not match installed Maintenance identity','approvedPredecessors','Assert-Benchmark30','desired_state_sync=live_pin_cas_rollback')){if(-not$t.Contains($m)){throw "missing anchor $m"}}
          if($t.Contains('sync_local_desired_state_v18')){throw 'obsolete desired-state operation remains'}
          Write-Host "MAINTENANCE_V1347_CANDIDATE_PASS sha256=$h2"
      - name: Commit generated candidate to branch
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name 'Kevin Candidate Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add control-plane/maintenance/kevin-maintenance-runner-v1.3.47.ps1
          if (git diff --cached --quiet) {
            Write-Host 'Generated candidate already committed.'
            exit 0
          }
          git commit -m 'materialize Maintenance v1.3.47 candidate'
          git push origin HEAD:${{ github.ref_name }}
