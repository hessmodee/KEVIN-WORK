name: Validate Ops Active Lane Flow

on:
  push:
    branches:
      - kevin-ops-active-lane-flow
    paths:
      - '.github/workflows/ops-active-lane-flow.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kevin-ops-active-lane-flow
      - name: Unify active lane animation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $utf8=New-Object System.Text.UTF8Encoding($false)
          $css='docs/ops/ops-v11.css'
          $embed='docs/ops/embed.html'
          $expectedCss='58dec8c67379ee9cf976acd77d2425fa0d80e475'
          $expectedEmbed='996c029949b38e2c53aeaa8100abb78824b6c1ec'
          if((git hash-object -- $css).Trim() -cne $expectedCss){throw 'Unexpected Ops CSS preimage'}
          if((git hash-object -- $embed).Trim() -cne $expectedEmbed){throw 'Unexpected Ops embed preimage'}

          $t=[IO.File]::ReadAllText($css)
          $old='.line{position:absolute;height:2px;background:linear-gradient(90deg,transparent,var(--statec),transparent);transform-origin:left center;opacity:.34;z-index:1;pointer-events:none}.line.active{opacity:.95;box-shadow:0 0 10px color-mix(in srgb,var(--statec) 42%,transparent)}.line.state-connecting{background:repeating-linear-gradient(90deg,var(--statec) 0 8px,transparent 8px 16px);background-size:30px 2px}.line.state-connecting.active{animation:flow .95s linear infinite}.line.state-building.active{background:repeating-linear-gradient(90deg,var(--statec) 0 10px,transparent 10px 18px);background-size:32px 2px;animation:flow 1.2s linear infinite}.line.state-working.active,.line.state-thinking.active{animation:pulseLine 1.6s ease-in-out infinite}'
          $new='.line{position:absolute;height:2px;background:linear-gradient(90deg,transparent,var(--statec),transparent);transform-origin:left center;opacity:.34;z-index:1;pointer-events:none}.line.active{opacity:.95;box-shadow:0 0 10px color-mix(in srgb,var(--statec) 42%,transparent);background:repeating-linear-gradient(90deg,var(--statec) 0 8px,transparent 8px 15px);background-size:30px 2px;animation:flow 1.2s linear infinite}.line.state-connecting.active{animation-duration:.95s}.line.state-building.active{animation-duration:1.1s}.line.state-working.active{animation-duration:1.25s}.line.state-thinking.active{animation-duration:1.45s}'
          $count=([regex]::Matches($t,[regex]::Escape($old))).Count
          if($count -ne 1){throw "Active lane CSS replacement count=$count"}
          $t=$t.Replace($old,$new)
          [IO.File]::WriteAllText($css,$t,$utf8)

          $h=[IO.File]::ReadAllText($embed)
          $oldHref='./ops-v11.css?v=11'
          $newHref='./ops-v11.css?v=12'
          if(([regex]::Matches($h,[regex]::Escape($oldHref))).Count -ne 1){throw 'Ops CSS cache-bust replacement mismatch'}
          $h=$h.Replace($oldHref,$newHref)
          [IO.File]::WriteAllText($embed,$h,$utf8)
          Write-Host 'PASS active WORKING/THINKING/BUILDING/CONNECTING lanes now share flowing segmented treatment.'
      - name: Validate visual-state contract
        shell: powershell
        run: |
          $css=Get-Content docs/ops/ops-v11.css -Raw
          $js=Get-Content docs/ops/ops-v11.js -Raw
          $embed=Get-Content docs/ops/embed.html -Raw
          foreach($state in @('working','thinking','building','connecting')){
            if(-not $js.Contains("'"+$state+"'")){throw "JS state missing: $state"}
            if(-not $css.Contains(".line.state-$state.active")){throw "Active lane style missing: $state"}
          }
          if(-not $css.Contains('background:repeating-linear-gradient(90deg,var(--statec) 0 8px,transparent 8px 15px)')){throw 'Segmented flow pattern missing'}
          if(-not $css.Contains('animation:flow 1.2s linear infinite')){throw 'Flow animation missing'}
          if(-not $embed.Contains('./ops-v11.css?v=12')){throw 'CSS cache-bust missing'}
          Write-Host 'PASS active lane visual-state contract.'
      - name: Commit active lane fix
        shell: powershell
        run: |
          git config user.name "Kevin HQ CI"
          git config user.email "kevin-hq-ci@users.noreply.github.com"
          git add docs/ops/ops-v11.css docs/ops/embed.html
          if(git diff --cached --quiet){throw 'Active lane patch produced no change'}
          git commit -m "Show flowing lanes for every active Ops worker"
          git push origin HEAD:kevin-ops-active-lane-flow
