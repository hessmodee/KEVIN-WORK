name: Validate Kevin Control Plane v1

on:
  push:
    branches: [kevin-control-plane-v1]
    paths:
      - 'control-plane/dispatcher/**'
      - 'control-plane/intake/**'
      - 'control-plane/schemas/**'
      - 'control-plane/install/**'
      - 'control-plane/CONTROL-PLANE-v1.md'
      - '.github/scripts/test-control-plane-v1.ps1'
      - '.github/scripts/test-work-order-intake-v1.ps1'
      - '.github/scripts/test-control-plane-installer-v1.ps1'
      - '.github/workflows/control-plane-v1-windows.yml'

permissions:
  contents: read

jobs:
  windows-control-plane-v1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kevin-control-plane-v1
      - name: Run Windows PowerShell 5.1 control-plane tests
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github/scripts/test-control-plane-v1.ps1
          if($LASTEXITCODE -ne 0){throw 'Control Plane v1 Windows test suite failed'}
      - name: Run typed work-order intake end-to-end regression
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github/scripts/test-work-order-intake-v1.ps1
          if($LASTEXITCODE -ne 0){throw 'Work-order intake end-to-end regression failed'}
      - name: Validate final Control Plane v1 installer
        shell: powershell
        run: |
          # Full rerun after the one-shot installer parser repair.
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github/scripts/test-control-plane-installer-v1.ps1
          if($LASTEXITCODE -ne 0){throw 'Control Plane v1 installer validation failed'}
