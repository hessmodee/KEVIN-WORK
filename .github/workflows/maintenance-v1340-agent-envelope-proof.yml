name: Maintenance v1.3.40 Agent Envelope Proof

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate-maintenance-v1340-agent-envelope.py'
      - '.github/workflows/maintenance-v1340-agent-envelope-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proof:
    runs-on: windows-2025
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate exact v1.3.40 candidate
        shell: pwsh
        run: |
          $src=(Get-FileHash 'control-plane/maintenance/kevin-maintenance-runner-v1.3.39.ps1' -Algorithm SHA256).Hash.ToUpperInvariant()
          if($src-ne'1863A86CE3E03492CF438A09575CF8B77F3BEB0FA43695AA3DDC532940F292D2'){throw "v1.3.39 parent drifted $src"}
          python tools/generate-maintenance-v1340-agent-envelope.py
          if($LASTEXITCODE-ne0){throw 'v1.3.40 generation failed'}

      - name: Parse and authority boundary
        shell: pwsh
        run: |
          $p='control-plane/maintenance/kevin-maintenance-runner-v1.3.40.ps1'
          $tokens=$null;$errors=$null;$ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
          if($errors.Count){throw $errors[0].Message}
          $commands=@($ast.FindAll({param($n)$n-is[Management.Automation.Language.CommandAst]},$true)|ForEach-Object{$_.GetCommandName()}|Where-Object{$_}|ForEach-Object{$_.ToLowerInvariant()})
          foreach($bad in @('invoke-expression','iex','cmd.exe','kevin_shell')){if($commands-contains$bad){throw "forbidden command $bad"}}
          $badArgs=@($ast.FindAll({param($n)$n-is[Management.Automation.Language.ParameterAst]-and$n.Name.VariablePath.UserPath-eq'args'},$true))
          if($badArgs.Count){throw 'automatic Args parameter regressed'}

      - name: Full inherited self-test PS5.1
        shell: powershell
        run: |
          $env:KEVIN_MAINT_TEST_ROOT=Join-Path $env:RUNNER_TEMP 'v1340-ps51'
          & .\control-plane\maintenance\kevin-maintenance-runner-v1.3.40.ps1 -SelfTest
          if($LASTEXITCODE-ne0){throw 'v1.3.40 PS5.1 selftest failed'}

      - name: Full inherited self-test PS7
        shell: pwsh
        run: |
          $env:KEVIN_MAINT_TEST_ROOT=Join-Path $env:RUNNER_TEMP 'v1340-ps7'
          & .\control-plane\maintenance\kevin-maintenance-runner-v1.3.40.ps1 -SelfTest
          if($LASTEXITCODE-ne0){throw 'v1.3.40 PS7 selftest failed'}

      - name: Operation parity and envelope invariants
        shell: pwsh
        run: |
          python tools/check-maintenance-operation-parity.py control-plane/maintenance/kevin-maintenance-runner-v1.3.40.ps1
          if($LASTEXITCODE-ne0){throw 'operation parity failed'}
          $t=[IO.File]::ReadAllText('control-plane/maintenance/kevin-maintenance-runner-v1.3.40.ps1')
          foreach($m in @("version='1.3.40'",'openclaw_stable_envelope=true','top_level_final=true','top_level_payloads=true','status_ok=true','legacy_nested=true','exact_canary_semantics_preserved=true','zero_tools_required=true','four_independent_readonly_probes=true','supervisor_target=v1.8.5')){if(-not$t.Contains($m)){throw "missing invariant $m"}}
          $statusLiteral='$statusOk=($status-eq''ok'' -or $status-eq''success'')'
          if(-not$t.Contains($statusLiteral)){throw 'current OpenClaw status acceptance missing'}
          $finalLiteral='Get-OptionalPropertyValue $Obj ''final'''
          if(-not$t.Contains($finalLiteral)){throw 'top-level final parser missing'}
          Write-Host 'V1340_ENVELOPE_PASS current_openclaw=true legacy=true exact_reply=true zero_tools=true authority_expansion=false'

      - name: Emit exact identity
        shell: pwsh
        run: |
          $m=(Get-FileHash 'control-plane/maintenance/kevin-maintenance-runner-v1.3.40.ps1' -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "MAINT_V1340_CI_PROVEN sha256=$m"
          "MAINT_V1340_SHA=$m"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish exact candidate with bounded CAS
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo='hessmodee/KEVIN-WORK';$path='control-plane/maintenance/kevin-maintenance-runner-v1.3.40.ps1';$expected=$env:MAINT_V1340_SHA;$utf8=New-Object Text.UTF8Encoding($false)
          $bytes=[IO.File]::ReadAllBytes($path);if((Get-FileHash $path -Algorithm SHA256).Hash.ToUpperInvariant()-ne$expected){throw 'candidate identity changed'}
          function Api([string]$method,[string]$endpoint,[object]$body=$null){if($null-eq$body){$out=gh api $endpoint 2>$null}else{$tmp=Join-Path $env:RUNNER_TEMP ('api-'+[guid]::NewGuid().ToString('N')+'.json');try{[IO.File]::WriteAllText($tmp,($body|ConvertTo-Json -Depth 20 -Compress),$utf8);$out=gh api --method $method $endpoint --input $tmp 2>$null}finally{Remove-Item $tmp -Force -ErrorAction SilentlyContinue}};if($LASTEXITCODE-ne0){return $null};return($out|ConvertFrom-Json)}
          $blob=Api 'POST' "repos/$repo/git/blobs" ([ordered]@{content=[Convert]::ToBase64String($bytes);encoding='base64'});if(-not$blob.sha){throw 'blob creation failed'}
          $entry=[ordered]@{path=$path;mode='100644';type='blob';sha=[string]$blob.sha};$ok=$false
          for($a=1;$a-le100;$a++){$ref=Api 'GET' "repos/$repo/git/ref/heads/main";if(-not$ref.object.sha){Start-Sleep -Milliseconds 250;continue};$parent=[string]$ref.object.sha;$pc=Api 'GET' "repos/$repo/git/commits/$parent";if(-not$pc.tree.sha){Start-Sleep -Milliseconds 250;continue};$tree=Api 'POST' "repos/$repo/git/trees" ([ordered]@{base_tree=[string]$pc.tree.sha;tree=@($entry)});if(-not$tree.sha){Start-Sleep -Milliseconds 250;continue};$commit=Api 'POST' "repos/$repo/git/commits" ([ordered]@{message='Publish CI-proven Maintenance v1.3.40';tree=[string]$tree.sha;parents=@($parent)});if(-not$commit.sha){Start-Sleep -Milliseconds 250;continue};$move=Api 'PATCH' "repos/$repo/git/refs/heads/main" ([ordered]@{sha=[string]$commit.sha;force=$false});if($move.object.sha-eq[string]$commit.sha){$ok=$true;break};Start-Sleep -Milliseconds 250}
          if(-not$ok){throw 'v1.3.40 publication retries exhausted'}
          Write-Host "V1340_PUBLISHED sha256=$expected force=false"
