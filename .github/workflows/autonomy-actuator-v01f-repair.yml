name: Build resilient Kevin Autonomy Reconciler v0.1f

on:
  push:
    branches:
      - kevin-autonomy-actuator-v0.1
    paths:
      - '.github/workflows/autonomy-actuator-v01f-repair.yml'
      - '.github/scripts/patch-autonomy-v01f.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kevin-autonomy-actuator-v0.1
      - name: Apply deterministic reconciler patch
        shell: powershell
        run: .github/scripts/patch-autonomy-v01f.ps1
      - name: Commit validated reconciler repair
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (git status --porcelain)){throw 'Expected reconciler patch produced no change'}
          git config user.name 'Kevin Control Plane CI'
          git config user.email 'kevin-control-plane-ci@users.noreply.github.com'
          git add control-plane/actuator/kevin-autonomy-actuator-v0.1.ps1
          git commit -m 'Make autonomy audit resilient to live list-query failure'
          git push origin HEAD:kevin-autonomy-actuator-v0.1
