name: HQ UI Liveness Cadence Fix

on:
  push:
    branches: [bess-hq-truth-cadence-fix2-20260903]
    paths:
      - '.github/scripts/patch-hq-ui-cadence.py'
      - '.github/workflows/hq-ui-cadence-fix.yml'
  pull_request:
    paths:
      - '.github/scripts/patch-hq-ui-cadence.py'
      - 'docs/hq-truth-v2.js'
      - 'docs/hq-owner-refinement-v3.js'
      - 'docs/index.html'
      - '.github/workflows/hq-ui-cadence-fix.yml'
permissions:
  contents: write
jobs:
  repair-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply deterministic patch
        run: python .github/scripts/patch-hq-ui-cadence.py
      - name: Assert truthful cadence semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('docs/hq-truth-v2.js').read_text()
          i=Path('docs/index.html').read_text()
          h=Path('docs/hq-owner-refinement-v3.js').read_text()
          assert "fresh:180,delayed:360,claim:'relay / skills / UI Bridge'" in t
          assert "+ageSec(e.generated_at)" not in t
          assert "UI Bridge heartbeat was stale at last engineering sample" in t
          assert "UI Bridge liveness evidence is delayed" in t
          assert "hbSample>60" in t
          assert 'hq-truth-v2.js?v=4' in i
          assert "const b=line.match(/^\\d+\\.\\s+\\*\\*(.+?)\\*\\*\\s+(.+)$/)" in h
          assert "b[1].replace(/\\.$/,'').trim()" in h
          # Current task uses **Title.** Detail for P0 repair targets; prove the parser no longer
          # silently falls back to canned priorities when that canonical form is present.
          task=Path('inbox/CURRENT_TASK.md').read_text()
          assert '**Main-agent tool starvation.**' in task
          import re
          line=next(x.strip() for x in task.splitlines() if '**Main-agent tool starvation.**' in x)
          m=re.match(r'^\d+\.\s+\*\*(.+?)\*\*\s+(.+)$',line)
          assert m and m.group(1).rstrip('.').strip()=='Main-agent tool starvation' and len(m.group(2))>10
          print('HQ_UI_CADENCE_TEST_PASS false_between_samples_warning=false stale_sample_detected=true delayed_source_detected=true current_task_parser=live')
          PY
      - name: JavaScript syntax
        run: node --check docs/hq-owner-refinement-v3.js
      - name: Commit generated repair to branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'Kevin HQ Truth Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/hq-truth-v2.js docs/hq-owner-refinement-v3.js docs/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'repair HQ truth cadence and current-task parsing'
          git push origin HEAD:${{ github.ref_name }}
