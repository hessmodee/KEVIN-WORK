name: Generate Skill Lab v1.0.9 TEMP

on:
  push:
    branches: [bess/skill-lab-v109-ready-transition-20260906]
    paths:
      - 'tools/generate-skill-lab-v1.0.9.py'
      - '.github/workflows/generate-skill-lab-v109-temp.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bess/skill-lab-v109-ready-transition-20260906
      - name: Generate candidate
        run: python tools/generate-skill-lab-v1.0.9.py
      - name: Commit deterministic candidate
        run: |
          git config user.name 'Kevin CI'
          git config user.email 'actions@users.noreply.github.com'
          git add control-plane/skill-lab/kevin-skill-lab-v1.0.9.ps1
          if git diff --cached --quiet; then
            echo 'candidate already current'
            exit 0
          fi
          git commit -m 'Generate Skill Lab v1.0.9 READY-aware runner'
          git push origin HEAD:bess/skill-lab-v109-ready-transition-20260906
