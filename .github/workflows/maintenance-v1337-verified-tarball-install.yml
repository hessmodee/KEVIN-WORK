name: Maintenance v1.3.37 Verified Tarball Install Proof

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate-maintenance-v1337-verified-tarball-install.py'
      - 'control-plane/maintenance/kevin-maintenance-runner-v1.3.36.ps1'
      - '.github/workflows/maintenance-v1337-verified-tarball-install.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proof:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate exact Maintenance v1.3.37
        run: python tools/generate-maintenance-v1337-verified-tarball-install.py
      - name: Parse and forbid authority widening
        shell: pwsh
        run: |
          $p=(Resolve-Path 'control-plane/maintenance/kevin-maintenance-runner-v1.3.37.ps1')
          $tokens=$null;$errors=$null;$ast=[Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw $errors[0].Message}
          $names=@($ast.FindAll({param($n) $n -is [Management.Automation.Language.CommandAst]},$true)|ForEach-Object{$_.GetCommandName()}|Where-Object{$_}|ForEach-Object{$_.ToLowerInvariant()})
          foreach($bad in @('invoke-expression','iex','cmd.exe','kevin_shell')){if($names -contains $bad){throw "forbidden Maintenance command $bad"}}
      - name: Run full inherited self-test
        shell: pwsh
        run: |
          $env:KEVIN_MAINT_TEST_ROOT=Join-Path $env:RUNNER_TEMP 'kevin-maint-v1337-selftest'
          New-Item -ItemType Directory -Force -Path $env:KEVIN_MAINT_TEST_ROOT|Out-Null
          & .\control-plane\maintenance\kevin-maintenance-runner-v1.3.37.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){throw "Maintenance v1.3.37 selftest exit=$LASTEXITCODE"}
      - name: Prove operation parity
        run: python tools/check-maintenance-operation-parity.py control-plane/maintenance/kevin-maintenance-runner-v1.3.37.ps1
      - name: Assert fixed verified package path
        shell: pwsh
        run: |
          $t=[IO.File]::ReadAllText('control-plane/maintenance/kevin-maintenance-runner-v1.3.37.ps1')
          foreach($m in @(
            "version='1.3.37'",
            'function Get-FixedOpenClawTarballSpec',
            'function Get-FileSriSha512',
            'function Download-VerifiedOpenClawTarball',
            'https://registry.npmjs.org/openclaw/-/openclaw-',
            'downloaded OpenClaw tarball integrity mismatch',
            "@('install','--global',`$tar",
            'install_from_verified_local_tarball=true',
            'dynamic_npm_view=false',
            'lkg_config_compat=target_validates_untouched',
            'safe_report_publish=bounded3',
            "@('cron','add','--name',`$name,'--every','5m'"
          )){if(-not$t.Contains($m)){throw "missing v1.3.37 invariant: $m"}}
          if($t.Contains("@('view',('openclaw@'+`$Version),'dist.integrity'")){throw 'dynamic npm-view integrity dependency remains'}
          $s=$t.IndexOf('function Get-FixedOpenClawTarballSpec')
          $e=$t.IndexOf('function Wait-GatewayRpc',$s)
          if($s-lt0 -or $e-le$s){throw 'unable to isolate package installer block'}
          $b=$t.Substring($s,$e-$s)
          if($b.Contains('http://')){throw 'insecure package transport present'}
          if($b -match '(?i)invoke-expression|kevin_shell|cmd\.exe'){throw 'package path widened authority'}
          Write-Host 'MAINT_V1337_INVARIANTS_PASS fixed_registry=true byte_sri=true local_verified_install=true rollback_same_contract=true arbitrary_url=false'
      - name: Prove official LKG tarball bytes match embedded SRI
        shell: pwsh
        run: |
          $url='https://registry.npmjs.org/openclaw/-/openclaw-2026.6.34.tgz'
          $expected='sha512-Rm4khBrWn9HYqE99NBryCFgjwlsIuwBqK5jIANn2773CGXJ1JIZkDn5twEHB+8SVFdh0FPNPHRVgZepzNJDfHg=='
          $p=Join-Path $env:RUNNER_TEMP 'openclaw-2026.6.34.tgz'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $p -TimeoutSec 180
          $sha=[Security.Cryptography.SHA512]::Create()
          try{$fs=[IO.File]::OpenRead($p);try{$digest=$sha.ComputeHash($fs)}finally{$fs.Dispose()}}finally{$sha.Dispose()}
          $actual='sha512-'+[Convert]::ToBase64String($digest)
          if($actual-ne$expected){throw "official tarball SRI mismatch actual=$actual"}
          Write-Host 'OPENCLAW_LKG_TARBALL_PROVEN version=2026.6.34 sri_match=true transport=https registry=registry.npmjs.org'
      - name: Emit exact identity
        shell: pwsh
        run: |
          $sha=(Get-FileHash 'control-plane/maintenance/kevin-maintenance-runner-v1.3.37.ps1' -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "MAINT_V1337_CI_PROVEN sha256=$sha"
          "MAINT_V1337_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish exact proven candidate through Git database API
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo='hessmodee/KEVIN-WORK';$path='control-plane/maintenance/kevin-maintenance-runner-v1.3.37.ps1'
          $bytes=[IO.File]::ReadAllBytes($path)
          if((Get-FileHash $path -Algorithm SHA256).Hash.ToUpperInvariant() -ne $env:MAINT_V1337_SHA){throw 'candidate identity changed after proof'}
          $utf8=New-Object Text.UTF8Encoding($false)
          function Api([string]$method,[string]$endpoint,[object]$body=$null){
            if($null-eq$body){$out=gh api $endpoint 2>$null}else{$tmp=Join-Path $env:RUNNER_TEMP ('api-'+[guid]::NewGuid().ToString('N')+'.json');try{[IO.File]::WriteAllText($tmp,($body|ConvertTo-Json -Depth 20 -Compress),$utf8);$out=gh api --method $method $endpoint --input $tmp 2>$null}finally{Remove-Item $tmp -Force -ErrorAction SilentlyContinue}}
            if($LASTEXITCODE-ne0){return $null};return($out|ConvertFrom-Json)
          }
          $blob=Api 'POST' "repos/$repo/git/blobs" ([ordered]@{content=[Convert]::ToBase64String($bytes);encoding='base64'});if(-not$blob.sha){throw 'blob creation failed'}
          $ok=$false
          for($attempt=1;$attempt-le100;$attempt++){
            $ref=Api 'GET' "repos/$repo/git/ref/heads/main";if(-not$ref.object.sha){Start-Sleep -Milliseconds 250;continue}
            $parent=[string]$ref.object.sha;$pc=Api 'GET' "repos/$repo/git/commits/$parent";if(-not$pc.tree.sha){Start-Sleep -Milliseconds 250;continue}
            $tree=Api 'POST' "repos/$repo/git/trees" ([ordered]@{base_tree=[string]$pc.tree.sha;tree=@([ordered]@{path=$path;mode='100644';type='blob';sha=[string]$blob.sha})});if(-not$tree.sha){Start-Sleep -Milliseconds 250;continue}
            $commit=Api 'POST' "repos/$repo/git/commits" ([ordered]@{message='Publish CI-proven Maintenance v1.3.37';tree=[string]$tree.sha;parents=@($parent)});if(-not$commit.sha){Start-Sleep -Milliseconds 250;continue}
            $move=Api 'PATCH' "repos/$repo/git/refs/heads/main" ([ordered]@{sha=[string]$commit.sha;force=$false});if($move.object.sha-eq[string]$commit.sha){$ok=$true;break};Start-Sleep -Milliseconds 250
          }
          if(-not$ok){throw 'v1.3.37 publication exhausted bounded retries'}
          Write-Host "MAINT_V1337_PUBLISH_ACCEPTED sha256=$env:MAINT_V1337_SHA force=false"
