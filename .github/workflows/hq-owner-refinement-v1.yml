name: HQ Owner Refinement v1 Gate

on:
  push:
    paths:
      - 'docs/index.html'
      - 'docs/hq-owner-refinement-v2.js'
      - 'docs/hq-fun-v2.js'
      - 'docs/hq-overrides-v1.js'
      - 'docs/ops/embed.html'
      - 'docs/ops/ops-truth-patch-v1.js'
      - 'docs/ops/ops-owner-refinement-v1.js'
      - 'docs/ops/ops-owner-refinement-v1.css'
      - 'docs/ops/ops-fun-v2.js'
      - '.github/workflows/hq-owner-refinement-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check docs/hq-owner-refinement-v2.js
          node --check docs/hq-fun-v2.js
          node --check docs/ops/ops-truth-patch-v1.js
          node --check docs/ops/ops-owner-refinement-v1.js
          node --check docs/ops/ops-fun-v2.js
          node --check docs/hq-overrides-v1.js
      - name: PowerShell timestamp compatibility
        run: |
          node - <<'NODE'
          const sample='2026-08-30T22:40:34.1159186-06:00';
          const normalized=sample.replace(/(\.\d{3})\d+(?=(?:Z|[+-]\d{2}:\d{2})$)/,'$1');
          if(!Number.isFinite(Date.parse(normalized))) throw new Error('PowerShell timestamp normalization failed');
          console.log('TIMESTAMP_COMPAT_PASS',normalized);
          NODE
      - name: Owner UI invariants
        shell: python
        run: |
          from pathlib import Path
          idx=Path('docs/index.html').read_text()
          hq=Path('docs/hq-owner-refinement-v2.js').read_text()
          hqfun=Path('docs/hq-fun-v2.js').read_text()
          emb=Path('docs/ops/embed.html').read_text()
          truth=Path('docs/ops/ops-truth-patch-v1.js').read_text()
          ops=Path('docs/ops/ops-owner-refinement-v1.js').read_text()
          opsfun=Path('docs/ops/ops-fun-v2.js').read_text()
          css=Path('docs/ops/ops-owner-refinement-v1.css').read_text()
          over=Path('docs/hq-overrides-v1.js').read_text()
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          class Assets(HTMLParser):
              def __init__(self,text):
                  super().__init__(); self.sources={}; self.feed(text)
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag in ('script','iframe','link'):
                      value=a.get('src') or a.get('href')
                      if value:
                          u=urlsplit(value)
                          assert not u.scheme and not u.netloc, value
                          self.sources[u.path]=(tag,a,u)
          shell=Assets(idx).sources
          assert './hq-core-v7.html' in shell
          tag,attrs,url=shell['./hq-core-v7.html']
          assert tag=='iframe' and attrs.get('id')=='kevinCore' and url.fragment=='overview'
          for name in ['hq-overrides-v1.js','hq-owner-refinement-v2.js','hq-fun-v2.js']:
              assert './'+name in shell and Path('docs',name).is_file()
          embedded=Assets(emb).sources
          for name in ['ops-owner-refinement-v1.css','ops-truth-patch-v1.js','ops-owner-refinement-v1.js','ops-fun-v2.js']:
              assert './'+name in embedded and Path('docs/ops',name).is_file()
          assert "href==='about:blank'" in hq and 'boundDoc===doc' in hq and "frame.addEventListener('load'" in hq
          assert 'function installCoreTimestampParser' in hq and 'core.parseAt=' in hq
          assert "startsWith('owner-sync-')||c.startsWith('mode-')" in hq
          assert "e.data.states||e.data.state||'READY'" in hq
          assert 'activeStates(d,s)' in hq and "return ['BUILDING','WORKING'].filter" in hq
          assert 'livePulseHealthy' in hq and "kevin-hq-live-pulse-v15" in hq
          assert 'observer.observe(x,{childList:true})' in hq and 'subtree:true' not in hq
          assert 'function setText' in hq and "setText(card.querySelector('.k')" in hq
          for status in ['READY','ARMED','ACTIVE','WORKING','BUILDING','COOLDOWN','DEGRADED','OFFLINE']:
              assert status in emb
          assert 'function authoritativeStates' in truth and 'function explicitActiveStates' in truth
          assert "if(explicitActiveStates(d,s).length)return false" in truth
          assert 'A refresh failure is not evidence that Kevin is offline' in truth
          assert "badge.innerHTML=clean.map" in truth and "states:[...clean]" in truth
          assert 'new MutationObserver' in truth and 'ensureAuthority' in truth
          assert 'statusObserver' in truth and "statusObserver.observe(status" in truth
          assert "const wanted=clean.join(' + ')" in truth
          assert "cycle=s?.supervisor?.cycle" not in truth
          assert "setInterval(refreshTruth,2500)" in truth
          assert 'worker-progress{display:none!important}' in css
          assert '.worker .owl-beak{fill:var(--idc)' in css
          assert '.worker.working .owl-beak,.worker.building .owl-beak,.worker.active .owl-beak{display:none!important}' in css
          assert '#kevinHub.owner-selected,#kevinHub:focus,#kevinHub:focus-visible{outline:none!important}' in css
          assert '#kevinHub .hub-inner{height:236px;min-height:236px;width:230px;justify-content:flex-start}' in css
          assert '#kevinHub .kevin-meta{min-height:62px' in css
          assert '#kevinHub.truth-armed .hub-inner{box-shadow:none!important}' in css
          assert "class:'owl-beak-cutout'" in ops and "class:'owl-beak'" in ops
          assert "querySelectorAll('.worker-progress').forEach(x=>x.remove())" in ops
          assert 'refreshTelemetry' not in ops and 'applyTruth' not in ops
          assert "class:'owl-eye-outline'" in opsfun and '--blink-rate' in opsfun and '--blink-delay' in opsfun
          assert "data-fun-outline" in opsfun and "existing?.dataset?.funOutline==='1'" in opsfun
          assert "selected='KEVIN'" in opsfun and 'Select Kevin, Chief of Staff' in opsfun
          assert 'function shownState' in opsfun and "['WORKING','BUILDING'].includes(stateOf(w))" in opsfun
          assert 'gazeQueue=[...shuffled([...names]),null]' in opsfun and "find(w=>workerName(w)===targetName)" in opsfun
          assert "type:'kevin-ops-gaze'" in opsfun and "type:'kevin-ops-celebrate'" in opsfun
          assert 'ownerVictoryFlip' in css and 'owner-header-victory' in hqfun
          assert "e.data?.type==='kevin-ops-gaze'" in hqfun and "e.data?.type==='kevin-ops-celebrate'" in hqfun
          assert "[data-tab=\"talk\"]" in hq
          assert "setText(span,'READY')" in hq
          assert "main.insertBefore(card,hero)" in hq
          assert 'COPY KEVIN HANDOVER' in hq
          assert 'AI-HANDOVER.md' in over and "cache:'no-store'" in over
          assert 'setInterval(refreshTruth,15000)' in hq
          assert 'setInterval(refreshBase,4000)' in opsfun
          assert "type:'kevin-ops-state'" in truth and "type!=='kevin-ops-state'" in hq
          print('HQ_OWNER_REFINEMENT_PASS single_state_arbiter=true selected_status_stable=true no_cycle_flash=true no_offline_flash=true active_outranks_offline=true aggregate_building_working=true header_avatar_sync=true timestamp_parser_override=true gaze_current_workers_only=true worker_beak_cutout=true hub_layout_stable=true')
      - name: Behavioral shell and stale-evidence protection
        run: |
          node .github/scripts/test-hq-owner-invariants.cjs
          node .github/scripts/test-hq-live-data.cjs
