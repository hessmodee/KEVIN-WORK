name: HQ Truth-First Owner Gate

on:
  push:
    paths:
      - 'docs/index.html'
      - 'docs/hq-core-v7.html'
      - 'docs/hq-overrides-v1.js'
      - 'docs/hq-truth-v2.js'
      - 'docs/hq-owner-refinement-v3.js'
      - 'docs/hq-growth-v1.js'
      - 'docs/HQ-TRUTH-CONTRACT.md'
      - 'docs/sw.js'
      - 'docs/ops/**'
      - '.github/scripts/test-hq-owner-invariants.cjs'
      - '.github/scripts/test-hq-live-data.cjs'
      - '.github/workflows/hq-owner-refinement-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check docs/hq-overrides-v1.js
          node --check docs/hq-truth-v2.js
          node --check docs/hq-owner-refinement-v3.js
          node --check docs/hq-growth-v1.js
          node --check docs/ops/ops-truth-patch-v1.js
          node --check docs/ops/ops-owner-refinement-v1.js
          node --check docs/ops/ops-fun-v2.js
          node --check docs/sw.js

      - name: Truth-first HQ architecture invariants
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit

          root=Path('.')
          idx=(root/'docs/index.html').read_text()
          over=(root/'docs/hq-overrides-v1.js').read_text()
          truth=(root/'docs/hq-truth-v2.js').read_text()
          owner=(root/'docs/hq-owner-refinement-v3.js').read_text()
          growth=(root/'docs/hq-growth-v1.js').read_text()
          sw=(root/'docs/sw.js').read_text()
          contract=(root/'docs/HQ-TRUTH-CONTRACT.md').read_text()

          class Assets(HTMLParser):
              def __init__(self,text):
                  super().__init__(); self.sources=[]; self.feed(text)
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs); value=a.get('src') or a.get('href')
                  if value and tag in ('script','iframe','link'):
                      u=urlsplit(value)
                      assert not u.scheme and not u.netloc, value
                      self.sources.append((tag,a,u))

          shell=Assets(idx).sources
          frames=[x for x in shell if x[0]=='iframe' and x[1].get('id')=='kevinCore']
          assert len(frames)==1
          assert frames[0][2].path=='./hq-core-v7.html'
          assert frames[0][2].fragment=='overview'

          scripts=[x[2].path for x in shell if x[0]=='script' and x[2].path]
          expected=['./hq-overrides-v1.js','./hq-truth-v2.js','./hq-owner-refinement-v3.js','./hq-growth-v1.js']
          assert scripts==expected, scripts
          assert './hq-owner-refinement-v2.js' not in scripts
          assert './hq-fun-v2.js' not in scripts

          assert 'Talk to Kevin' in idx and 'Handover' in idx
          assert '@media(max-width:520px)' in idx
          assert 'max-width:calc(100vw - 16px)' in idx

          # Integration layer may own Newswire/hash synchronization, but not a second handover UI.
          assert 'newswireStories' in over
          assert 'AI-HANDOVER.md' not in over
          assert 'hqHandoverCard' not in over

          # Truth layer owns source freshness and contradiction handling.
          for token in ['reports/dashboard-state.json','reports/support-latest.json','reports/engineering/latest.json','reports/autonomy-continuation-latest.json','inbox/autonomy/work-items.json']:
              assert token in truth, token
          assert "cache:'no-store'" in truth
          assert 'No active worker' in truth
          assert 'Schedules and last_mission are not counted as work.' in truth

          # Owner layer presents only five purposeful primary views.
          for token in ["['overview','Command']","['ops','Ops Floor']","['activity','Work Log']","['capabilities','Skills']","['system','System']"]:
              assert token in owner, token
          for hidden in ["'talk'","'build'","'diagnostics'"]:
              assert hidden in owner
          assert 'BLOCKED WORK' in owner and 'TRUE IDLE' in owner
          assert 'inbox/CURRENT_TASK.md' in owner
          assert 'Show deep truth & diagnostics' in owner

          # Continuous growth must distinguish source readiness from live proof.
          assert 'SOURCE READY · LIVE CROSSING PENDING' in growth
          assert 'LIVE EVIDENCE SEEN' in growth
          assert 'lease' in growth and 'machine_evidence' in growth

          # Service worker must know the active owner layer; old files may remain historical only.
          assert 'hq-owner-refinement-v3.js' in sw

          # Contract itself must forbid stale/fake truth.
          for token in ['WORKING','ELIGIBLE WORK','BLOCKED WORK','TRUE IDLE','UNVERIFIED / STALE','AI-HANDOVER.md']:
              assert token in contract, token

          print('HQ_TRUTH_FIRST_ARCHITECTURE_PASS overlays=4 primary_views=5 duplicate_handover=false decorative_polling=false')

      - name: Behavioral stale-evidence protection
        run: |
          node .github/scripts/test-hq-owner-invariants.cjs
          node .github/scripts/test-hq-live-data.cjs
