name: Typed GREEN Work Order v1.1 Gate
on:
  push:
    branches: [kevin-work-order-contract-v1.1]
    paths:
      - control-plane/intake/work_order_policy_v1_1.py
      - control-plane/intake/test_work_order_policy_v1_1.py
      - .github/workflows/work-order-contract-v11.yml
  pull_request:
    paths:
      - control-plane/intake/work_order_policy_v1_1.py
      - control-plane/intake/test_work_order_policy_v1_1.py
permissions:
  contents: read
jobs:
  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile control-plane/intake/work_order_policy_v1_1.py control-plane/intake/test_work_order_policy_v1_1.py
      - run: python control-plane/intake/test_work_order_policy_v1_1.py
      - name: Static authority boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('control-plane/intake/work_order_policy_v1_1.py').read_text()
          forbidden=['subprocess','os.system','shell=True','requests.','urllib.request','powershell.exe','gh api']
          bad=[x for x in forbidden if x in s]
          assert not bad,bad
          for token in ['PRECONDITION_MISMATCH','REPLAY','COOLDOWN','BLOCKED_GOVERNANCE','CATALOG_AUTHORITY_VIOLATION']:
              assert token in s,token
          print('PASS: pure admission policy / no executor surface')
          PY
