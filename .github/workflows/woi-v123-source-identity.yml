name: Work Order Intake v1.2.3 Source Identity Gate

on:
  push:
    branches:
      - kevin-woi-v123-identity-proof
    paths:
      - '.github/workflows/woi-v123-source-identity.yml'
      - 'control-plane/intake/kevin-work-order-intake-v1.2.3.ps1'

permissions:
  contents: read

jobs:
  source-identity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 parser and fixed self-test
        shell: powershell
        run: |
          $p = 'control-plane/intake/kevin-work-order-intake-v1.2.3.ps1'
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){ throw $errors[0].Message }
          $out = (& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p -Mode SelfTest 2>&1 | Out-String)
          if($LASTEXITCODE -ne 0){ throw "self-test failed exit=$LASTEXITCODE" }
          if($out -notmatch 'KEVIN WORK ORDER INTAKE v1.2 SELFTEST PASS'){ throw 'self-test marker missing' }
          Write-Host $out
      - name: Publish exact qualified source SHA256
        shell: powershell
        run: |
          $p = 'control-plane/intake/kevin-work-order-intake-v1.2.3.ps1'
          $sha = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "WOI_V123_SOURCE_SHA256=$sha"
          if($sha -notmatch '^[A-F0-9]{64}$'){ throw 'invalid SHA256' }
