name: Kevin platform bootstrap
on:
  push:
    paths:
      - tools/Repair-Kevin-Platform-20260903.ps1
      - .github/workflows/kevin-platform-bootstrap.yml
  pull_request:
    paths:
      - tools/Repair-Kevin-Platform-20260903.ps1
      - .github/workflows/kevin-platform-bootstrap.yml
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and self-test corrected installed-contract R04 bootstrap
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          $p = Join-Path $PWD 'tools/Repair-Kevin-Platform-20260903.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          & $p -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Corrected R04 bootstrap self-test failed' }
