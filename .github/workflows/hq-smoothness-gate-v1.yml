name: Kevin HQ Smoothness Gate v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/hq-evidence-adapter-v1.js'
      - 'docs/hq-overrides-v1.js'
      - 'docs/hq-truth-v2.js'
      - 'docs/hq-owner-refinement-v3.js'
      - 'docs/hq-growth-v1.js'
      - 'docs/hq-ground-truth-v8.js'
      - '.github/workflows/hq-smoothness-gate-v1.yml'
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/hq-evidence-adapter-v1.js'
      - 'docs/hq-overrides-v1.js'
      - 'docs/hq-truth-v2.js'
      - 'docs/hq-owner-refinement-v3.js'
      - 'docs/hq-growth-v1.js'
      - 'docs/hq-ground-truth-v8.js'
      - '.github/workflows/hq-smoothness-gate-v1.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/hq-evidence-adapter-v1.js
          node --check docs/hq-overrides-v1.js
          node --check docs/hq-truth-v2.js
          node --check docs/hq-owner-refinement-v3.js
          node --check docs/hq-growth-v1.js
          node --check docs/hq-ground-truth-v8.js
      - name: Prove v8 smoothness and single-writer invariants
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('docs/index.html').read_text(encoding='utf-8')
          owner = Path('docs/hq-owner-refinement-v3.js').read_text(encoding='utf-8')
          truth = Path('docs/hq-truth-v2.js').read_text(encoding='utf-8')
          overrides = Path('docs/hq-overrides-v1.js').read_text(encoding='utf-8')

          current = [
              'hq-evidence-adapter-v1.js',
              'hq-overrides-v1.js',
              'hq-truth-v2.js',
              'hq-owner-refinement-v3.js',
              'hq-growth-v1.js',
              'hq-ground-truth-v8.js',
          ]
          positions = [index.index(name) for name in current]
          assert positions == sorted(positions), positions
          for name in current:
              assert name in index, name
          for stale in ['hq-owner-refinement-v1.js','hq-owner-refinement-v2.js','hq-truth-v1.js','hq-truth-patch-v2.js','hq-fun-v2.js']:
              assert stale not in index, stale

          # Owner refinement observes the core instead of forcing its load/render loop.
          assert 'core.load(' not in owner
          assert 'setInterval(hook' not in owner
          assert 'MutationObserver' in owner
          assert 'requestAnimationFrame' in owner

          # Truth remains observability-only and preserves disclosure state.
          assert "main.insertAdjacentElement('afterend',host)" in truth
          assert 'detailsState(host)' in truth
          assert 'restoreDetails(host,open)' in truth
          assert 'data-key="lanes"' in truth
          assert 'data-key="sources"' in truth
          assert 'patchLegacy' not in truth
          assert 'renderOps' not in truth

          # Authoritative truth must not run a rapid DOM rebuild loop.
          truth_intervals = [int(x) for x in re.findall(r'setInterval\([^,]+,\s*(\d+)\s*\)', truth)]
          assert truth_intervals and min(truth_intervals) >= 30000, truth_intervals
          assert 'setInterval(hook,1200)' not in truth

          # The integration layer has exactly two intentional timers: 7s story rotation and 15s news refresh.
          assert overrides.count('setInterval(') == 2, overrides.count('setInterval(')
          assert "nwTimer=setInterval(()=>{nwIndex=(nwIndex+1)%nwItems.length;paint()},7000)" in overrides
          assert 'nwRefreshTimer=setInterval(refreshNewswire,15000)' in overrides

          print('HQ_SMOOTHNESS_PASS architecture=v8 forced_core_reload=false truth_bottom=true disclosure_state_preserved=true newswire_timers=7000,15000 stale_layers_absent=true')
