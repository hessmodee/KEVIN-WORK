name: Kevin HQ Smoothness Gate v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/hq-owner-refinement-v2.js'
      - 'docs/hq-truth-v2.js'
      - 'docs/hq-overrides-v1.js'
      - 'docs/hq-fun-v2.js'
      - '.github/workflows/hq-smoothness-gate-v1.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/hq-owner-refinement-v2.js
          node --check docs/hq-truth-v2.js
          node --check docs/hq-overrides-v1.js
          node --check docs/hq-fun-v2.js
      - name: Prove single-writer smoothness invariants
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('docs/index.html').read_text(encoding='utf-8')
          owner = Path('docs/hq-owner-refinement-v2.js').read_text(encoding='utf-8')
          truth = Path('docs/hq-truth-v2.js').read_text(encoding='utf-8')
          overrides = Path('docs/hq-overrides-v1.js').read_text(encoding='utf-8')
          fun = Path('docs/hq-fun-v2.js').read_text(encoding='utf-8')

          # Only the streamlined writers are loaded.
          assert 'hq-owner-refinement-v2.js' in index
          assert 'hq-truth-v2.js' in index
          assert 'hq-owner-refinement-v1.js' not in index
          assert 'hq-truth-v1.js' not in index
          assert 'hq-truth-patch-v2.js' not in index

          # Refinement is forbidden from forcing the core data/render loop.
          assert 'core.load(' not in owner
          assert 'setInterval(hook' not in owner
          assert 'MutationObserver' in owner
          assert 'requestAnimationFrame' in owner

          # Truth must live after tab content and preserve disclosure state.
          assert "main.insertAdjacentElement('afterend',host)" in truth
          assert 'detailsState(host)' in truth
          assert 'restoreDetails(host,open)' in truth
          assert 'data-key="lanes"' in truth
          assert 'data-key="sources"' in truth

          # No rapid DOM-rebuild timer. Data refresh is intentionally >= 30s.
          ints = [int(x) for x in re.findall(r'setInterval\([^,]+,\s*(\d+)\s*\)', truth)]
          assert ints and min(ints) >= 30000, ints
          assert 'setInterval(hook,1200)' not in truth

          # Nonessential decoration/override polling is no longer sub-second / 1.5s churn.
          assert '},15000)' in overrides
          assert '},2500)' in fun

          # Truth is observability only: it does not patch main tab HTML.
          assert 'patchLegacy' not in truth
          assert 'renderOps' not in truth

          print('HQ_SMOOTHNESS_PASS forced_core_reload=false truth_bottom=true disclosure_state_preserved=true redundant_patch_removed=true')
