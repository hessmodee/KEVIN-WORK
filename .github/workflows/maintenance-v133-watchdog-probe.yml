name: Maintenance v1.3.33 Watchdog Probe Bridge

on:
  push:
    paths:
      - '.github/workflows/maintenance-v133-watchdog-probe.yml'
      - '.github/scripts/build-maintenance-v133-watchdog-probe.py'
      - 'control-plane/maintenance/kevin-maintenance-runner-v1.3.32.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove:
    runs-on: windows-latest
    steps:
      - name: Preserve LF bytes
        shell: powershell
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate
        shell: powershell
        run: |
          python .github/scripts/build-maintenance-v133-watchdog-probe.py
          if($LASTEXITCODE-ne0){throw 'builder failed'}
      - name: Parse and self-test
        shell: powershell
        run: |
          $p='control-plane/maintenance/kevin-maintenance-runner-v1.3.33.ps1'
          $txt=[IO.File]::ReadAllText($p)
          $tokens=$null;$errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|%{$_.Message};throw 'parser rejected v1.3.33'}
          if(-not $txt.Contains("'-SelfTest'")){throw 'watchdog SelfTest fixed argv missing'}
          if(-not $txt.Contains("'-ProbeOnly'")){throw 'ProbeOnly fixed argv missing'}
          if($txt-notmatch'OMEN_CLASSIFIER_PROOF'){throw 'classifier proof state missing'}
          if($txt-notmatch'probe_mode=''NO_SIDE_EFFECTS'''){throw 'no-side-effects proof tag missing'}
          if(-not $txt.Contains('installed watchdog does not prove ProbeOnly v1.6.0 contract')){throw 'watchdog v1.6 contract guard missing'}
          $commands=@($ast.FindAll({param($n) $n -is [System.Management.Automation.Language.CommandAst]},$true))
          if(@($commands|?{($_.GetCommandName()) -in @('Invoke-Expression','iex')}).Count){throw 'actual Invoke-Expression detected'}
          $out=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p -SelfTest 2>&1|Out-String
          if($LASTEXITCODE-ne0){Write-Host $out;throw 'self-test failed'}
          if($out-notmatch'KEVIN MAINTENANCE v1\.3\.33 SELFTEST PASS'){Write-Host $out;throw 'v1.3.33 marker missing'}
          Write-Host $out
      - name: Emit proof
        shell: powershell
        run: |
          $p='control-plane/maintenance/kevin-maintenance-runner-v1.3.33.ps1'
          $sha=(Get-FileHash $p -Algorithm SHA256).Hash.ToUpperInvariant()
          $obj=[ordered]@{schema=1;kind='kevin-maintenance-v133-ci-proof';generated_at=(Get-Date).ToString('o');state='WINDOWS_CI_PROVEN';candidate_sha256=$sha;parent_version='1.3.32';windows_parser=$true;self_test=$true;watchdog_contract='v1.6.0';probe_only_fixed_argv=$true;probe_no_intake=$true;probe_no_restart=$true;classifier_proof=$true;native_npm_cli=$true;partial_install_rollback=$true;keeper_topology_preserved=$true;gateway_rpc_postcondition=$true;main_skills_postcondition=$true;benchmark_postcondition='30/30 critical=0';arbitrary_shell=$false;authority_expansion=$false}
          New-Item -ItemType Directory -Force reports/ci|Out-Null
          [IO.File]::WriteAllText('reports/ci/maintenance-v133-watchdog-probe.json',($obj|ConvertTo-Json -Depth 10),(New-Object Text.UTF8Encoding($false)))
          Write-Host "CANDIDATE_SHA256=$sha"
      - name: Publish proven fixed files through Contents API
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          function Publish-FixedFile([string]$Path,[string]$Message) {
            if(-not(Test-Path -LiteralPath $Path -PathType Leaf)){throw "missing proven file $Path"}
            $endpoint="repos/${env:GITHUB_REPOSITORY}/contents/$Path"
            $old=$ErrorActionPreference
            try {
              $ErrorActionPreference='Continue'
              $existing=(& gh api $endpoint --jq '.sha' 2>$null | Out-String).Trim()
              $lookupExit=[int]$LASTEXITCODE
            } finally {$ErrorActionPreference=$old}
            $body=[ordered]@{message=$Message;content=[Convert]::ToBase64String([IO.File]::ReadAllBytes($Path))}
            if($lookupExit-eq0 -and $existing){$body.sha=$existing}
            elseif($lookupExit-ne0){Write-Host "Creating new fixed path $Path"}
            $tmp=Join-Path $env:RUNNER_TEMP ('kevin-publish-'+[guid]::NewGuid().ToString('N')+'.json')
            try {
              [IO.File]::WriteAllText($tmp,($body|ConvertTo-Json -Compress),(New-Object Text.UTF8Encoding($false)))
              & gh api --method PUT $endpoint --input $tmp --silent
              if($LASTEXITCODE-ne0){throw "Contents API publish failed $Path"}
            } finally {Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue}
          }
          Publish-FixedFile 'control-plane/maintenance/kevin-maintenance-runner-v1.3.33.ps1' 'Publish CI-proven Maintenance v1.3.33'
          Publish-FixedFile 'reports/ci/maintenance-v133-watchdog-probe.json' 'Publish Maintenance v1.3.33 Windows CI proof'
