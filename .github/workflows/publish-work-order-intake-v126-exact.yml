name: Publish Work Order Intake v1.2.6 Exact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/generate-work-order-intake-v126.py'
      - 'tools/generate-work-order-intake-v125.py'
      - '.github/workflows/publish-work-order-intake-v126-exact.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate exact candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python .\tools\generate-work-order-intake-v126.py
          if($LASTEXITCODE-ne0){throw 'generator failed'}
          $p='.\control-plane\intake\generated\kevin-work-order-intake-v1.2.6.ps1';$expected='2A87AC06A1DA1A2B6A2B10594DFE80FAE41B1385A969108BFFE5FC5F39DC45D1';$actual=(Get-FileHash $p -Algorithm SHA256).Hash.ToUpperInvariant()
          if($actual-ne$expected){throw "identity drift expected=$expected actual=$actual"}
          $tokens=$null;$errors=$null;[void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors);if($errors.Count-gt0){throw 'parse failed'}
          $out=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p -Mode SelfTest 2>&1|Out-String
          if($LASTEXITCODE-ne0-or$out-notmatch'KEVIN WORK ORDER INTAKE v1\.2\.6 SELFTEST PASS'){throw 'selftest failed'}
          Write-Host "EXACT_QUALIFIED_INTAKE_V126 sha256=$actual"
      - name: Publish exact bytes with bounded Git-object CAS
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$repo=$env:GITHUB_REPOSITORY;$path='control-plane/intake/kevin-work-order-intake-v1.2.6.ps1';$src='.\control-plane\intake\generated\kevin-work-order-intake-v1.2.6.ps1';$expected='2A87AC06A1DA1A2B6A2B10594DFE80FAE41B1385A969108BFFE5FC5F39DC45D1'
          function H([string]$s){$b=(& gh api "repos/$repo/git/blobs/$s"|ConvertFrom-Json);$bytes=[Convert]::FromBase64String(([string]$b.content-replace'\s',''));$x=[Security.Cryptography.SHA256]::Create();try{return([BitConverter]::ToString($x.ComputeHash($bytes))).Replace('-','').ToUpperInvariant()}finally{$x.Dispose()}}
          $old=$ErrorActionPreference;try{$ErrorActionPreference='Continue';$e=(& gh api "repos/$repo/contents/$path?ref=main" 2>$null|Out-String).Trim();$ec=[int]$LASTEXITCODE}finally{$ErrorActionPreference=$old}
          if($ec-eq0-and$e){$o=$e|ConvertFrom-Json;$h=H([string]$o.sha);if($h-ne$expected){throw "existing mismatch $h"};Write-Host "INTAKE_V126_ALREADY_PUBLISHED_EXACT sha256=$h";exit 0}
          $bp=[ordered]@{content=[Convert]::ToBase64String([IO.File]::ReadAllBytes($src));encoding='base64'}|ConvertTo-Json -Compress;$bf=Join-Path $env:RUNNER_TEMP 'b.json';[IO.File]::WriteAllText($bf,$bp,(New-Object Text.UTF8Encoding($false)));$blob=(& gh api --method POST "repos/$repo/git/blobs" --input $bf --jq .sha).Trim();if((H $blob)-ne$expected){throw 'blob mismatch'}
          for($a=1;$a-le3;$a++){$head=(& gh api "repos/$repo/git/ref/heads/main" --jq .object.sha).Trim();$tree=(& gh api "repos/$repo/git/commits/$head" --jq .tree.sha).Trim();$tp=[ordered]@{base_tree=$tree;tree=@([ordered]@{path=$path;mode='100644';type='blob';sha=$blob})}|ConvertTo-Json -Depth 5 -Compress;$tf=Join-Path $env:RUNNER_TEMP "t$a.json";[IO.File]::WriteAllText($tf,$tp,(New-Object Text.UTF8Encoding($false)));$nt=(& gh api --method POST "repos/$repo/git/trees" --input $tf --jq .sha).Trim();$cp=[ordered]@{message='Publish exact CI-qualified Work Order Intake v1.2.6';tree=$nt;parents=@($head)}|ConvertTo-Json -Depth 4 -Compress;$cf=Join-Path $env:RUNNER_TEMP "c$a.json";[IO.File]::WriteAllText($cf,$cp,(New-Object Text.UTF8Encoding($false)));$nc=(& gh api --method POST "repos/$repo/git/commits" --input $cf --jq .sha).Trim();$rp=[ordered]@{sha=$nc;force=$false}|ConvertTo-Json -Compress;$rf=Join-Path $env:RUNNER_TEMP "r$a.json";[IO.File]::WriteAllText($rf,$rp,(New-Object Text.UTF8Encoding($false)));$old=$ErrorActionPreference;try{$ErrorActionPreference='Continue';& gh api --method PATCH "repos/$repo/git/refs/heads/main" --input $rf --silent 2>$null;$rc=[int]$LASTEXITCODE}finally{$ErrorActionPreference=$old};if($rc-eq0){if((H $blob)-ne$expected){throw 'post-publish mismatch'};Write-Host "INTAKE_V126_PUBLISHED_EXACT sha256=$expected attempt=$a";exit 0};Start-Sleep 1};throw 'bounded v1.2.6 publication CAS exhausted'
