name: Finalize Kevin Autonomy v0.1h

on:
  push:
    branches:
      - kevin-autonomy-actuator-v0.1
    paths:
      - '.github/workflows/autonomy-v01h-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kevin-autonomy-actuator-v0.1

      - name: Finalize resume and parse
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'control-plane/actuator/finalize-v01h-resume.ps1'
          if($LASTEXITCODE -ne 0){throw 'v0.1h finalizer failed'}
          $p='control-plane/actuator/KEVIN-AUTONOMY-RESUME-v0.1h.ps1'
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
          if($errors -and $errors.Count){throw 'Final v0.1h parser check failed'}
          $t=Get-Content -LiteralPath $p -Raw
          if($t -match 'openclaw automations'){throw 'Old rollback namespace remains'}
          if($t -match 'Typed job verification: automations'){throw 'Old proof label remains'}
          if($t -notmatch [regex]::Escape("version='0.1h'")){throw 'Install manifest version not v0.1h'}
          if($t -notmatch [regex]::Escape("openclaw cron remove '`$rId' --json")){throw 'Cron rollback reconciler removal missing'}
          if($t -notmatch [regex]::Escape("openclaw cron remove '`$bId' --json")){throw 'Cron rollback telemetry removal missing'}
          Write-Host 'PASS final v0.1h resume regression checks.'

      - name: Commit final resume
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='control-plane/actuator/KEVIN-AUTONOMY-RESUME-v0.1h.ps1'
          git config user.name 'Kevin Control Plane CI'
          git config user.email 'kevin-control-plane-ci@users.noreply.github.com'
          git add -- $p
          if(git status --porcelain -- $p){
            git commit -m 'Finalize autonomy v0.1h rollback and proof labels'
            git pull --rebase origin kevin-autonomy-actuator-v0.1
            git push origin HEAD:kevin-autonomy-actuator-v0.1
          } else { Write-Host 'No final resume changes to commit.' }
