name: Maintenance v1.3.31 Gateway Recovery Builder

on:
  push:
    paths:
      - '.github/workflows/maintenance-v131-gateway-recovery-build.yml'
      - '.github/scripts/build-maintenance-v131-gateway-recovery.py'
      - 'control-plane/maintenance/kevin-maintenance-runner-v1.3.30.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-prove:
    runs-on: windows-latest
    steps:
      - name: Preserve LF bytes
        shell: powershell
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build deterministic v1.3.31 candidate
        shell: powershell
        run: |
          python .github/scripts/build-maintenance-v131-gateway-recovery.py
          if($LASTEXITCODE-ne0){throw 'candidate builder failed'}

      - name: Windows PowerShell parser and self-test
        shell: powershell
        run: |
          $p='control-plane/maintenance/kevin-maintenance-runner-v1.3.31.ps1'
          $txt=[IO.File]::ReadAllText($p)
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|ForEach-Object{Write-Host $_.Message};throw 'PowerShell parser rejected v1.3.31'}
          foreach($bad in @('Invoke-Expression','ScriptBlock]::Create','-EncodedCommand','DownloadString','WScript.Shell')){if($txt -match [regex]::Escape($bad)){throw "forbidden execution primitive: $bad"}}
          $out=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p -SelfTest 2>&1|Out-String
          if($LASTEXITCODE-ne0){Write-Host $out;throw 'v1.3.31 self-test exit failure'}
          if($out-notmatch'KEVIN MAINTENANCE v1\.3\.31 SELFTEST PASS'){Write-Host $out;throw 'v1.3.31 self-test marker missing'}
          if($txt-notmatch"GatewayLkgVersion = '2026\.6\.34'"){throw 'LKG version pin missing'}
          if($txt-notmatch'SAFE_BACKUP_NOT_PROVEN_FOR_DOWNGRADE'){throw 'safe config downgrade guard missing'}
          if($txt-notmatch'GatewayKeeperTaskName'){throw 'Gateway Keeper topology guard missing'}
          Write-Host $out

      - name: Emit candidate proof
        shell: powershell
        run: |
          $p='control-plane/maintenance/kevin-maintenance-runner-v1.3.31.ps1'
          $sha=(Get-FileHash $p -Algorithm SHA256).Hash.ToUpperInvariant()
          $obj=[ordered]@{schema=1;kind='kevin-maintenance-v131-ci-proof';generated_at=(Get-Date).ToString('o');state='WINDOWS_CI_PROVEN';candidate_sha256=$sha;source='v1.3.30 deterministic patch';windows_parser=$true;self_test=$true;lkg_version='2026.6.34';lkg_integrity_pinned=$true;rejected_version='2026.7.1-2';rejected_integrity_pinned=$true;gateway_keeper_preserved=$true;safe_backup_required=$true;rollback=$true;gateway_rpc_postcondition=$true;main_skills_postcondition=$true;benchmark_postcondition='30/30 critical=0';caller_selected_version=$false;arbitrary_shell=$false;authority_expansion=$false}
          New-Item -ItemType Directory -Force reports/ci|Out-Null
          [IO.File]::WriteAllText('reports/ci/maintenance-v131-gateway-recovery.json',($obj|ConvertTo-Json -Depth 10),(New-Object Text.UTF8Encoding($false)))
          Write-Host "CANDIDATE_SHA256=$sha"

      - name: Commit proven candidate and proof
        shell: powershell
        run: |
          git config user.name 'kevin-ci'
          git config user.email 'kevin-ci@users.noreply.github.com'
          git add control-plane/maintenance/kevin-maintenance-runner-v1.3.31.ps1 reports/ci/maintenance-v131-gateway-recovery.json
          if(git diff --cached --quiet){Write-Host 'Candidate already committed';exit 0}
          git commit -m 'Add CI-proven typed Gateway recovery maintenance v1.3.31'
          git pull --rebase origin main
          git push origin HEAD:main
