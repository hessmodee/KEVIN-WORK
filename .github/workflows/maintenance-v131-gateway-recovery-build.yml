name: Maintenance v1.3.31 Gateway Recovery Builder

on:
  push:
    paths:
      - '.github/workflows/maintenance-v131-gateway-recovery-build.yml'
      - 'control-plane/maintenance/kevin-maintenance-runner-v1.3.30.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-prove:
    runs-on: windows-latest
    steps:
      - name: Preserve LF bytes
        shell: powershell
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deterministically build v1.3.31
        shell: python
        run: |
          from pathlib import Path
          src=Path('control-plane/maintenance/kevin-maintenance-runner-v1.3.30.ps1')
          dst=Path('control-plane/maintenance/kevin-maintenance-runner-v1.3.31.ps1')
          s=src.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, got {n}')
              s=s.replace(old,new,1)

          once("$SelectorV11Source = 'control-plane/autonomy/kevin-work-selector-v1.1.py'",
               "$SelectorV11Source = 'control-plane/autonomy/kevin-work-selector-v1.1.py'\n$GatewayLkgVersion = '2026.6.34'\n$GatewayRejectedVersion = '2026.7.1-2'\n$GatewayLkgIntegrity = 'sha512-Rm4khBrWn9HYqE99NBryCFgjwlsIuwBqK5jIANn2773CGXJ1JIZkDn5twEHB+8SVFdh0FPNPHRVgZepzNJDfHg=='\n$GatewayRejectedIntegrity = 'sha512-ycF3yPcbjN6bUPeaUx6Mh6vze1hQWoD3CT/wWcmD7a8xaHHHRUaAlaq+lFxMHf1ssEgODVAwjlzYqp2twkYZ7g=='",
               'constants')
          once("version='1.3.30'","version='1.3.31'",'state-version')
          once("'install_autonomy_controller_v183','diagnose_gateway_rpc')",
               "'install_autonomy_controller_v183','diagnose_gateway_rpc','run_self_reliance_watchdog_once','diagnose_gateway_failure_detail','repair_openclaw_windows_lkg')",
               'common-allowlist')

          insert=r'''
function Assert-NoCallerArgs([object]$m,[string]$Operation) {
    $allowed=@('schema','kind','id','authority_class','authority_delta','production_effect','owner_policy','preauthorized','operation','expires_at')
    foreach($p in $m.PSObject.Properties.Name){if($allowed -notcontains [string]$p){throw ($Operation+' manifest must not supply '+[string]$p)}}
    if([string]$m.operation -ne $Operation){throw ($Operation+' operation mismatch')}
}
function Get-SemanticConfigSha([string]$Path) {
    if(-not(Test-Path -LiteralPath $Path -PathType Leaf)){return ''}
    try{$o=Get-Content -LiteralPath $Path -Raw|ConvertFrom-Json}catch{return ''}
    if($o.meta){
        if($o.meta.PSObject.Properties['lastTouchedVersion']){$o.meta.PSObject.Properties.Remove('lastTouchedVersion')}
        if($o.meta.PSObject.Properties['lastTouchedAt']){$o.meta.PSObject.Properties.Remove('lastTouchedAt')}
    }
    return Get-TextSha256 ($o|ConvertTo-Json -Depth 60 -Compress)
}
function Get-DirectGatewayConfigFacts {
    $p=Join-Path $env:USERPROFILE '.openclaw\openclaw.json'
    $bak=$p+'.bak'
    $r=[ordered]@{current_exists=$false;current_sha256='';current_semantic_sha256='';current_last_touched='UNKNOWN';backup_exists=$false;backup_sha256='';backup_semantic_sha256='';backup_last_touched='UNKNOWN';backup_semantically_equivalent=$false;telegram_present=$false;discord_present=$false;codex_present=$false;memory_core_present=$false}
    foreach($pair in @(@('current',$p),@('backup',$bak))){
        $tag=$pair[0];$path=$pair[1]
        if(-not(Test-Path -LiteralPath $path -PathType Leaf)){continue}
        $r[$tag+'_exists']=$true;$r[$tag+'_sha256']=Get-Sha $path;$r[$tag+'_semantic_sha256']=Get-SemanticConfigSha $path
        try{$o=Get-Content -LiteralPath $path -Raw|ConvertFrom-Json}catch{continue}
        if($o.meta -and [string]$o.meta.lastTouchedVersion -match '^20\d{2}\.\d+\.\d+(?:-\d+)?$'){$r[$tag+'_last_touched']=[string]$o.meta.lastTouchedVersion}
        if($tag-eq'current'){
            if($o.channels){$r.telegram_present=($null-ne$o.channels.PSObject.Properties['telegram']);$r.discord_present=($null-ne$o.channels.PSObject.Properties['discord'])}
            if($o.plugins -and $o.plugins.entries){
                $r.telegram_present=$r.telegram_present-or($null-ne$o.plugins.entries.PSObject.Properties['telegram'])
                $r.discord_present=$r.discord_present-or($null-ne$o.plugins.entries.PSObject.Properties['discord'])
                $r.codex_present=($null-ne$o.plugins.entries.PSObject.Properties['codex'])
                $r.memory_core_present=($null-ne$o.plugins.entries.PSObject.Properties['memory-core'])
            }
        }
    }
    $r.backup_semantically_equivalent=([string]$r.current_semantic_sha256 -and [string]$r.current_semantic_sha256 -eq [string]$r.backup_semantic_sha256)
    return [pscustomobject]$r
}
function Get-GatewayFailureFamilyDetailed([string]$Text) {
    $t=[string]$Text
    if($t-match'(?i)startup migrations did not complete cleanly|startup-migration warnings'){return 'STARTUP_MIGRATION_GATE'}
    if($t-match'(?i)conflicting plugin install metadata'){return 'PLUGIN_INSTALL_METADATA_CONFLICT'}
    if($t-match'(?i)embedding_cache|memory embedding'){return 'MEMORY_EMBEDDING_CONFLICT'}
    if($t-match'(?i)binding sidecar'){return 'CODEX_BINDING_SIDECAR'}
    if($t-match'(?i)active startup-migration lock|migration.{0,30}lock'){return 'MIGRATION_LOCK'}
    if($t-match'(?i)lastTouchedVersion|last written by a newer OpenClaw|newer config'){return 'CONFIG_VERSION_SKEW'}
    if($t-match'(?i)discord.{0,60}(ready|handshake|startup|timeout)'){return 'DISCORD_STARTUP_BLOCK'}
    if($t-match'(?i)ERR_MODULE_NOT_FOUND|Cannot find module|Cannot find package'){return 'MODULE_LOAD_FAILURE'}
    if($t-match'(?i)TypeError|ReferenceError|SyntaxError|uncaught exception'){return 'RUNTIME_EXCEPTION'}
    if($t-match'(?i)invalid config|validation failed|unknown config|unrecognized config'){return 'CONFIG_INVALID'}
    if($t-match'(?i)ECONNREFUSED|connection refused|not running|stopped'){return 'GATEWAY_STOPPED_OR_RPC'}
    if($t-match'(?i)timeout|timed out'){return 'TIMEOUT'}
    if([string]::IsNullOrWhiteSpace($t)){return 'EMPTY_FAILURE'}
    return 'OTHER_FAILURE'
}
function Publish-SafeFixedReport([string]$RepoPath,[string]$LocalName,[object]$Public,[string]$Message) {
    $local=Join-Path $Reports $LocalName;Write-JsonAtomic $local $Public
    $lookup=Invoke-Gh @('api',('repos/'+$Repo+'/contents/'+$RepoPath),'--jq','.sha')
    $body=[ordered]@{message=$Message;content=[Convert]::ToBase64String([IO.File]::ReadAllBytes($local))}
    if($lookup.ExitCode-eq0-and$lookup.Output){$body.sha=[string]$lookup.Output}
    elseif($lookup.ExitCode-ne0-and$lookup.Output-notmatch'404|Not Found'){throw 'safe report lookup failed'}
    $tmp=Join-Path $env:TEMP ('kevin-safe-report-'+[guid]::NewGuid().ToString('N')+'.json')
    try{[IO.File]::WriteAllText($tmp,($body|ConvertTo-Json -Compress),$Utf8);$put=Invoke-Gh @('api','--method','PUT',('repos/'+$Repo+'/contents/'+$RepoPath),'--input',$tmp,'--silent')}finally{Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue}
    if($put.ExitCode-ne0){throw 'safe report publish failed'}
    return Get-Sha $local
}
function Run-SelfRelianceWatchdogOnce {
    $p=Join-Path $Workspace 'kevin-self-reliance-watchdog.ps1'
    if(-not(Test-Path -LiteralPath $p -PathType Leaf)){throw 'self-reliance watchdog missing'}
    $r=Invoke-FixedNativeBounded 'powershell.exe' @('-NoProfile','-NonInteractive','-WindowStyle','Hidden','-ExecutionPolicy','Bypass','-File',$p) 240
    if($r.exit_code-ne0){throw 'self-reliance watchdog operational run failed'}
    $statePath=Join-Path $Reports 'self-reliance\watchdog-state.json'
    if(-not(Test-Path -LiteralPath $statePath -PathType Leaf)){throw 'watchdog state missing after operational run'}
    try{$w=Get-Content -LiteralPath $statePath -Raw|ConvertFrom-Json}catch{throw 'watchdog state invalid JSON'}
    $facts=Get-DirectGatewayConfigFacts
    $public=[ordered]@{schema=1;kind='kevin-self-reliance-watchdog-public';generated_at=(Get-Date).ToString('o');state='OMEN_OPERATIONAL_PROOF';safe_for_public_repo=$true;watchdog_sha256=Get-Sha $p;last_result=[string]$w.last_result;failure_family=[string]$w.failure_family;startup_class=[string]$w.startup_class;attempts=[int]$w.attempts;cooling=[bool]($(if($w.cooldown_until){try{[DateTimeOffset]::Parse([string]$w.cooldown_until)-gt[DateTimeOffset]::Now}catch{$false}}else{$false}));gateway_probe_exit=$w.gateway_probe_exit;config_validate_exit=$w.config_validate_exit;config_schema_exit=$w.config_schema_exit;gateway_task_running=[bool]$w.gateway_task_running;binary_version=[string]$w.binary_version;config_last_touched_version=[string]$w.config_last_touched_version;maintenance_result=[string]$w.maintenance_result;work_order_result=[string]$w.work_order_result;config_backup_exists=[bool]$facts.backup_exists;config_backup_semantically_equivalent=[bool]$facts.backup_semantically_equivalent;source_contract='One fixed local watchdog execution plus fixed metadata-only config comparison. No caller-selected command, argv, path, token, config value outside safe enums/version, or raw output.';truth_boundary='No raw CLI output, config bodies, credentials, host paths, messages, prompts, tool payloads, or secrets are published.'}
    $receipt=Publish-SafeFixedReport 'reports/self-reliance-watchdog-omen.json' 'self-reliance-watchdog-public.json' $public 'kevin self-reliance watchdog telemetry'
    Assert-Benchmark30
    return [ordered]@{state='OMEN_OPERATIONAL_PROOF';receipt_sha256=$receipt;last_result=$public.last_result;startup_class=$public.startup_class;failure_family=$public.failure_family;binary_version=$public.binary_version;config_last_touched_version=$public.config_last_touched_version;backup_semantically_equivalent=$public.config_backup_semantically_equivalent}
}
function Diagnose-GatewayFailureDetail {
    $runtime=Get-FixedOpenClawRuntime
    $probes=@(
        Invoke-OpenClawFixedConfig @('config','validate','--json'),
        Invoke-OpenClawFixedConfig @('gateway','status','--json'),
        Invoke-OpenClawFixedConfig @('plugins','doctor','--json'),
        Invoke-OpenClawFixedConfig @('doctor','--json')
    )
    $text=($probes|ForEach-Object{[string]$_.output})-join"`n"
    $family=Get-GatewayFailureFamilyDetailed $text
    $facts=Get-DirectGatewayConfigFacts
    $version='UNKNOWN';$pkg=Join-Path $env:APPDATA 'npm\node_modules\openclaw\package.json';if(Test-Path -LiteralPath $pkg -PathType Leaf){try{$po=Get-Content -LiteralPath $pkg -Raw|ConvertFrom-Json;$version=[string]$po.version}catch{}}
    $task=$null;$ti=$null;if($env:OS-eq'Windows_NT'){try{$task=Get-ScheduledTask -TaskName 'OpenClaw Gateway' -ErrorAction SilentlyContinue;if($task){$ti=Get-ScheduledTaskInfo -TaskName 'OpenClaw Gateway' -ErrorAction SilentlyContinue}}catch{}}
    $public=[ordered]@{schema=1;kind='kevin-gateway-failure-detail-public';generated_at=(Get-Date).ToString('o');state='OMEN_DIAGNOSIS_PROVEN';safe_for_public_repo=$true;openclaw_version=$version;release_policy_status=$(if($version-eq$GatewayRejectedVersion){'EVIDENCE_REJECTED'}elseif($version-eq$GatewayLkgVersion){'WINDOWS_VALIDATED_LKG'}else{'OTHER'});root_cause_family=$family;probe_exit_codes=@($probes|ForEach-Object{[int]$_.exit_code});probe_output_fingerprints=@($probes|ForEach-Object{Get-TextSha256 ([string]$_.output)});config=[ordered]@{current_sha256=$facts.current_sha256;current_last_touched=$facts.current_last_touched;backup_exists=[bool]$facts.backup_exists;backup_sha256=$facts.backup_sha256;backup_last_touched=$facts.backup_last_touched;backup_semantically_equivalent=[bool]$facts.backup_semantically_equivalent;telegram_present=[bool]$facts.telegram_present;discord_present=[bool]$facts.discord_present;codex_present=[bool]$facts.codex_present;memory_core_present=[bool]$facts.memory_core_present};windows=[ordered]@{gateway_task_present=[bool]$task;gateway_task_state=$(if($task){[string]$task.State}else{'ABSENT'});gateway_last_task_result=$(if($ti){[int]$ti.LastTaskResult}else{$null})};recommended_repair=$(if($version-eq$GatewayRejectedVersion){'TYPED_WINDOWS_LKG_RECOVERY'}else{'ROOT_CAUSE_SPECIFIC_REPAIR'});source_contract='Four fixed OpenClaw probes, fixed package metadata, fixed config/backup semantic comparison, fixed Gateway scheduled-task metadata. No caller-selected command/path/argv.';truth_boundary='Publishes only classifications, exit codes, hashes, safe version strings, booleans, and known plugin-presence flags. No raw output, config values, credentials, paths, messages, prompts, or secrets.'}
    $receipt=Publish-SafeFixedReport 'reports/gateway-failure-detail-omen.json' 'gateway-failure-detail-public.json' $public 'kevin gateway failure detail telemetry'
    Assert-Benchmark30
    return [ordered]@{state='OMEN_DIAGNOSIS_PROVEN';receipt_sha256=$receipt;root_cause_family=$family;openclaw_version=$version;release_policy_status=$public.release_policy_status;backup_semantically_equivalent=[bool]$facts.backup_semantically_equivalent}
}
function Invoke-NpmFixed([string[]]$Args,[int]$Timeout=600) {
    $npm=Get-Command npm.cmd -ErrorAction SilentlyContinue;if(-not$npm){$npm=Get-Command npm -ErrorAction SilentlyContinue};if(-not$npm){throw 'npm unavailable'}
    return Invoke-FixedNativeBounded ([string]$npm.Source) $Args $Timeout
}
function Get-InstalledOpenClawVersion {
    $pkg=Join-Path $env:APPDATA 'npm\node_modules\openclaw\package.json';if(-not(Test-Path -LiteralPath $pkg -PathType Leaf)){return 'ABSENT'}
    try{return [string](Get-Content -LiteralPath $pkg -Raw|ConvertFrom-Json).version}catch{return 'UNREADABLE'}
}
function Assert-NpmIntegrity([string]$Version,[string]$Expected) {
    $r=Invoke-NpmFixed @('view',('openclaw@'+$Version),'dist.integrity','--json') 90
    if($r.exit_code-ne0){throw ('npm registry integrity lookup failed for '+$Version)}
    $actual=([string]$r.output).Trim().Trim('"')
    if($actual-ne$Expected){throw ('npm integrity mismatch for '+$Version)}
}
function Install-ExactOpenClaw([string]$Version) {
    $r=Invoke-NpmFixed @('install','--global',('openclaw@'+$Version),'--no-audit','--no-fund','--ignore-scripts=false') 900
    if($r.exit_code-ne0){throw ('exact OpenClaw install failed version='+$Version)}
    if((Get-InstalledOpenClawVersion)-ne$Version){throw ('installed OpenClaw version mismatch expected='+$Version)}
}
function Wait-GatewayRpc([int]$Seconds=90) {
    $deadline=(Get-Date).AddSeconds($Seconds)
    while((Get-Date)-lt$deadline){$r=Invoke-OpenClawFixedConfig @('gateway','call','status','--json');if($r.exit_code-eq0){return $true};Start-Sleep -Seconds 3}
    return $false
}
function Repair-OpenClawWindowsLkg {
    if($env:OS-ne'Windows_NT'){throw 'Windows LKG recovery requires Windows'}
    $before=Get-InstalledOpenClawVersion
    if($before-notin@($GatewayRejectedVersion,$GatewayLkgVersion)){throw ('Windows LKG recovery refuses unexpected installed version '+$before)}
    Assert-NpmIntegrity $GatewayLkgVersion $GatewayLkgIntegrity
