        if(-not(Wait-GatewayRpc 90)){throw 'LKG Gateway direct RPC did not become healthy'}
        $health=Invoke-OpenClawFixedConfig @('gateway','health','--json');if($health.exit_code-ne0){throw 'LKG Gateway health failed'}
        $skills=Invoke-OpenClawFixedConfig @('skills','check','--agent','main','--json');if($skills.exit_code-ne0){throw 'LKG main-agent skills check failed'}
        Assert-Benchmark30
        $after=Get-InstalledOpenClawVersion
        $public=[ordered]@{schema=1;kind='kevin-openclaw-windows-lkg-recovery-public';generated_at=(Get-Date).ToString('o');state='OMEN_PROVEN';safe_for_public_repo=$true;before_version=$before;after_version=$after;validated_version=$GatewayLkgVersion;npm_integrity_verified=$true;config_backup_used=$useBackup;config_valid=$true;gateway_direct_rpc=$true;gateway_health=$true;main_skills_check=$true;benchmark_30_of_30=$true;rollback_available=$true;source_contract='Fixed Windows-only exact-version recovery to owner-approved validated LKG with fixed npm integrity, fixed Gateway task, fixed config validation/RPC/health/main-skills postconditions.';truth_boundary='No npm output, config body, credentials, paths, messages, prompts, or secrets are published.'}
        $receipt=Publish-SafeFixedReport 'reports/openclaw-windows-lkg-recovery-omen.json' 'openclaw-windows-lkg-recovery-public.json' $public 'kevin OpenClaw Windows LKG recovery telemetry'
        return [ordered]@{state='OMEN_PROVEN';receipt_sha256=$receipt;before_version=$before;after_version=$after;gateway_direct_rpc=$true;benchmark='30/30';config_backup_used=$useBackup}
    }catch{
        $primary=$_.Exception.Message
        try{Copy-Item -LiteralPath $savedConfig -Destination $config -Force}catch{}
        if($changed){try{Assert-NpmIntegrity $GatewayRejectedVersion $GatewayRejectedIntegrity;Install-ExactOpenClaw $GatewayRejectedVersion}catch{}}
        if($task){try{Start-ScheduledTask -TaskName 'OpenClaw Gateway'}catch{}}
        try{Assert-Benchmark30}catch{}
        throw ('OpenClaw Windows LKG recovery rollback completed: '+$primary)
    }
}
