name: Maintenance v1.3.36 Transactional LKG Config Proof

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate-maintenance-v1336-transactional-lkg-config.py'
      - 'control-plane/maintenance/kevin-maintenance-runner-v1.3.35.ps1'
      - '.github/workflows/maintenance-v1336-transactional-lkg-config.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proof:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate exact Maintenance v1.3.36
        run: python tools/generate-maintenance-v1336-transactional-lkg-config.py
      - name: Parse and forbid authority widening
        shell: pwsh
        run: |
          $p=(Resolve-Path 'control-plane/maintenance/kevin-maintenance-runner-v1.3.36.ps1')
          $tokens=$null;$errors=$null;$ast=[Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw $errors[0].Message}
          $names=@($ast.FindAll({param($n) $n -is [Management.Automation.Language.CommandAst]},$true)|ForEach-Object{$_.GetCommandName()}|Where-Object{$_}|ForEach-Object{$_.ToLowerInvariant()})
          foreach($bad in @('invoke-expression','iex','cmd.exe','kevin_shell')){if($names -contains $bad){throw "forbidden Maintenance command $bad"}}
      - name: Run full inherited self-test
        shell: pwsh
        run: |
          $env:KEVIN_MAINT_TEST_ROOT=Join-Path $env:RUNNER_TEMP 'kevin-maint-v1336-selftest'
          New-Item -ItemType Directory -Force -Path $env:KEVIN_MAINT_TEST_ROOT|Out-Null
          & .\control-plane\maintenance\kevin-maintenance-runner-v1.3.36.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){throw "Maintenance v1.3.36 selftest exit=$LASTEXITCODE"}
      - name: Prove operation parity
        run: python tools/check-maintenance-operation-parity.py control-plane/maintenance/kevin-maintenance-runner-v1.3.36.ps1
      - name: Assert transactional LKG safety and inherited fixes
        shell: pwsh
        run: |
          $t=[IO.File]::ReadAllText('control-plane/maintenance/kevin-maintenance-runner-v1.3.36.ps1')
          foreach($m in @(
            "version='1.3.36'",
            'lkg_config_compat=target_validates_untouched',
            'pretransition config snapshot hash mismatch',
            'LKG current-config compatibility validation failed',
            'LKG config validation unexpectedly modified config',
            'starting OpenClaw config not restored exactly',
            'starting OpenClaw version not restored',
            'safe_report_publish=bounded3',
            "@('cron','add','--name',`$name,'--every','5m'",
            'reconcile_maintenance_cron_backoff'
          )){if(-not$t.Contains($m)){throw "missing v1.3.36 invariant: $m"}}
          $s=$t.IndexOf('function Repair-OpenClawWindowsLkg')
          $e=$t.IndexOf('function Assert-MainAgentCanary',$s)
          if($s-lt0 -or $e-le$s){throw 'unable to isolate LKG recovery'}
          $b=$t.Substring($s,$e-$s)
          if($b.Contains('SAFE_BACKUP_NOT_PROVEN_FOR_DOWNGRADE') -or $b.Contains('SAFE_BACKUP_VERSION_NOT_COMPATIBLE')){throw 'stale metadata-only compatibility gate remains'}
          $installPos=$b.IndexOf('Install-ExactOpenClaw $GatewayLkgVersion')
          $validatePos=$b.IndexOf("Invoke-OpenClawFixedConfig @('config','validate','--json')")
          if($installPos-lt0 -or $validatePos-le$installPos){throw 'target install must precede compatibility validation'}
          if($b -notmatch 'config_sha_unchanged=\$true'){throw 'successful recovery config identity proof missing'}
          if($b -match '(?i)invoke-expression|kevin_shell|cmd\.exe'){throw 'LKG recovery widened authority'}
          if($t.Contains("Invoke-OpenClawFixedConfig @('automations'")){throw 'runtime-incompatible automations CLI regressed'}
          Write-Host 'MAINT_V1336_INVARIANTS_PASS transactional_config=true exact_rollback=true bounded_publish=true cron_alias=true authority_expansion=false'
      - name: Emit exact identity
        shell: pwsh
        run: |
          $sha=(Get-FileHash 'control-plane/maintenance/kevin-maintenance-runner-v1.3.36.ps1' -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "MAINT_V1336_CI_PROVEN sha256=$sha"
          "MAINT_V1336_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish exact proven candidate through Git database API
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo='hessmodee/KEVIN-WORK';$path='control-plane/maintenance/kevin-maintenance-runner-v1.3.36.ps1'
          $bytes=[IO.File]::ReadAllBytes($path)
          if((Get-FileHash $path -Algorithm SHA256).Hash.ToUpperInvariant() -ne $env:MAINT_V1336_SHA){throw 'candidate identity changed after proof'}
          $utf8=New-Object Text.UTF8Encoding($false)
          function Api([string]$method,[string]$endpoint,[object]$body=$null){
            if($null-eq$body){$out=gh api $endpoint 2>$null}else{$tmp=Join-Path $env:RUNNER_TEMP ('api-'+[guid]::NewGuid().ToString('N')+'.json');try{[IO.File]::WriteAllText($tmp,($body|ConvertTo-Json -Depth 20 -Compress),$utf8);$out=gh api --method $method $endpoint --input $tmp 2>$null}finally{Remove-Item $tmp -Force -ErrorAction SilentlyContinue}}
            if($LASTEXITCODE-ne0){return $null};return($out|ConvertFrom-Json)
          }
          $blob=Api 'POST' "repos/$repo/git/blobs" ([ordered]@{content=[Convert]::ToBase64String($bytes);encoding='base64'});if(-not$blob.sha){throw 'blob creation failed'}
          $ok=$false
          for($attempt=1;$attempt-le100;$attempt++){
            $ref=Api 'GET' "repos/$repo/git/ref/heads/main";if(-not$ref.object.sha){Start-Sleep -Milliseconds 250;continue}
            $parent=[string]$ref.object.sha;$pc=Api 'GET' "repos/$repo/git/commits/$parent";if(-not$pc.tree.sha){Start-Sleep -Milliseconds 250;continue}
            $tree=Api 'POST' "repos/$repo/git/trees" ([ordered]@{base_tree=[string]$pc.tree.sha;tree=@([ordered]@{path=$path;mode='100644';type='blob';sha=[string]$blob.sha})});if(-not$tree.sha){Start-Sleep -Milliseconds 250;continue}
            $commit=Api 'POST' "repos/$repo/git/commits" ([ordered]@{message='Publish CI-proven Maintenance v1.3.36';tree=[string]$tree.sha;parents=@($parent)});if(-not$commit.sha){Start-Sleep -Milliseconds 250;continue}
            $move=Api 'PATCH' "repos/$repo/git/refs/heads/main" ([ordered]@{sha=[string]$commit.sha;force=$false});if($move.object.sha-eq[string]$commit.sha){$ok=$true;break};Start-Sleep -Milliseconds 250
          }
          if(-not$ok){throw 'v1.3.36 publication exhausted bounded retries'}
          Write-Host "MAINT_V1336_PUBLISH_ACCEPTED sha256=$env:MAINT_V1336_SHA force=false"
