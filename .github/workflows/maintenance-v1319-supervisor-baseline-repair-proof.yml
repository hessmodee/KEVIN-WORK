name: Maintenance v1.3.19 Supervisor Baseline Repair Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/generate-maintenance-v1319-supervisor-baseline-repair.py'
      - 'tools/check-maintenance-operation-parity.py'
      - '.github/workflows/maintenance-v1319-supervisor-baseline-repair-proof.yml'

permissions:
  contents: write

jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate exact v1.3.19 candidate
        shell: pwsh
        run: python tools/generate-maintenance-v1319-supervisor-baseline-repair.py

      - name: Parse executable PowerShell and forbid eval shell
        shell: pwsh
        run: |
          $p=(Resolve-Path 'control-plane/maintenance/kevin-maintenance-runner-v1.3.19.ps1')
          $tokens=$null;$errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw $errors[0].Message}
          $commands=@($ast.FindAll({param($n) $n -is [Management.Automation.Language.CommandAst]},$true))
          $names=@($commands|ForEach-Object{$_.GetCommandName()}|Where-Object{$_}|ForEach-Object{$_.ToLowerInvariant()})
          foreach($forbidden in @('invoke-expression','iex','cmd.exe')){if($names -contains $forbidden){throw "forbidden executable command in AST: $forbidden"}}
          Write-Host "MAINT_V1319_AST_PASS commands=$($commands.Count)"

      - name: Run full Maintenance self-test
        shell: pwsh
        run: |
          $env:KEVIN_MAINT_TEST_ROOT=Join-Path $env:RUNNER_TEMP 'kevin-maint-v1319-selftest'
          New-Item -ItemType Directory -Force -Path $env:KEVIN_MAINT_TEST_ROOT|Out-Null
          & .\control-plane\maintenance\kevin-maintenance-runner-v1.3.19.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){throw "Maintenance v1.3.19 selftest exit=$LASTEXITCODE"}

      - name: Prove operation-set parity
        shell: pwsh
        run: python tools/check-maintenance-operation-parity.py control-plane/maintenance/kevin-maintenance-runner-v1.3.19.ps1

      - name: Assert coordinated trust-anchor repair invariants
        shell: pwsh
        run: |
          $t=[IO.File]::ReadAllText('control-plane/maintenance/kevin-maintenance-runner-v1.3.19.ps1')
          foreach($marker in @('47A0A1D0E3F744E972E2F2239F100CA2B009ABD3928D0281E4587A364B7C27AC','repair_supervisor_v171_forge_pin','benchmark-v1\\baseline.json','baselineStageObj.hashes.supervisor=$SupervisorV171Sha','SUPERVISOR IDLE NO_ELIGIBLE_MISSION','Benchmark baseline changed after staging; aborting TOCTOU')){if(-not$t.Contains($marker)){throw "missing repair invariant: $marker"}}
          Write-Host 'MAINT_V1319_COORDINATED_REPAIR_INVARIANTS_PASS'

      - name: Emit exact qualified identity
        shell: pwsh
        run: |
          $p='control-plane/maintenance/kevin-maintenance-runner-v1.3.19.ps1'
          $sha=(Get-FileHash $p -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "MAINT_V1319_CI_PROVEN sha256=$sha"
          "MAINT_V1319_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish exact qualified candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo='hessmodee/KEVIN-WORK';$path='control-plane/maintenance/kevin-maintenance-runner-v1.3.19.ps1'
          $bytes=[IO.File]::ReadAllBytes($path);$encoded=[Convert]::ToBase64String($bytes);$ok=$false
          for($attempt=1;$attempt -le 12;$attempt++){
            $body=[ordered]@{message='Publish CI-proven Maintenance v1.3.19';content=$encoded;branch='main'}
            $raw=gh api "repos/$repo/contents/$path?ref=main" 2>$null
            if($LASTEXITCODE -eq 0 -and $raw){$cur=$raw|ConvertFrom-Json;if($cur.sha){$body.sha=[string]$cur.sha}}
            $tmp=Join-Path $env:RUNNER_TEMP ('v1319-'+$attempt+'.json')
            [IO.File]::WriteAllText($tmp,($body|ConvertTo-Json -Compress),(New-Object Text.UTF8Encoding($false)))
            gh api --method PUT "repos/$repo/contents/$path" --input $tmp --silent 2>$null
            if($LASTEXITCODE -eq 0){$ok=$true;break}
            Start-Sleep -Seconds 2
          }
          if(-not$ok){throw 'v1.3.19 publication exhausted bounded retries'}
          Write-Host "MAINT_V1319_PUBLISH_ACCEPTED sha256=$env:MAINT_V1319_SHA"
