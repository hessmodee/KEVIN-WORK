name: Owner READY one leaf TEMP
on:
  push:
    branches: [bess/owner-ready-one-leaf-20260906]
    paths:
      - 'tools/transition-owner-ready-one-leaf.py'
      - '.github/workflows/owner-ready-one-leaf-temp.yml'
permissions:
  contents: write
jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bess/owner-ready-one-leaf-20260906
      - name: Apply and prove exact semantic transition
        run: python tools/transition-owner-ready-one-leaf.py
      - name: Stage raw blob without line-ending normalization
        shell: bash
        run: |
          blob=$(git hash-object -w --no-filters inbox/autonomy/work-items.json)
          git update-index --cacheinfo 100644,$blob,inbox/autonomy/work-items.json
          echo "RAW_BLOB=$blob"
      - name: Prove staged diff is exactly one line
        shell: bash
        run: |
          git diff --cached --check -- inbox/autonomy/work-items.json
          git diff --cached --numstat -- inbox/autonomy/work-items.json
          git diff --cached -- inbox/autonomy/work-items.json
          test "$(git diff --cached --numstat -- inbox/autonomy/work-items.json)" = $'1\t1\tinbox/autonomy/work-items.json'
      - name: Commit transition
        run: |
          git config user.name 'Kevin CI'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Advance real West Motor owner work to READY'
          git push origin HEAD:bess/owner-ready-one-leaf-20260906
