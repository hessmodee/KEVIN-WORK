name: Kevin Self-Reliance v1 Gate

on:
  push:
    branches: [kevin-self-reliance-v1]
  pull_request:
    paths:
      - .gitattributes
      - control-plane/maintenance/**
      - control-plane/intake/**
      - inbox/maintenance/packages/**
      - docs/engineering/SELF-RELIANCE-v1.md
      - .github/workflows/self-reliance-v1.yml

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Policy model
        working-directory: control-plane/maintenance
        run: |
          python -m py_compile self_maintenance_policy_v1.py test_self_maintenance_policy_v1.py
          python test_self_maintenance_policy_v1.py
      - name: Authority boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          files = {
            'maintenance': Path('control-plane/maintenance/kevin-maintenance-runner-v1.3.ps1').read_text(),
            'intake': Path('control-plane/intake/kevin-work-order-intake-v1.2.2.ps1').read_text(),
            'watchdog': Path('control-plane/maintenance/kevin-self-reliance-watchdog-v1.1.ps1').read_text(),
            'bootstrap': Path('inbox/maintenance/packages/bootstrap-self-reliance-v1.ps1').read_text(),
          }
          forbidden = ['invoke-expression','scriptblock::create','invoke-command','-encodedcommand','downloadstring','wscript.shell']
          for name,text in files.items():
              low=text.lower(); bad=[x for x in forbidden if x in low]
              assert not bad,(name,bad)
          m=files['maintenance']; i=files['intake']; w=files['watchdog']; b=files['bootstrap']
          assert "@('replace_pinned_component','restart_ui_bridge')" in m
          for alias in ["'maintenance_runner'","'work_order_intake'","'skill_lab_runner'"]:
              assert alias in m
          assert 'run_typed_maintenance' in i and 'kevin-maintenance-v1' in i
          assert "return Invoke-FixedPowerShell $MaintenancePath @('-CheckOnly') 600" in i
          assert "@('gateway','status','--require-rpc','--json')" in w
          assert "@('gateway','restart','--wait','30s','--json')" in w
          assert "@('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$MaintenancePath,'-CheckOnly')" in w
          assert '$MaxAttempts=3' in w and '$CooldownMinutes=15' in w and '$MaintenanceIntervalMinutes=5' in w
          assert 'caller_argv=false' in w and 'remote_payload=false' in w
          assert "$SourceRef='a556563a56e2756b8a9f87d3472028101465a580'" in b
          for sha in [
            '97F3FAE54C72F97D3634A6C070FD2E2C7E31B516FEB318CD3D1AECC4A17910C7',
            '55942149C892AD988E1AEE5A6FF7983D71D891ECA5B71FA20CC3FB9E7D03E903',
            '4A6ACA6EC40E027B29CCC4C34C50EDAE9EAE90E0C8FEB41B92ACEE44CCB53D93',
            '3B9D5B235E593C1CFF8CC9B7DED9E82FB958C2F7CD1F29FC813ECFA87E5C5483']:
              assert sha in b
          assert "$TaskName='Kevin Self-Reliance Watchdog v1'" in b
          assert '-MultipleInstances IgnoreNew' in b and '-RestartCount 3' in b and '-RunLevel Limited' in b
          assert 'ROLLBACK component files restored' in b and 'Assert-FreshBenchmark30' in b
          print('PASS fixed authority + bootstrap transaction boundary')
          PY

  windows-powershell:
    runs-on: windows-latest
    steps:
      - name: Pin Git checkout bytes
        shell: powershell
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Prove LF checkout and Windows PowerShell 5.1 compatibility
        shell: powershell
        run: |
          $files=@(
            'control-plane/maintenance/kevin-maintenance-runner-v1.3.ps1',
            'control-plane/intake/kevin-work-order-intake-v1.2.2.ps1',
            'control-plane/maintenance/kevin-self-reliance-watchdog-v1.1.ps1',
            'inbox/maintenance/packages/bootstrap-self-reliance-v1.ps1'
          )
          foreach($p in $files){
            $txt=[IO.File]::ReadAllText($p)
            if($txt.Contains("`r`n")){throw "CRLF checkout detected: $p"}
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "Parser failed: $p :: $($errors[0].Message)"}
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'control-plane/maintenance/kevin-maintenance-runner-v1.3.ps1' -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Maintenance self-test failed'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'control-plane/intake/kevin-work-order-intake-v1.2.2.ps1' -Mode SelfTest
          if($LASTEXITCODE -ne 0){throw 'Intake self-test failed'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'control-plane/maintenance/kevin-self-reliance-watchdog-v1.1.ps1' -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Watchdog self-test failed'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'inbox/maintenance/packages/bootstrap-self-reliance-v1.ps1' -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Bootstrap self-test failed'}
      - name: Prove immutable GitHub API bytes equal pinned SHA256
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ref='a556563a56e2756b8a9f87d3472028101465a580'
          $spec=@(
            @('control-plane/maintenance/kevin-maintenance-runner-v1.3.ps1','97F3FAE54C72F97D3634A6C070FD2E2C7E31B516FEB318CD3D1AECC4A17910C7'),
            @('control-plane/intake/kevin-work-order-intake-v1.2.2.ps1','55942149C892AD988E1AEE5A6FF7983D71D891ECA5B71FA20CC3FB9E7D03E903'),
            @('control-plane/maintenance/kevin-self-reliance-watchdog-v1.1.ps1','4A6ACA6EC40E027B29CCC4C34C50EDAE9EAE90E0C8FEB41B92ACEE44CCB53D93')
          )
          foreach($s in $spec){
            $p=$s[0];$expected=$s[1]
            $b64=gh api ("repos/hessmodee/KEVIN-WORK/contents/{0}?ref={1}" -f $p,$ref) --jq '.content'
            $tmp=Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($p))
            [IO.File]::WriteAllBytes($tmp,[Convert]::FromBase64String(($b64 -replace '\s','')))
            $actual=(Get-FileHash $tmp -Algorithm SHA256).Hash.ToUpperInvariant()
            if($actual -ne $expected){throw "API-byte SHA mismatch $p actual=$actual"}
            Write-Host "API_SHA256_PASS $actual $p"
          }
      - name: Canonical SHA256 identities
        shell: powershell
        run: |
          foreach($p in @(
            'control-plane/maintenance/kevin-maintenance-runner-v1.3.ps1',
            'control-plane/intake/kevin-work-order-intake-v1.2.2.ps1',
            'control-plane/maintenance/kevin-self-reliance-watchdog-v1.1.ps1',
            'inbox/maintenance/packages/bootstrap-self-reliance-v1.ps1'
          )){
            $h=(Get-FileHash $p -Algorithm SHA256).Hash.ToUpperInvariant()
            Write-Host ("CANONICAL_SHA256 {0} {1}" -f $h,$p)
          }
