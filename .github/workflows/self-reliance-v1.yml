name: Kevin Self-Reliance v1 Gate

on:
  push:
    branches: [kevin-self-reliance-v1]
  pull_request:
    paths:
      - .gitattributes
      - control-plane/maintenance/**
      - control-plane/intake/**
      - inbox/maintenance/packages/**
      - docs/engineering/SELF-RELIANCE-v1.md
      - .github/workflows/self-reliance-v1.yml

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Policy model
        working-directory: control-plane/maintenance
        run: |
          python -m py_compile self_maintenance_policy_v1.py test_self_maintenance_policy_v1.py
          python test_self_maintenance_policy_v1.py
      - name: Authority boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          files = {
            'maintenance': Path('control-plane/maintenance/kevin-maintenance-runner-v1.3.ps1').read_text(),
            'intake': Path('control-plane/intake/kevin-work-order-intake-v1.2.2.ps1').read_text(),
            'watchdog': Path('control-plane/maintenance/kevin-gateway-watchdog-v1.ps1').read_text(),
          }
          forbidden = ['invoke-expression','scriptblock::create','invoke-command','-encodedcommand','downloadstring','wscript.shell']
          for name,text in files.items():
              low=text.lower()
              bad=[x for x in forbidden if x in low]
              assert not bad,(name,bad)
          m=files['maintenance']
          i=files['intake']
          w=files['watchdog']
          assert "@('replace_pinned_component','restart_ui_bridge')" in m
          for alias in ["'maintenance_runner'","'work_order_intake'","'skill_lab_runner'"]:
              assert alias in m
          assert 'run_typed_maintenance' in i and 'kevin-maintenance-v1' in i
          assert "return Invoke-FixedPowerShell $MaintenancePath @('-CheckOnly') 600" in i
          assert "gateway','status','--require-rpc','--json" in w
          assert "gateway','restart','--wait','30s','--json" in w
          assert '$MaxAttempts=3' in w and '$CooldownMinutes=15' in w
          print('PASS fixed authority boundary')
          PY

  windows-powershell:
    runs-on: windows-latest
    steps:
      - name: Pin Git checkout bytes
        shell: powershell
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Prove LF checkout and Windows PowerShell 5.1 compatibility
        shell: powershell
        run: |
          $files=@(
            'control-plane/maintenance/kevin-maintenance-runner-v1.3.ps1',
            'control-plane/intake/kevin-work-order-intake-v1.2.2.ps1',
            'control-plane/maintenance/kevin-gateway-watchdog-v1.ps1'
          )
          foreach($p in $files){
            $txt=[IO.File]::ReadAllText($p)
            if($txt.Contains("`r`n")){throw "CRLF checkout detected: $p"}
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "Parser failed: $p :: $($errors[0].Message)"}
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'control-plane/maintenance/kevin-maintenance-runner-v1.3.ps1' -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Maintenance self-test failed'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'control-plane/intake/kevin-work-order-intake-v1.2.2.ps1' -Mode SelfTest
          if($LASTEXITCODE -ne 0){throw 'Intake self-test failed'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'control-plane/maintenance/kevin-gateway-watchdog-v1.ps1' -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Watchdog self-test failed'}
      - name: Canonical SHA256 identities
        shell: powershell
        run: |
          foreach($p in @(
            'control-plane/maintenance/kevin-maintenance-runner-v1.3.ps1',
            'control-plane/intake/kevin-work-order-intake-v1.2.2.ps1',
            'control-plane/maintenance/kevin-gateway-watchdog-v1.ps1'
          )){
            $h=(Get-FileHash $p -Algorithm SHA256).Hash.ToUpperInvariant()
            Write-Host ("CANONICAL_SHA256 {0} {1}" -f $h,$p)
          }
