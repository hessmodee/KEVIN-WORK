name: Supervisor History Contract Characterization
on:
  push:
    branches: ['chief-engineer/history-contract-20260902']
    paths:
      - 'tools/test-supervisor-history-contract.ps1'
      - '.github/workflows/supervisor-history-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  characterize:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exact source identity
        shell: pwsh
        run: |
          $hash=(Get-FileHash control-plane/autonomy/kevin-supervisor-v1.8.8.ps1 -Algorithm SHA256).Hash
          if($hash -ne 'F5D8C9740D384CC576D4BD70A3940B51AA1FCF398C7085E59DB20C01E9180138'){throw 'Baseline source changed'}
      - name: Windows PowerShell 5.1 known-bad characterization
        shell: powershell
        run: ./tools/test-supervisor-history-contract.ps1 -Mode CharacterizeBaseline
      - name: PowerShell 7 known-bad characterization
        shell: pwsh
        run: ./tools/test-supervisor-history-contract.ps1 -Mode CharacterizeBaseline
      - name: Strict acceptance must reject the known-bad baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $output=& pwsh -NoProfile -File ./tools/test-supervisor-history-contract.ps1 2>&1
          $code=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          $output | ForEach-Object { Write-Host $_ }
          if($code -eq 0 -or (($output | Out-String) -notmatch 'HISTORY_CONTRACT_NOT_CONFORMANT')){throw 'Strict gate did not reject baseline as required'}
          Write-Host 'NEGATIVE_CONTROL_PASS: strict runtime acceptance is RED, not bypassed'
