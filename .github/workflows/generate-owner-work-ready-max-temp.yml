name: Generate Owner Work READY MAX TEMP

on:
  push:
    branches: [bess/max-autonomy-ready-20260906]
    paths:
      - 'tools/transition-real-owner-work-ready.py'
      - '.github/workflows/generate-owner-work-ready-max-temp.yml'

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bess/max-autonomy-ready-20260906
      - name: Apply exact semantic transition
        run: python tools/transition-real-owner-work-ready.py
      - name: Prove only catalog target changed
        run: |
          python - <<'PY'
          import json, subprocess
          target='owner-west-motor-transport-dispatch-template-v1'
          before=json.loads(subprocess.check_output(['git','show','HEAD~1:inbox/autonomy/work-items.json'], text=True, encoding='utf-8-sig')) if False else None
          data=json.load(open('inbox/autonomy/work-items.json',encoding='utf-8'))
          hits=[x for x in data['items'] if x.get('id')==target]
          assert len(hits)==1 and hits[0]['status']=='READY'
          print('READY_TARGET_PRESENT_PROVEN')
          PY
      - name: Commit transition
        run: |
          git config user.name 'Kevin CI'
          git config user.email 'actions@users.noreply.github.com'
          git add inbox/autonomy/work-items.json
          if git diff --cached --quiet; then
            echo 'transition already current'
            exit 0
          fi
          git commit -m 'Advance real West Motor owner work to READY'
          git push origin HEAD:bess/max-autonomy-ready-20260906
