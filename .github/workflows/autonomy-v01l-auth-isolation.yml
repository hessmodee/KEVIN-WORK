name: Validate autonomy telemetry credential isolation v0.1l

on:
  push:
    branches: [kevin-autonomy-actuator-v0.1]
    paths:
      - 'control-plane/actuator/kevin-autonomy-bridge-v0.1l.ps1'
      - 'control-plane/actuator/KEVIN-AUTONOMY-TELEMETRY-AUTH-RESUME-v0.1l.ps1'
      - '.github/scripts/test-v01l-auth-isolation.ps1'
      - '.github/workflows/autonomy-v01l-auth-isolation.yml'

permissions:
  contents: write

jobs:
  windows-v01l:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kevin-autonomy-actuator-v0.1
      - name: Run Windows credential-isolation regression suite
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github/scripts/test-v01l-auth-isolation.ps1
          if($LASTEXITCODE -ne 0){throw 'v0.1l auth isolation regression suite failed'}
