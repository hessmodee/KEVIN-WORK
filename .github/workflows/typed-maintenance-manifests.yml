name: Typed Maintenance Manifest Gate

on:
  push:
    branches: [kevin-typed-maintenance-v1.2]
    paths:
      - control-plane/maintenance/manifests/**
      - control-plane/maintenance/typed_maintenance_policy.py
      - .github/workflows/typed-maintenance-manifests.yml
  pull_request:
    paths:
      - control-plane/maintenance/manifests/**
      - control-plane/maintenance/typed_maintenance_policy.py
      - .github/workflows/typed-maintenance-manifests.yml

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate prepared live manifests
        working-directory: control-plane/maintenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from typed_maintenance_policy import validate

          skill=json.loads(Path('manifests/skill-lab-recovery-v103.json').read_text())
          ui=json.loads(Path('manifests/ui-bridge-restart-v033.json').read_text())
          validate(skill); validate(ui)

          assert skill['operation']=='replace_pinned_file'
          assert skill['target_alias']=='skill_lab_runner'
          assert skill['source_sha256']=='A771B050A5DA3D49BC3445BE4C20B4BF928C86AFA22E6634550CFBA4F30DB865'
          assert skill['expected_current_sha256']=='4275BA67602BFBD00CD4AF14D77A41C57E6D72A4F46B5E44CCAAC61121479CAB'
          assert skill['expected_after_sha256']==skill['source_sha256']

          assert ui['operation']=='restart_ui_bridge'
          assert ui['target_alias']=='ui_bridge_runner'
          assert ui['expected_current_sha256']=='5516F60E118D9714A969322C930E525DF722DB099CF10BF5EB23822557598B42'
          assert ui['task_name']=='Kevin UI Bridge v0.3'
          assert ui['heartbeat_timeout_seconds']==15

          for m in (skill,ui):
              assert m['authority_class']=='GREEN'
              assert m['authority_delta']=='NONE'
              assert m['production_effect']=='NONE'
              assert m['owner_policy']=='Kevin Owner Authorization v1'
              assert m['preauthorized'] is True
          print('PASS 2/2 prepared typed GREEN maintenance manifests')
          PY
