name: HQ v10 Live Truth Proof

on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/hq-owner-console-v10.js'
      - 'docs/ops/embed.html'
      - 'docs/ops/ops-live-truth-v2.js'
      - 'docs/sw.js'
      - 'tools/test-hq-v10.py'
      - '.github/workflows/hq-v10-live-truth-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truth-ui-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check docs/hq-owner-console-v10.js
          node --check docs/ops/ops-live-truth-v2.js
      - name: Owner truth invariants
        run: python tools/test-hq-v10.py
