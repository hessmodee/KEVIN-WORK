name: Autonomy Selector v1.1 Proof

on:
  push:
    branches: [main]
    paths:
      - 'control-plane/autonomy/kevin-work-selector-v1.1.py'
      - 'control-plane/autonomy/failure-families-v1.json'
      - 'control-plane/autonomy/standing-programs-v1.json'
      - 'inbox/autonomy/work-items.json'
      - 'inbox/autonomy/state.json'
      - 'tests/test_autonomy_selector_v11_contract.py'
      - '.github/workflows/autonomy-selector-v11-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile selector and regression contract
        run: python -m py_compile control-plane/autonomy/kevin-work-selector-v1.1.py tests/test_autonomy_selector_v11_contract.py
      - name: Semantic failure-family selftest
        run: python control-plane/autonomy/kevin-work-selector-v1.1.py --selftest
      - name: Fixed positive and negative fixtures plus current-inventory oracle
        run: python tests/test_autonomy_selector_v11_contract.py
