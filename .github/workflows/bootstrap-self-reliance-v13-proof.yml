name: Self-Reliance Bootstrap v1.3 End-to-End Proof

on:
  push:
    paths:
      - 'inbox/maintenance/packages/bootstrap-self-reliance-v1.3.ps1'
      - 'control-plane/maintenance/kevin-self-reliance-watchdog-v1.2.ps1'
      - '.github/workflows/bootstrap-self-reliance-v13-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runtime-contract:
    runs-on: windows-latest
    steps:
      - name: Pin LF checkout
        shell: powershell
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Hash parser and authority regression gate
        shell: powershell
        run: |
          $boot='inbox/maintenance/packages/bootstrap-self-reliance-v1.3.ps1'
          $watch='control-plane/maintenance/kevin-self-reliance-watchdog-v1.2.ps1'
          foreach($p in @($boot,$watch)){
            $txt=[IO.File]::ReadAllText($p)
            if($txt.Contains("`r`n")){throw "CRLF checkout detected $p"}
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "parser failed $p : $($errors[0].Message)"}
            if($txt -match '(?m)\breturn\$'){throw "return-variable token adjacency regression $p"}
            foreach($bad in @('Invoke-Expression','ScriptBlock]::Create','-EncodedCommand','DownloadString','WScript.Shell')){
              if($txt -match [regex]::Escape($bad)){throw "forbidden execution primitive $bad in $p"}
            }
          }
          $h=(Get-FileHash $boot -Algorithm SHA256).Hash.ToUpperInvariant()
          if($h -ne 'C6A2972B128C7128C9D4B5B1A6B0180EC2044EE07FA10B40060396A4C1665B4D'){throw "bootstrap hash mismatch $h"}
          Write-Host "BOOTSTRAP_V13_SHA256_PASS=$h"

      - name: Exact component bytes and Windows PowerShell self-tests
        shell: powershell
        run: |
          $cases=@(
            @('control-plane/maintenance/kevin-maintenance-runner-v1.3.ps1','97F3FAE54C72F97D3634A6C070FD2E2C7E31B516FEB318CD3D1AECC4A17910C7','-SelfTest','KEVIN MAINTENANCE v1.3 SELFTEST PASS'),
            @('control-plane/intake/kevin-work-order-intake-v1.2.2.ps1','55942149C892AD988E1AEE5A6FF7983D71D891ECA5B71FA20CC3FB9E7D03E903','-Mode SelfTest','KEVIN WORK ORDER INTAKE v1.2 SELFTEST PASS'),
            @('control-plane/maintenance/kevin-self-reliance-watchdog-v1.2.ps1','E068031536E3F44BE58864228C26217B3C88DBC7349EF779532E2177787BD00B','-SelfTest','KEVIN SELF-RELIANCE WATCHDOG v1.2 SELFTEST PASS')
          )
          foreach($c in $cases){
            $p=$c[0];$expected=$c[1];$argsText=$c[2];$marker=$c[3]
            $h=(Get-FileHash $p -Algorithm SHA256).Hash.ToUpperInvariant()
            if($h -ne $expected){throw "component hash mismatch $p actual=$h"}
            if($argsText -eq '-Mode SelfTest'){$out=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p -Mode SelfTest 2>&1|Out-String}
            else{$out=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p -SelfTest 2>&1|Out-String}
            if($LASTEXITCODE -ne 0 -or $out -notmatch [regex]::Escape($marker)){throw "component self-test failed $p"}
            Write-Host "COMPONENT_PASS $p $h"
          }

      - name: Bootstrap runtime self-test
        shell: powershell
        run: |
          $p='inbox/maintenance/packages/bootstrap-self-reliance-v1.3.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p -SelfTest
          if($LASTEXITCODE -ne 0){throw 'bootstrap self-test failed'}

      - name: Real Scheduled Task register start assert unregister round-trip
        shell: powershell
        run: |
          $p='inbox/maintenance/packages/bootstrap-self-reliance-v1.3.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p -TaskContractTest
          if($LASTEXITCODE -ne 0){throw 'task contract round-trip failed'}

      - name: Live-root compatibility proof
        shell: powershell
        run: |
          $p='control-plane/maintenance/kevin-maintenance-runner-v1.2.ps1'
          $h=(Get-FileHash $p -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "MAINTENANCE_V12_CANONICAL_SHA256=$h"
          if($h -ne '3B9D5B235E593C1CFF8CC9B7DED9E82FB958C2F7CD1F29FC813ECFA87E5C5483'){throw 'v1.2 canonical root does not match Omen live root'}
          Write-Host 'LIVE_ROOT_COMPATIBILITY_PASS'
